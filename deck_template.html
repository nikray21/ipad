<!DOCTYPE html>
<html lang="en" data-theme="cream">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>__TITLE__</title>
<style>
/* ============================================================
   NikRayani Terminal — Episode Deck
   Palettes lifted verbatim from the Terminal's styles.css so the
   deck and the dashboard are unmistakably the same product.
   ============================================================ */
:root[data-theme="cream"] {
  color-scheme: light;
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f2f0e9;
  --border:rgba(25,25,25,0.11); --ink:#1f1e1d; --ink-2:#40403c; --muted:#6f6e66;
  --grid:#e6e3da; --accent:#c2603f; --cool:#2a78d6;
  --s1:#c2603f; --s2:#2a78d6;
  --good:#257a33; --warn:#a9741a; --crit:#b8352f;
  --shadow:0 1px 2px rgba(25,25,25,0.05);
  --accent-wash:rgba(194,96,63,0.09);
  --good-wash:rgba(37,122,51,0.10); --crit-wash:rgba(184,53,47,0.09); --warn-wash:rgba(169,116,26,0.10);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#1b1a19; --surface:#262624; --surface-2:#30302e;
  --border:rgba(240,238,230,0.10); --ink:#f0eee6; --ink-2:#c2c0b6; --muted:#8f8d84;
  --grid:#34322f; --accent:#d97757; --cool:#4d90da;
  --s1:#d67350; --s2:#4d90da;
  --good:#2f9e44; --warn:#e8a33d; --crit:#e05252;
  --shadow:none;
  --accent-wash:rgba(217,119,87,0.11);
  --good-wash:rgba(47,158,68,0.13); --crit-wash:rgba(224,82,82,0.12); --warn-wash:rgba(232,163,61,0.12);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
}
.num{font-variant-numeric:tabular-nums}

/* ---------- Stage: a fixed 1920x1080 canvas scaled to the window ---------- */
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;flex:none}
body.camzone{display:block;align-items:initial;justify-content:initial}

.slide{
  position:absolute; inset:0; padding:74px 96px 92px;
  display:none; flex-direction:column; background:var(--bg);
}
.slide.on{display:flex}

/* ---------- Chrome ---------- */
.kicker{
  display:flex; align-items:center; gap:14px;
  font-size:15px; font-weight:700; letter-spacing:.17em; color:var(--muted);
  text-transform:uppercase; margin-bottom:6px;
}
.kicker .no{color:var(--accent)}
.kicker .src{
  margin-left:auto; font-size:15px; letter-spacing:.08em; font-weight:600;
  color:var(--muted); text-transform:none;
}
h1.head{font-size:64px;font-weight:760;letter-spacing:-.022em;line-height:1.03;margin-bottom:10px}
h1.head.sm{font-size:52px}
.sub{font-size:25px;color:var(--ink-2);line-height:1.4;max-width:1500px;font-weight:400}

.footer{
  position:absolute; left:96px; right:96px; bottom:34px;
  display:flex; align-items:center; gap:16px;
  font-size:13px; color:var(--muted); letter-spacing:.05em;
  border-top:1px solid var(--border); padding-top:13px;
}
.footer .mark{font-weight:700;letter-spacing:.16em}
.footer .mark span{color:var(--muted);font-weight:500}
.footer .pg{margin-left:auto;font-variant-numeric:tabular-nums}
.footer .stamp{color:var(--muted)}

/* The "why this matters" band — the beginner payoff on every slide */
.why{
  margin-top:auto; display:flex; gap:16px; align-items:flex-start;
  background:var(--accent-wash); border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0; padding:18px 24px;
}
.why .lbl{
  flex:none; font-size:15px; font-weight:800; letter-spacing:.11em;
  color:var(--accent); text-transform:uppercase; padding-top:4px; width:132px;
}
.why p{font-size:22px;line-height:1.45;color:var(--ink)}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;min-height:0;padding:14px 0}
.body.top{justify-content:flex-start}

/* ---------- Title slide ---------- */
.slide.title{padding:0 96px;justify-content:center}
.title .tk{font-size:17px;font-weight:700;letter-spacing:.3em;color:var(--accent);margin-bottom:26px}
.title h1{font-size:112px;font-weight:800;letter-spacing:-.03em;line-height:.98}
.title .ident{display:flex;align-items:baseline;gap:20px;margin-top:20px;font-size:26px;color:var(--muted);letter-spacing:.08em}
.title .hook{
  margin-top:52px; font-size:44px; line-height:1.24; font-weight:600;
  color:var(--ink); max-width:1420px; letter-spacing:-.012em;
}
.title .hook em{font-style:normal;color:var(--accent)}
.title .pxrow{display:flex;align-items:baseline;gap:26px;margin-top:46px}
.title .px{font-size:76px;font-weight:750;letter-spacing:-.02em}
.title .chg{font-size:34px;font-weight:650}
.chg.dn{color:var(--crit)} .chg.up{color:var(--good)}

/* ---------- Big statement number ---------- */
.mega{display:flex;align-items:baseline;gap:34px;flex-wrap:wrap}
.mega .v{font-size:170px;font-weight:800;letter-spacing:-.035em;line-height:.92;color:var(--accent)}
.mega .v.ink{color:var(--ink)}
.mega .v.bad{color:var(--crit)}
.mega .v.good{color:var(--good)}
.mega .cap{font-size:27px;color:var(--ink-2);max-width:620px;line-height:1.36}

/* ---------- Stat tiles ---------- */
.tiles{display:grid;gap:16px}
.tile{
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:26px 28px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:7px;
}
.tile .tv{font-size:52px;font-weight:770;letter-spacing:-.02em;line-height:1}
.tile .tv.sm{font-size:40px}
.tile .tl{font-size:17px;color:var(--ink-2);font-weight:600}
.tile .tn{font-size:15px;color:var(--muted);line-height:1.38}
.tile.accent .tv{color:var(--accent)}
.tile.good .tv{color:var(--good)} .tile.bad .tv{color:var(--crit)} .tile.warn .tv{color:var(--warn)}

/* ---------- Quote ---------- */
.quote{
  background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent);
  border-radius:0 12px 12px 0; padding:34px 40px; box-shadow:var(--shadow);
}
.quote p{font-size:34px;line-height:1.36;font-weight:500;letter-spacing:-.008em}
.quote .attr{margin-top:18px;font-size:16px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}

/* ---------- Charts ---------- */
.chartwrap{width:100%;flex:1;min-height:0;display:flex;flex-direction:column}
svg{width:100%;height:100%;overflow:visible;display:block}
svg text{font-family:system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.ax{font-size:16px;fill:var(--muted)}
.axb{font-size:17px;fill:var(--ink-2);font-weight:600}
.vlab{font-size:20px;fill:var(--ink);font-weight:700}
.vlab.sm{font-size:17px}
.gridline{stroke:var(--grid);stroke-width:1}
.bar{fill:var(--accent)}
.bar.mut{fill:var(--muted);opacity:.42}
.bar.cool{fill:var(--s2)}
.bar.s1{fill:var(--s1)}
.bar.s2{fill:var(--s2)}
.bar.good{fill:var(--good)} .bar.bad{fill:var(--crit)}
.snk{stroke:none}
.snk.trunk{fill:var(--s1);opacity:.78}
.snk.cost{fill:var(--muted)}
.snk.gain{fill:var(--s2)}
.snk.bad{fill:var(--crit)}
.gg-track{stroke:var(--grid)}
.gg-fill{stroke:var(--s1)}
.dn-total{stroke:var(--grid)}
.dn-a{stroke:var(--s1)} .dn-b{stroke:var(--s2)}
.dn-a-s{stroke:var(--s1)} .dn-b-s{stroke:var(--s2)}
.dn-a-fill{fill:var(--s1)} .dn-b-fill{fill:var(--s2)}
.tm{stroke:var(--bg);stroke-width:2}
.tm.ok{fill:var(--good);opacity:.82}
.tm.warn{fill:var(--warn);opacity:.85}
.tm.bad{fill:var(--crit);opacity:.9}
.tm-t{fill:#0d1b0f;font-weight:650}
.tm-v{fill:#0d1b0f;font-weight:800;font-variant-numeric:tabular-nums}
.fv-under{fill:var(--good);opacity:.62}
.fv-fair{fill:var(--warn);opacity:.70}
.fv-over{fill:var(--crit);opacity:.30}
.fv-t-under{fill:var(--good)} .fv-t-fair{fill:var(--warn)} .fv-t-over{fill:var(--crit)}
/* A band that is mechanical rather than a verdict — a merger collar — must not
   be painted green/red: "below the floor" is the WORST outcome for a holder, so
   green there says the opposite of the truth. Neutral zones, labels carry it. */
.fv-n-out{fill:var(--muted);opacity:.22} .fv-n-mid{fill:var(--s2);opacity:.40}
.fv-tn-out{fill:var(--muted)} .fv-tn-mid{fill:var(--s2)}
.legend{display:flex;gap:32px;font-size:18px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:3px;margin-right:9px;vertical-align:-2px}

/* entry animation — bars grow, lines draw */
.slide.on .grow{animation:grow .52s cubic-bezier(.2,.7,.3,1) both}
.slide.on .growX{animation:growX .58s cubic-bezier(.2,.7,.3,1) both}
.slide.on .sweep{animation:draw 1.05s cubic-bezier(.35,.65,.25,1) both}
.slide.on .pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
.slide.on .bloom{animation:bloom .72s cubic-bezier(.34,1.3,.5,1) both}
.slide.on .snap .row{animation:rowin .46s cubic-bezier(.2,.7,.3,1) both}
.slide.on .snap .pip.on{animation:pipin .34s cubic-bezier(.2,.9,.3,1.5) both}
.slide.on .draw{animation:draw .9s cubic-bezier(.3,.6,.3,1) both}
.slide.on .fade{animation:fade .5s ease both}
@keyframes grow{from{transform:scaleY(.001)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(.001)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes bloom{0%{opacity:0;transform:scale(.12)}60%{opacity:1;transform:scale(1.06)}
  100%{opacity:1;transform:scale(1)}}
@keyframes pipin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes rowin{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* The text slides used to appear fully formed while every chart slide built
   itself, which read as a bug. Same entrance, staggered by position. */
.slide.on .finds>.find,.slide.on .tiles>.tile,.slide.on .ww .wcol li,
.slide.on .whylist>p,.slide.on .mega>*,.slide.on .quote>*,
.slide.on .callrow>*,.slide.on.title>.tk,.slide.on.title>h1,
.slide.on.title>.ident,.slide.on.title>.pxrow,.slide.on.title>.hook{animation:rowin .5s cubic-bezier(.2,.7,.3,1) both}
.slide.on .finds>.find:nth-child(1),.slide.on .tiles>.tile:nth-child(1),
.slide.on .whylist>p:nth-child(1),.slide.on .mega>*:nth-child(1),
.slide.on .quote>*:nth-child(1),.slide.on.title>.tk{animation-delay:60ms}
.slide.on .finds>.find:nth-child(2),.slide.on .tiles>.tile:nth-child(2),
.slide.on .whylist>p:nth-child(2),.slide.on .mega>*:nth-child(2),
.slide.on .quote>*:nth-child(2),.slide.on.title>h1{animation-delay:170ms}
.slide.on .finds>.find:nth-child(3),.slide.on .tiles>.tile:nth-child(3),
.slide.on .whylist>p:nth-child(3),.slide.on .callrow>*:nth-child(1),
.slide.on.title>.ident{animation-delay:280ms}
.slide.on .finds>.find:nth-child(4),.slide.on .tiles>.tile:nth-child(4),
.slide.on .whylist>p:nth-child(4),.slide.on .callrow>*:nth-child(2),
.slide.on.title>.pxrow{animation-delay:390ms}
.slide.on .finds>.find:nth-child(n+5),.slide.on .tiles>.tile:nth-child(n+5),
.slide.on .whylist>p:nth-child(n+5),.slide.on.title>.hook{animation-delay:500ms}
.slide.on .ww .wcol li:nth-child(1){animation-delay:120ms}
.slide.on .ww .wcol li:nth-child(2){animation-delay:210ms}
.slide.on .ww .wcol li:nth-child(3){animation-delay:300ms}
.slide.on .ww .wcol li:nth-child(4){animation-delay:390ms}
.slide.on .ww .wcol li:nth-child(n+5){animation-delay:480ms}
@media (prefers-reduced-motion:reduce){.slide.on .finds>.find,.slide.on .tiles>.tile,
  .slide.on .ww .wcol li,.slide.on .whylist>p,.slide.on .mega>*,
  .slide.on .quote>*,.slide.on .callrow>*,.slide.on.title>*{animation:none}}
@media (prefers-reduced-motion:reduce){.slide.on .grow,.slide.on .growX,.slide.on .draw,
  .slide.on .sweep,.slide.on .pop,.slide.on .fade,.slide.on .bloom,
  .slide.on .snap .row,.slide.on .snap .pip.on{animation:none}}

/* ---------- Verdict ---------- */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.vt{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:19px 21px;box-shadow:var(--shadow)}
.vt .d{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.vt .r{font-size:31px;font-weight:800;margin:5px 0 6px;letter-spacing:-.01em}
.vt .f{font-size:15.5px;color:var(--ink-2);line-height:1.36}
.vt.strong{border-color:color-mix(in srgb,var(--good) 42%,transparent);background:var(--good-wash)}
.vt.strong .r{color:var(--good)}
.vt.risk{border-color:color-mix(in srgb,var(--crit) 42%,transparent);background:var(--crit-wash)}
.vt.risk .r{color:var(--crit)}
.vt.weak,.vt.mixed{border-color:color-mix(in srgb,var(--warn) 42%,transparent);background:var(--warn-wash)}
.vt.weak .r,.vt.mixed .r{color:var(--warn)}

.callrow{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;margin-top:4px}
.callbox{
  background:var(--accent-wash); border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  border-radius:12px; padding:24px 28px; display:flex; flex-direction:column; justify-content:center;
}
.callbox .cl{font-size:15px;letter-spacing:.15em;font-weight:800;color:var(--accent);text-transform:uppercase}
.callbox .cv{font-size:66px;font-weight:820;letter-spacing:-.025em;line-height:1;margin:6px 0 10px}
.callbox .cd{font-size:19px;color:var(--ink-2);line-height:1.4}

/* fair value calculator */
.calc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;box-shadow:var(--shadow)}
.calc h4{font-size:15px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:800}
.asm{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.asm .a{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.asm .a.sel{border-color:var(--accent);background:var(--accent-wash)}
.asm .a .an{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.asm .a .av{font-size:25px;font-weight:750;letter-spacing:-.01em}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cs{border:1px solid var(--border);border-radius:9px;padding:12px 14px;background:var(--surface-2)}
.cs.base{border-color:var(--accent);background:var(--accent-wash)}
.cs .cn{font-size:15px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800}
.cs .cfv{font-size:34px;font-weight:790;letter-spacing:-.02em;margin-top:3px}
.cs .cr{font-size:15px;color:var(--ink-2);margin-top:2px}
.cs .cr b{font-weight:750}
.hintline{font-size:15px;color:var(--muted);margin-top:11px;letter-spacing:.03em}

/* ---------- Why-list (verdict reasoning) ---------- */
.whylist{display:flex;flex-direction:column;gap:11px}
.whylist p{font-size:20px;line-height:1.45;color:var(--ink-2);padding-left:20px;border-left:2px solid var(--border)}
.whylist p b{color:var(--ink);font-weight:680}

/* ---------- Source chips — what this analysis was built from ---------- */
.chips{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:40px}
.chips .cl{font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-right:6px}
.chips .ch{display:inline-flex;align-items:baseline;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:7px;padding:7px 13px;font-size:15px}
.chips .ch b{font-weight:750;letter-spacing:.03em}
.chips .ch span{color:var(--muted);font-size:15px}

/* ---------- Snapshot: radar beside scored rows ---------- */
.snap{display:grid;grid-template-columns:0.82fr 1.18fr;gap:34px;align-items:center}
.snap-radar{width:100%;height:460px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:210px 200px 1fr;gap:20px;align-items:center;
  padding:15px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .rn{font-size:21px;font-weight:700}
.row .rf{font-size:17.5px;color:var(--ink-2);line-height:1.34}
.pips{display:flex;gap:5px}
.pip{width:30px;height:17px;border-radius:4px;background:var(--grid)}
.pip.on{background:var(--good)}
.pip.on.warn{background:var(--warn)}
.pip.on.bad{background:var(--crit)}

/* ---------- Findings: the work nobody else did ---------- */
.finds{display:flex;flex-direction:column;gap:15px}
.find{display:grid;grid-template-columns:74px 1fr;gap:24px;align-items:start;
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:0 12px 12px 0;padding:22px 28px;box-shadow:var(--shadow)}
.find .fn{font-size:44px;font-weight:820;line-height:.9;color:var(--accent);
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.find .fc{font-size:23px;line-height:1.38;color:var(--ink)}
.find .fw{margin-top:9px;font-size:15px;color:var(--muted);letter-spacing:.02em}
.find .fw b{color:var(--ink-2);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  font-size:15px;margin-right:9px}

/* ---------- Working / watch two-column checklist ---------- */
.ww{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.wcol{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:24px 26px;box-shadow:var(--shadow)}
.wcol.good{border-color:color-mix(in srgb,var(--good) 42%,transparent);background:var(--good-wash)}
.wcol.bad{border-color:color-mix(in srgb,var(--warn) 46%,transparent);background:var(--warn-wash)}
.wcol h4{font-size:15px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:16px}
.wcol.good h4{color:var(--good)} .wcol.bad h4{color:var(--warn)}
.wcol li{display:flex;gap:14px;align-items:flex-start;padding:9px 0;font-size:19.5px;
  line-height:1.38;list-style:none}
.wcol .ic{flex:none;font-weight:800;width:18px;font-size:20px}
.wcol.good .ic{color:var(--good)} .wcol.bad .ic{color:var(--warn)}

/* ---------- Presenter notes drawer (never on camera unless summoned) ---------- */
#notes{
  position:fixed; left:0; right:0; bottom:0; max-height:42vh; overflow:auto;
  background:var(--surface); border-top:2px solid var(--accent);
  padding:20px 30px 24px; display:none; z-index:60;
  box-shadow:0 -14px 40px rgba(0,0,0,.22);
}
#notes.on{display:block}
#notes .nh{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:9px}
#notes p{font-size:17.5px;line-height:1.5;color:var(--ink);max-width:1500px}

/* ---------- Grid overview ---------- */
#grid{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;overflow:auto;padding:34px}
#grid.on{display:block}
#grid .gg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
#grid .gc{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 14px;cursor:pointer}
#grid .gc:hover{border-color:var(--accent)}
#grid .gc.cur{border-color:var(--accent);background:var(--accent-wash)}
#grid .gc .gn{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.1em}
#grid .gc .gt{font-size:14px;margin-top:4px;line-height:1.28;color:var(--ink)}
#grid .gc .go{display:inline-block;margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.12em;
  color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 5px}
#grid .gc.opt{opacity:.72}
#grid .tot{font-size:13px;color:var(--muted);margin-bottom:15px;letter-spacing:.04em}
#grid h3{font-size:13px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-bottom:15px;font-weight:800}

/* ---------- Presenter HUD ---------- */
#hud{
  position:fixed; top:12px; right:14px; z-index:65;
  display:none; gap:9px; align-items:center;
  font-size:12.5px; color:var(--muted); letter-spacing:.06em;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:6px 11px; font-variant-numeric:tabular-nums;
}
#hud.on{display:flex}
#hud b{color:var(--ink);font-weight:700}
#hud .over{color:var(--crit)}

/* ---------- Print → PDF ---------- */
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto}
  #stage{transform:none!important;width:1920px;height:auto}
  .slide{display:flex!important;position:relative;page-break-after:always;height:1080px}
  #notes,#grid,#hud{display:none!important}
}
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud"><span id="hud-slide"></span><span>·</span><span id="hud-target"></span><span>·</span><b id="hud-clock">0:00</b></div>

<div id="notes"><div class="nh" id="notes-head">Presenter notes</div><p id="notes-body"></p></div>

<div id="grid"><h3>All slides — click to jump · Esc to close</h3>
<div class="tot" id="grid-total"></div><div class="gg" id="grid-cells"></div></div>

<script>
const DECK = __PAYLOAD__;
</script>
<script>
(() => {
"use strict";

/* ============================================================
   Formatting
   ============================================================ */
const f1 = n => n.toFixed(1);
const f2 = n => n.toFixed(2);
const money = n => "$" + n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const usd0 = n => "$" + Math.round(n).toLocaleString("en-US");
const pct = (n, d=1) => (n>0?"+":"") + n.toFixed(d) + "%";
const bn = n => "$" + (n/1000).toFixed(2) + "B";
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtT = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");

/* ============================================================
   SVG chart engine — hand-rolled, theme-reactive, dependency-free
   ============================================================ */
const FMT = {
  auto: v => (Math.abs(v) >= 1000 ? (v/1000).toFixed(2)+"B" : Math.round(v)+"M"),
  usdB: v => (v < 0 ? "−$" : "$") + (Math.abs(v) / 1000).toFixed(1) + "B",
  usdM: v => (v < 0 ? "−$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-US") + "M",
  pct:  v => (v < 0 ? "−" : "") + Math.abs(v).toFixed(1) + "%",
  plain: v => Math.round(v).toLocaleString("en-US"),
  plain0: v => Math.round(v).toLocaleString("en-US"),
  plain1: v => v.toFixed(1),
  usd0: v => (v < 0 ? "−$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-US"),
  usd2: v => (v < 0 ? "−$" : "$") + Math.abs(v).toFixed(2),
  pct0: v => (v < 0 ? "−" : "") + Math.abs(v).toFixed(0) + "%",
};

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, txt){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (txt != null) n.textContent = txt;
  return n;
}
function svgRoot(w, h){
  const s = el("svg", {viewBox:`0 0 ${w} ${h}`, preserveAspectRatio:"xMidYMid meet"});
  return s;
}

/* Vertical bars with a value label above each. */
function chartBars(spec){
  const W = 1660, H = spec.height || 470, PT = 54, PL = 20, PR = 20;
  const s = svgRoot(W, H);
  const vals = spec.series.map(d => d.v);
  // Diverging charts need a deeper bottom gutter: a negative bar's value label
  // hangs below the bar and would otherwise land on the category label.
  const diverging = spec.zeroLine && Math.min(...vals) < 0;
  const PB = diverging ? 130 : 62;
  const axY = diverging ? H - PB + 76 : H - PB + 30;
  const subY = diverging ? H - PB + 100 : H - PB + 53;
  const max = spec.max != null ? spec.max : Math.max(...vals) * 1.16;
  // Headroom below zero too, so a small negative bar and its label both fit.
  const min = spec.min != null ? spec.min : Math.min(0, ...vals) * 1.55;
  const plotH = H - PB - PT, plotW = W - PL - PR;
  const y = v => PT + plotH - ((v - min) / (max - min)) * plotH;

  (spec.gridlines || 4) && [...Array(spec.gridlines || 4)].forEach((_, i) => {
    const gv = min + (max - min) * (i + 1) / ((spec.gridlines || 4) + 1);
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:y(gv), y2:y(gv), class:"gridline"}));
  });

  // Diverging series need an explicit zero rule, or a small negative bar reads
  // as a short positive one.
  if (spec.zeroLine && min < 0) {
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:y(0), y2:y(0),
      stroke:"var(--ink-2)", "stroke-width":"2", opacity:".65"}));
  }

  const n = spec.series.length;
  const slot = plotW / n, bw = Math.min(spec.barWidth || 120, slot * 0.62);
  spec.series.forEach((d, i) => {
    const cx = PL + slot * i + slot / 2;
    const top = y(d.v), base = y(Math.max(min, 0));
    const g = el("g", {class:"grow", style:`transform-origin:${cx}px ${base}px;animation-delay:${i*55}ms`});
    g.appendChild(el("rect", {
      x: cx - bw/2, y: Math.min(top, base), width: bw, height: Math.max(2, Math.abs(base - top)),
      rx: 4, class: "bar" + (d.cls ? " " + d.cls : "")
    }));
    s.appendChild(g);
    // A negative bar hangs below zero, so its label goes under it — placing it
    // "above the top" would print it inside the bar.
    const ly = d.v < 0 ? top + 32 : top - 15;
    const lab = el("text", {x:cx, y: ly, "text-anchor":"middle", class:"vlab fade", style:`animation-delay:${260+i*55}ms`}, d.lab);
    s.appendChild(lab);
    s.appendChild(el("text", {x:cx, y:axY, "text-anchor":"middle", class:"axb"}, d.x));
    if (d.x2) s.appendChild(el("text", {x:cx, y:subY, "text-anchor":"middle", class:"ax"}, d.x2));
  });
  return s;
}

/* Two grouped series per category — used for the payor comparison. */
function chartGrouped(spec){
  const W = 1660, H = spec.height || 460, PB = 74, PT = 54, PL = 20, PR = 20;
  const s = svgRoot(W, H);
  const all = spec.cats.flatMap(c => c.vals);
  const max = Math.max(...all) * 1.20;
  const plotH = H - PB - PT, plotW = W - PL - PR;
  const y = v => PT + plotH - (v / max) * plotH;

  [...Array(4)].forEach((_, i) => {
    const gv = max * (i+1) / 5;
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:y(gv), y2:y(gv), class:"gridline"}));
  });

  const n = spec.cats.length, slot = plotW / n;
  spec.cats.forEach((c, i) => {
    const cx = PL + slot * i + slot / 2;
    const bw = Math.min(96, slot * 0.30), gap = 12;
    c.vals.forEach((v, j) => {
      const x = cx - bw - gap/2 + j * (bw + gap);
      const top = y(v), base = y(0);
      const g = el("g", {class:"grow", style:`transform-origin:${x+bw/2}px ${base}px;animation-delay:${i*70+j*35}ms`});
      g.appendChild(el("rect", {x, y:top, width:bw, height:Math.max(2, base-top), rx:4,
        class:"bar" + (j === 0 ? " mut" : (c.cls ? " " + c.cls : ""))}));
      s.appendChild(g);
      s.appendChild(el("text", {x:x+bw/2, y:top-13, "text-anchor":"middle", class:"vlab sm fade",
        style:`animation-delay:${280+i*70+j*35}ms`}, c.labs[j]));
    });
    s.appendChild(el("text", {x:cx, y:H-PB+30, "text-anchor":"middle", class:"axb"}, c.x));
    if (c.delta) s.appendChild(el("text", {x:cx, y:H-PB+56, "text-anchor":"middle",
      class:"ax", style:`fill:${c.deltaGood ? "var(--good)" : "var(--crit)"};font-weight:700;font-size:19px`}, c.delta));
  });
  return s;
}

/* Price line with annotated markers. */
function chartLine(spec){
  const W = 1660, H = spec.height || 470, PB = 52, PT = 62, PL = 24, PR = 96;
  const s = svgRoot(W, H);
  const pts = spec.points;
  const lo = Math.min(...pts.map(p=>p.v)), hi = Math.max(...pts.map(p=>p.v));
  const pad = (hi - lo) * 0.14;
  const min = lo - pad, max = hi + pad;
  const plotH = H - PB - PT, plotW = W - PL - PR;
  const x = i => PL + (i / (pts.length - 1)) * plotW;
  const y = v => PT + plotH - ((v - min) / (max - min)) * plotH;

  [...Array(4)].forEach((_, i) => {
    const gv = min + (max-min)*(i+1)/5;
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:y(gv), y2:y(gv), class:"gridline"}));
    s.appendChild(el("text", {x:W-PR+12, y:y(gv)+6, class:"ax"}, "$" + Math.round(gv)));
  });

  const d = pts.map((p,i) => (i?"L":"M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const area = d + ` L ${x(pts.length-1).toFixed(1)} ${(PT+plotH)} L ${x(0).toFixed(1)} ${(PT+plotH)} Z`;
  s.appendChild(el("path", {d:area, fill:"var(--accent)", opacity:".07"}));
  const path = el("path", {d, fill:"none", stroke:"var(--accent)", "stroke-width":"3.4",
    "stroke-linejoin":"round", "stroke-linecap":"round", class:"draw"});
  s.appendChild(path);
  requestAnimationFrame(() => {
    try { const L = path.getTotalLength(); path.style.setProperty("--len", L);
          path.style.strokeDasharray = L; } catch(e){}
  });

  if (spec.ref) {
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:y(spec.ref.v), y2:y(spec.ref.v),
      stroke:"var(--ink-2)", "stroke-width":"2", "stroke-dasharray":"7 5", opacity:".7"}));
    s.appendChild(el("text", {x:W-PR+12, y:y(spec.ref.v)+6, class:"axb",
      style:"font-size:19px"}, spec.ref.lab));
  }
  (spec.ticks || []).forEach(tk =>
    s.appendChild(el("text", {x:x(tk.i), y:H-PB+34, "text-anchor":"middle", class:"ax",
      style:"font-size:15px"}, tk.lab)));

  (spec.markers || []).forEach((m, k) => {
    const i = m.i < 0 ? pts.length + m.i : m.i;
    const px = x(i), py = y(pts[i].v);
    const up = m.side !== "below";
    s.appendChild(el("line", {x1:px, x2:px, y1:py, y2: up ? PT-14 : PT+plotH+16,
      stroke:"var(--ink-2)", "stroke-width":"1.4", "stroke-dasharray":"4 4", opacity:".55", class:"fade",
      style:`animation-delay:${700+k*90}ms`}));
    s.appendChild(el("circle", {cx:px, cy:py, r:7, fill:"var(--bg)", stroke:m.crit?"var(--crit)":"var(--accent)",
      "stroke-width":"3.4", class:"fade", style:`animation-delay:${700+k*90}ms`}));
    const ty = up ? PT-24 : PT+plotH+40;
    const anchor = i > pts.length*0.78 ? "end" : (i < pts.length*0.10 ? "start" : "middle");
    const g = el("g", {class:"fade", style:`animation-delay:${760+k*90}ms`});
    g.appendChild(el("text", {x:px, y:ty, "text-anchor":anchor, class:"vlab",
      style:m.crit?"fill:var(--crit)":""}, m.lab));
    if (m.sub) g.appendChild(el("text", {x:px, y:ty + (up?-24:24), "text-anchor":anchor, class:"ax"}, m.sub));
    s.appendChild(g);
  });
  return s;
}

/* Waterfall bridge — start, contributions, end. */
function chartBridge(spec){
  const W = 1660, H = spec.height || 450, PB = 78, PT = 62, PL = 20, PR = 20;
  const s = svgRoot(W, H);
  let run = 0; const tops = [];
  spec.steps.forEach(st => {
    if (st.type === "total") tops.push({from:0, to:st.v});
    else { tops.push({from:run, to:run + st.v}); run += st.v; }
    if (st.type === "start") run = st.v;
  });

  // The scale must span the whole running path, not just its high point. A
  // bridge that crosses zero — cash generated, then capital spending far larger
  // than it — used to map its negative bars off the bottom of the slide and
  // straight through the "why it matters" band.
  const lo = Math.min(0, ...tops.map(t => Math.min(t.from, t.to)));
  const hi = Math.max(0, ...tops.map(t => Math.max(t.from, t.to)));
  const pad = (hi - lo) * 0.18 || 1;
  // Headroom above for the value labels; below only if anything goes negative.
  const max = hi + pad, min = lo < 0 ? lo - pad * 0.55 : 0;
  const plotH = H - PB - PT, plotW = W - PL - PR;
  const y = v => PT + plotH - ((v - min) / (max - min)) * plotH;
  const zeroY = y(0);
  const n = spec.steps.length, slot = plotW / n, bw = Math.min(160, slot * 0.60);

  if (lo < 0) {
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:zeroY, y2:zeroY,
      stroke:"var(--ink)", "stroke-width":1.5, opacity:".45"}));
  }

  spec.steps.forEach((st, i) => {
    const cx = PL + slot*i + slot/2;
    const t = tops[i], top = y(Math.max(t.from, t.to)), bot = y(Math.min(t.from, t.to));
    const cls = st.type === "start" || st.type === "total" ? "mut" : (st.cls || "");
    const g = el("g", {class:"grow", style:`transform-origin:${cx}px ${bot}px;animation-delay:${i*80}ms`});
    g.appendChild(el("rect", {x:cx-bw/2, y:top, width:bw, height:Math.max(3, bot-top), rx:4, class:"bar "+cls}));
    s.appendChild(g);
    // A bar sitting below the zero line wears its label underneath, or the label
    // lands inside the bar above it.
    const endsBelow = Math.min(t.from, t.to) < 0 && Math.max(t.from, t.to) <= 0.0001;
    s.appendChild(el("text", {x:cx, y: endsBelow ? bot + 30 : top - 14, "text-anchor":"middle",
      class:"vlab fade", style:`animation-delay:${300+i*80}ms`}, st.lab));
    s.appendChild(el("text", {x:cx, y:H-PB+30, "text-anchor":"middle", class:"axb"}, st.x));
    if (st.x2) s.appendChild(el("text", {x:cx, y:H-PB+54, "text-anchor":"middle", class:"ax"}, st.x2));
    // No connector into a total — its `from` is 0, which drew a stray rule
    // along the baseline instead of a step link.
    if (i < n-1 && st.type !== "total" && spec.steps[i+1].type !== "total") {
      const ny = y(tops[i+1].from);
      s.appendChild(el("line", {x1:cx+bw/2, x2:PL+slot*(i+1)+slot/2-bw/2, y1:ny, y2:ny,
        stroke:"var(--muted)", "stroke-width":"1.4", "stroke-dasharray":"4 4", opacity:".6"}));
    }
  });
  return s;
}

/* Horizontal comparison bars — used for the two-price-tags slide. */
function chartHBars(spec){
  const W = 1660, H = spec.height || 420;
  const s = svgRoot(W, H);
  // PR must clear the longest value label. A two-part label (rate then margin)
  // at 27px overran the viewBox at the old 210 and was clipped off the slide.
  const LBL = 300, PR = spec.labelRoom || 500;
  const max = Math.max(...spec.rows.map(r => r.v)) * 1.02;
  const rowH = (H - 30) / spec.rows.length;
  spec.rows.forEach((r, i) => {
    const cy = 22 + rowH*i + rowH/2;
    const bw = ((W - LBL - PR) * r.v) / max;
    s.appendChild(el("text", {x:LBL-22, y:cy+3, "text-anchor":"end", class:"axb",
      style:"font-size:22px"}, r.name));
    if (r.sub) s.appendChild(el("text", {x:LBL-22, y:cy+27, "text-anchor":"end", class:"ax"}, r.sub));
    const g = el("g", {class:"growX", style:`transform-origin:${LBL}px ${cy}px;animation-delay:${i*90}ms`});
    g.appendChild(el("rect", {x:LBL, y:cy-27, width:Math.max(3,bw), height:54, rx:5,
      class:"bar "+(r.cls||"")}));
    s.appendChild(g);
    s.appendChild(el("text", {x:LBL+bw+18, y:cy+9, class:"vlab fade",
      style:`animation-delay:${300+i*90}ms;font-size:27px`}, r.lab));
  });
  return s;
}

/*
   Stacked horizontal bars — a shared cost block plus a variable margin block.
   Plain side-by-side bars showed the two payors' REVENUE (a ~2.8x gap) while
   the caption talked about MARGIN (a ~10x gap), so the picture argued against
   the words. Stacking the identical cost out of both makes the margin gap the
   thing you actually see.
*/
function chartStackedH(spec){
  const W = 1660, H = spec.height || 420;
  const s = svgRoot(W, H);
  const LBL = 300, PR = spec.labelRoom || 300;
  const max = Math.max(...spec.rows.map(r => r.segs.reduce((a, x) => a + x.v, 0)));
  const plotW = W - LBL - PR;
  const rowH = (H - 40) / spec.rows.length;

  spec.rows.forEach((r, i) => {
    const cy = 26 + rowH * i + rowH / 2;
    s.appendChild(el("text", {x:LBL-24, y:cy+2, "text-anchor":"end", class:"axb",
      style:"font-size:24px"}, r.name));
    if (r.sub) s.appendChild(el("text", {x:LBL-24, y:cy+28, "text-anchor":"end", class:"ax"}, r.sub));

    let x = LBL, total = 0;
    r.segs.forEach((seg, j) => {
      const w = (plotW * seg.v) / max;
      const g = el("g", {class:"growX", style:`transform-origin:${x}px ${cy}px;animation-delay:${i*110+j*80}ms`});
      g.appendChild(el("rect", {x, y:cy-30, width:Math.max(2,w), height:60,
        rx:4, class:"bar " + (seg.cls || "")}));
      s.appendChild(g);
      if (seg.lab && w > 130) {
        s.appendChild(el("text", {x:x+w/2, y:cy+8, "text-anchor":"middle", class:"vlab fade",
          style:`animation-delay:${340+i*110+j*80}ms;fill:${seg.ink || "var(--bg)"};font-size:23px`},
          seg.lab));
      } else if (seg.lab) {
        // Too narrow to hold its own label — float it above the segment rather
        // than drop it. The small number is often the whole point of the slide.
        s.appendChild(el("text", {x:x+w/2, y:cy-42, "text-anchor":"middle", class:"vlab fade",
          style:`animation-delay:${340+i*110+j*80}ms;font-size:21px`}, seg.lab));
      }
      x += w; total += seg.v;
    });
    s.appendChild(el("text", {x:x+20, y:cy+9, class:"vlab fade",
      style:`animation-delay:${420+i*110}ms;font-size:26px`}, r.totalLab));
  });
  return s;
}

/* Guidance range bar with the implied-second-half marker. */
function chartRange(spec){
  const W = 1660, H = spec.height || 300;
  const s = svgRoot(W, H);
  const PL = 90, PR = 130, trackY = 148;
  const lo = spec.scaleLo, hi = spec.scaleHi;
  const x = v => PL + ((v - lo) / (hi - lo)) * (W - PL - PR);

  s.appendChild(el("rect", {x:PL, y:trackY-5, width:W-PL-PR, height:10, rx:5, fill:"var(--grid)"}));
  s.appendChild(el("rect", {x:x(spec.bandLo), y:trackY-19, width:x(spec.bandHi)-x(spec.bandLo), height:38,
    rx:7, fill:"var(--accent)", opacity:".24", class:"fade"}));
  [[spec.bandLo, spec.bandLoLab], [spec.bandHi, spec.bandHiLab]].forEach(([v, lab], k) => {
    s.appendChild(el("line", {x1:x(v), x2:x(v), y1:trackY-22, y2:trackY+22, stroke:"var(--accent)", "stroke-width":"3"}));
    s.appendChild(el("text", {x:x(v), y:trackY+58, "text-anchor":"middle", class:"vlab"}, lab));
  });
  // Band name sits BELOW the range labels — above the track it collided with
  // the marker's leader line.
  s.appendChild(el("text", {x:(x(spec.bandLo)+x(spec.bandHi))/2, y:trackY+96, "text-anchor":"middle",
    class:"axb", style:"font-size:19px;letter-spacing:.1em;text-transform:uppercase;fill:var(--muted)"},
    spec.bandName));

  (spec.marks || []).forEach((m, k) => {
    const mx = x(m.v);
    s.appendChild(el("line", {x1:mx, x2:mx, y1:trackY-64, y2:trackY+20,
      stroke: m.crit ? "var(--crit)" : "var(--ink)", "stroke-width":"3.2", class:"fade",
      style:`animation-delay:${300+k*120}ms`}));
    s.appendChild(el("circle", {cx:mx, cy:trackY, r:9, fill: m.crit ? "var(--crit)" : "var(--ink)",
      class:"fade", style:`animation-delay:${300+k*120}ms`}));
    const g = el("g", {class:"fade", style:`animation-delay:${360+k*120}ms`});
    g.appendChild(el("text", {x:mx, y:trackY-76, "text-anchor":"middle", class:"vlab",
      style:m.crit?"fill:var(--crit)":""}, m.lab));
    g.appendChild(el("text", {x:mx, y:trackY-102, "text-anchor":"middle", class:"ax"}, m.sub || ""));
    s.appendChild(g);
  });
  return s;
}

/*
   Two measures on one plot, INDEXED to 100 at the start — the sanctioned
   alternative to a dual y-axis, which is never acceptable. Earnings step on the
   day each quarter was reported, so the line shows what the market knew when it
   knew it, rather than smearing a quarter across three months.
*/
function chartIndexed(spec){
  const W = 1660, H = spec.height || 520, PB = 56, PT = 62, PL = 24, PR = 108;
  const s = svgRoot(W, H);
  const all = spec.price.concat(spec.earn).map(p => p.v);
  const lo = Math.min(...all), hi = Math.max(...all);
  const min = lo - (hi - lo) * 0.10, max = hi + (hi - lo) * 0.14;
  const plotH = H - PB - PT, plotW = W - PL - PR;
  const t0 = spec.price[0].t, t1 = spec.price[spec.price.length - 1].t;
  const X = t => PL + ((t - t0) / (t1 - t0)) * plotW;
  const Y = v => PT + plotH - ((v - min) / (max - min)) * plotH;

  // The base-100 rule always carries its own label, so a gridline tick that lands
  // within a label's height of it must not print one — PLTR drew "115" straight
  // on top of "100" for a whole session before the layout audit caught it.
  [...Array(4)].forEach((_, i) => {
    const gv = min + (max - min) * (i + 1) / 5;
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:Y(gv), y2:Y(gv), class:"gridline"}));
    if (Math.abs(Y(gv) - Y(100)) > 22)
      s.appendChild(el("text", {x:W-PR+12, y:Y(gv)+6, class:"ax"}, Math.round(gv)));
  });
  s.appendChild(el("line", {x1:PL, x2:W-PR, y1:Y(100), y2:Y(100),
    stroke:"var(--ink-2)", "stroke-width":"1.6", "stroke-dasharray":"5 5", opacity:".5"}));
  s.appendChild(el("text", {x:W-PR+12, y:Y(100)+6, class:"axb"}, "100"));

  // earnings first, so the price line reads on top of it
  let d = "";
  spec.earn.forEach((p, i) => {
    d += (i ? `L ${X(p.t).toFixed(1)} ${Y(spec.earn[i-1].v).toFixed(1)} L ${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`
             : `M ${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`) + " ";
  });
  d += `L ${X(t1).toFixed(1)} ${Y(spec.earn[spec.earn.length-1].v).toFixed(1)}`;
  const ep = el("path", {d, fill:"none", stroke:"var(--s2)", "stroke-width":"3",
    "stroke-linejoin":"round", class:"draw"});
  s.appendChild(ep);

  const pd = spec.price.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const pp = el("path", {d:pd, fill:"none", stroke:"var(--s1)", "stroke-width":"2.6",
    "stroke-linejoin":"round", "stroke-linecap":"round", class:"draw"});
  s.appendChild(pp);
  requestAnimationFrame(() => [ep, pp].forEach(n => {
    try { const L = n.getTotalLength(); n.style.setProperty("--len", L); n.style.strokeDasharray = L; } catch(e){}
  }));

  // Direct end-labels: identity never rests on the legend swatch alone.
  [[spec.earn[spec.earn.length-1].v, spec.earnLabel, "var(--s2)"],
   [spec.price[spec.price.length-1].v, spec.priceLabel, "var(--s1)"]].forEach(([v, lab, c], k) => {
    s.appendChild(el("circle", {cx:X(t1), cy:Y(v), r:6, fill:c, stroke:"var(--bg)", "stroke-width":"2.5",
      class:"fade", style:`animation-delay:${900+k*110}ms`}));
    s.appendChild(el("text", {x:X(t1)-20, y:Y(v)-20, "text-anchor":"end", class:"vlab fade",
      style:`animation-delay:${960+k*110}ms;fill:${c}`}, lab));
  });
  (spec.ticks || []).forEach(tk =>
    s.appendChild(el("text", {x:X(tk.t), y:H-PB+32, "text-anchor":"middle", class:"ax"}, tk.lab)));
  return s;
}

/*
   Stacked capital structure where one component can go NEGATIVE. DaVita's
   shareholders' equity crosses below zero mid-series, so the equity block has to
   hang under the axis rather than be clipped to it — that crossing is the story.
*/
function chartFunded(spec){
  const W = 1660, H = spec.height || 520, PB = 74, PT = 58, PL = 24, PR = 96;
  const s = svgRoot(W, H);
  const tops = spec.series.map(d => d.a + Math.max(0, d.b));
  const bots = spec.series.map(d => Math.min(0, d.b));
  const max = Math.max(...tops) * 1.14, min = Math.min(...bots) * 1.55 || 0;
  const plotH = H - PB - PT, plotW = W - PL - PR;
  const Y = v => PT + plotH - ((v - min) / (max - min)) * plotH;

  [...Array(4)].forEach((_, i) => {
    const gv = min + (max - min) * (i + 1) / 5;
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:Y(gv), y2:Y(gv), class:"gridline"}));
    const f = FMT[spec.fmtKind] || FMT.usdB;
    s.appendChild(el("text", {x:W-PR+12, y:Y(gv)+6, class:"ax"}, f(gv)));
  });
  s.appendChild(el("line", {x1:PL, x2:W-PR, y1:Y(0), y2:Y(0),
    stroke:"var(--ink-2)", "stroke-width":"2", opacity:".7"}));

  const n = spec.series.length, slot = plotW / n, bw = Math.min(112, slot * 0.60);
  spec.series.forEach((d, i) => {
    const cx = PL + slot * i + slot / 2;
    // debt sits on the zero line; equity stacks above it, or hangs below when negative
    const dTop = Y(d.a), z = Y(0);
    let g = el("g", {class:"grow", style:`transform-origin:${cx}px ${z}px;animation-delay:${i*60}ms`});
    g.appendChild(el("rect", {x:cx-bw/2, y:dTop, width:bw, height:Math.max(2, z-dTop),
      rx:4, class:"bar s1"}));
    s.appendChild(g);
    const eTop = d.b >= 0 ? Y(d.a + d.b) : z + 2, eH = Math.abs(Y(d.b) - z);
    const ey = d.b >= 0 ? eTop : z + 2;
    g = el("g", {class:"grow", style:`transform-origin:${cx}px ${d.b >= 0 ? Y(d.a) : z}px;animation-delay:${i*60+40}ms`});
    g.appendChild(el("rect", {x:cx-bw/2, y:ey, width:bw, height:Math.max(2, eH),
      rx:4, class:"bar " + (d.b < 0 ? "bad" : "s2")}));
    s.appendChild(g);
    if (d.lab) s.appendChild(el("text", {x:cx, y:dTop-16, "text-anchor":"middle", class:"vlab sm fade",
      style:`animation-delay:${300+i*60}ms`}, d.lab));
    s.appendChild(el("text", {x:cx, y:H-PB+34, "text-anchor":"middle", class:"axb"}, d.x));
    if (d.x2) s.appendChild(el("text", {x:cx, y:H-PB+56, "text-anchor":"middle",
      class:"ax", style:d.x2crit ? "fill:var(--crit);font-weight:700" : ""}, d.x2));
  });
  return s;
}

/*
   Small multiples — one panel per measure, each on its own scale, sharing the x
   axis. This is the answer when two measures differ by an order of magnitude:
   DVA's equity swings ±$0.8B against $10B of debt, so a single stacked bar made
   the equity crossing invisible (the same failure the payor slide had). Two
   panels keep both legible without ever implying a second y-axis on one plot.
*/
function chartSmallMult(spec){
  const W = 1660, H = spec.height || 540, PL = 24, PR = 116, GAP = 42, PB = 76;
  const s = svgRoot(W, H);
  const n = spec.panels.length;
  const panelH = (H - PB - GAP * (n - 1)) / n;
  const plotW = W - PL - PR;
  const cols = spec.panels[0].series.length;
  const slot = plotW / cols, bw = Math.min(104, slot * 0.56);

  spec.panels.forEach((pan, pi) => {
    const top = pi * (panelH + GAP), bot = top + panelH;
    const vals = pan.series.map(d => d.v);
    const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
    const pad = (hi - lo) * 0.20 || 1;
    const max = hi + pad, min = lo - (lo < 0 ? pad : 0);
    const Y = v => bot - ((v - min) / (max - min)) * (bot - top);

    s.appendChild(el("text", {x:PL, y:top - 10, class:"axb",
      style:"font-size:18px;letter-spacing:.1em;text-transform:uppercase;font-weight:800"}, pan.label));
    const fm = FMT[pan.fmtKind] || FMT.usdM;
    [max, min].forEach(v => s.appendChild(el("text", {x:W-PR+14, y:Y(v)+6, class:"ax"}, fm(v))));
    const zero = Y(0);
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:zero, y2:zero,
      stroke:"var(--ink-2)", "stroke-width":lo < 0 ? 2 : 1, opacity:lo < 0 ? .7 : .35}));

    pan.series.forEach((d, i) => {
      const cx = PL + slot * i + slot / 2;
      const y0 = Y(d.v), h = Math.abs(zero - y0);
      const g = el("g", {class:"grow", style:`transform-origin:${cx}px ${zero}px;animation-delay:${pi*90+i*55}ms`});
      g.appendChild(el("rect", {x:cx-bw/2, y:Math.min(y0, zero), width:bw, height:Math.max(2, h),
        rx:4, class:"bar " + (d.cls || "")}));
      s.appendChild(g);
      if (d.lab) s.appendChild(el("text", {x:cx, y:d.v < 0 ? Math.max(y0, zero) + 28 : Math.min(y0, zero) - 12,
        "text-anchor":"middle", class:"vlab sm fade",
        style:`animation-delay:${300+pi*90+i*55}ms`}, d.lab));
    });
  });

  spec.panels[0].series.forEach((d, i) => {
    const cx = PL + slot * i + slot / 2;
    s.appendChild(el("text", {x:cx, y:H-PB+40, "text-anchor":"middle", class:"axb"}, d.x));
    if (d.x2) s.appendChild(el("text", {x:cx, y:H-PB+62, "text-anchor":"middle", class:"ax",
      style:d.x2crit ? "fill:var(--crit);font-weight:700" : ""}, d.x2));
  });
  return s;
}

/*
   SANKEY — the income statement as a flow. One trunk whose height is money,
   narrowing as costs peel off and widening where non-operating income joins.
   This is the right form for "where does a dollar of revenue end up", and it
   shows in one picture what a bar chart needs three slides to say: how thin the
   tax ribbon is next to everything else.

   steps: an ordered list, each one of
     {node:  "label", v: <trunk value here>}   a labelled checkpoint on the trunk
     {out:   "label", v: <amount leaving>}     a cost peeling downward
     {in:    "label", v: <amount joining>}     income merging upward
*/
function chartSankey(spec){
  const W = 1660, H = spec.height || 520, PT = 66, PB = 96, PL = 8, PR = 8;
  const s = svgRoot(W, H);
  const steps = spec.steps;
  const max = spec.max || Math.max(...steps.filter(x => x.node).map(x => x.v));
  const plotH = H - PT - PB;
  const hOf = v => Math.max(2.5, (v / max) * plotH * 0.74);
  const mid = PT + plotH * 0.44;                       // trunk centre line

  // x positions: nodes anchor the grid, branches sit between them
  const n = steps.length;
  const X = i => PL + (i / (n - 1)) * (W - PL - PR);

  // running trunk value
  let run = steps[0].v;
  const trunk = [];                                     // {x, v} at each step
  steps.forEach((st, i) => {
    if (st.node) run = st.v;
    else if (st.out) run -= st.v;
    else if (st.in) run += st.v;
    trunk.push({x: X(i), v: run, st});
  });

  const ribbon = (x0, v0, x1, v1, yc0, yc1, cls, op) => {
    const h0 = hOf(v0) / 2, h1 = hOf(v1) / 2, cx = (x0 + x1) / 2;
    const d = `M ${x0} ${yc0 - h0} C ${cx} ${yc0 - h0}, ${cx} ${yc1 - h1}, ${x1} ${yc1 - h1}`
            + ` L ${x1} ${yc1 + h1} C ${cx} ${yc1 + h1}, ${cx} ${yc0 + h0}, ${x0} ${yc0 + h0} Z`;
    return el("path", {d, class: "snk " + (cls || ""), opacity: op == null ? 1 : op});
  };

  // trunk segments
  for (let i = 0; i < trunk.length - 1; i++) {
    const a = trunk[i], b = trunk[i + 1];
    const g = el("g", {class: "fade", style: `animation-delay:${i * 70}ms`});
    g.appendChild(ribbon(a.x, a.v, b.x, b.v, mid, mid, "trunk"));
    s.appendChild(g);
  }

  // branches leaving and joining
  trunk.forEach((t, i) => {
    const st = t.st;
    if (!st.out && !st.in) return;
    const prev = trunk[i - 1];
    const down = !!st.out;
    const yEnd = down ? mid + plotH * 0.40 : mid - plotH * 0.40;
    const g = el("g", {class: "fade", style: `animation-delay:${140 + i * 70}ms`});
    g.appendChild(ribbon(prev.x, st.v, t.x, st.v, mid, yEnd, st.cls || (down ? "cost" : "gain"), .82));
    s.appendChild(g);
    const lab = el("text", {x: t.x, y: yEnd + (down ? 34 : -22), "text-anchor": "middle",
      class: "vlab sm fade", style: `animation-delay:${240 + i * 70}ms`},
      (down ? "−" : "+") + spec.fmt2(st.v));
    s.appendChild(lab);
    s.appendChild(el("text", {x: t.x, y: yEnd + (down ? 56 : -44), "text-anchor": "middle",
      class: "ax fade", style: `animation-delay:${240 + i * 70}ms`}, st.out || st.in));
  });

  // node labels on the trunk
  trunk.forEach((t, i) => {
    if (!t.st.node) return;
    const anchor = i === 0 ? "start" : (i === trunk.length - 1 ? "end" : "middle");
    const g = el("g", {class: "fade", style: `animation-delay:${300 + i * 70}ms`});
    g.appendChild(el("text", {x: t.x, y: mid - hOf(t.v) / 2 - 34, "text-anchor": anchor,
      class: "vlab", style: "font-size:23px"}, spec.fmt2(t.v)));
    g.appendChild(el("text", {x: t.x, y: mid - hOf(t.v) / 2 - 12, "text-anchor": anchor,
      class: "axb", style: "font-size:16px"}, t.st.node));
    s.appendChild(g);
  });
  return s;
}

/*
   FORECAST — reported history continuing into guided/forecast periods, split by
   a labelled divider with the past region shaded. Taken from Simply Wall St's
   "Past | Analysts Forecasts" chart, which is the clearest way to show that a
   line keeps rising while its GRADIENT rolls over: the levels reassure and the
   growth labels indict, in one picture.

   points: [{x, v, lab?, growth?, guided?}]   guided:true switches to the dashed
                                              projection style and shades behind
*/
function chartForecast(spec){
  const W = 1660, H = spec.height || 520, PT = 74, PB = 96, PL = 30, PR = 120;
  const s = svgRoot(W, H);
  const P = spec.points, n = P.length;
  const max = Math.max(...P.map(p => p.v)) * 1.20;
  const plotH = H - PT - PB, plotW = W - PL - PR;
  const X = i => PL + (i / (n - 1)) * plotW;
  const Y = v => PT + plotH - (v / max) * plotH;
  const firstG = P.findIndex(p => p.guided);
  const split = firstG > 0 ? (X(firstG - 1) + X(firstG)) / 2 : null;

  [...Array(4)].forEach((_, i) => {
    const gv = max * (i + 1) / 5;
    s.appendChild(el("line", {x1: PL, x2: W - PR, y1: Y(gv), y2: Y(gv), class: "gridline"}));
    s.appendChild(el("text", {x: W - PR + 12, y: Y(gv) + 6, class: "ax"}, spec.fmt2(gv)));
  });

  if (split != null) {
    // shade the reported region so the forecast reads as a different claim
    s.appendChild(el("rect", {x: PL, y: PT, width: split - PL, height: plotH,
      fill: "var(--ink)", opacity: ".045"}));
    s.appendChild(el("line", {x1: split, y1: PT - 8, x2: split, y2: PT + plotH,
      stroke: "var(--ink-2)", "stroke-width": 2, "stroke-dasharray": "5 4", opacity: ".7"}));
    s.appendChild(el("text", {x: split - 14, y: PT - 18, "text-anchor": "end", class: "axb",
      style: "font-size:17px;letter-spacing:.1em;text-transform:uppercase"}, spec.pastLab));
    s.appendChild(el("text", {x: split + 14, y: PT - 18, class: "axb",
      style: "font-size:17px;letter-spacing:.1em;text-transform:uppercase;fill:var(--s1)"},
      spec.futureLab));
  }

  const seg = (from, to, dashed) => {
    const d = P.slice(from, to + 1).map((p, k) =>
      (k ? "L" : "M") + X(from + k).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
    const area = d + ` L ${X(to).toFixed(1)} ${PT + plotH} L ${X(from).toFixed(1)} ${PT + plotH} Z`;
    s.appendChild(el("path", {d: area, fill: "var(--s1)", opacity: dashed ? .07 : .14}));
    const path = el("path", {d, fill: "none", stroke: "var(--s1)", "stroke-width": dashed ? 3.4 : 4,
      "stroke-linejoin": "round", "stroke-linecap": "round",
      "stroke-dasharray": dashed ? "9 7" : null, class: dashed ? "fade" : "draw",
      style: dashed ? "animation-delay:700ms" : ""});
    s.appendChild(path);
    if (!dashed) requestAnimationFrame(() => { try { const L = path.getTotalLength();
      path.style.setProperty("--len", L); path.style.strokeDasharray = L; } catch(e){} });
  };
  if (firstG > 0) { seg(0, firstG - 1, false); seg(firstG - 1, n - 1, true); }
  else seg(0, n - 1, false);

  P.forEach((p, i) => {
    if (p.lab) s.appendChild(el("text", {x: X(i), y: Y(p.v) - 20, "text-anchor": "middle",
      class: "vlab sm fade", style: `animation-delay:${400 + i * 55}ms`}, p.lab));
    if (p.growth) s.appendChild(el("text", {x: X(i), y: H - PB + 58, "text-anchor": "middle",
      class: "ax", style: `font-weight:700;font-size:18px;fill:${p.guided ? "var(--s1)" : "var(--muted)"}`},
      p.growth));
    s.appendChild(el("text", {x: X(i), y: H - PB + 32, "text-anchor": "middle", class: "axb",
      style: "font-size:16px"}, p.x));
    if (i === firstG - 1 || i === n - 1)
      s.appendChild(el("circle", {cx: X(i), cy: Y(p.v), r: 8, fill: "var(--s1)",
        stroke: "var(--bg)", "stroke-width": 3}));
  });
  if (spec.growthLab) s.appendChild(el("text", {x: PL, y: H - PB + 58, class: "ax",
    "text-anchor": "start", style: "font-size:15px;letter-spacing:.08em;text-transform:uppercase"},
    spec.growthLab));
  return s;
}

/* GAUGE — one number against the threshold that makes it mean something. */
function chartGauge(spec){
  const W = 1660, H = spec.height || 440;
  const s = svgRoot(W, H);
  const cx = W / 2, cy = H * 0.78, R = Math.min(H * 0.66, 330), TH = 46;
  const lo = spec.min ?? 0, hi = spec.max;
  const ang = v => Math.PI * (1 - Math.min(1, Math.max(0, (v - lo) / (hi - lo))));
  const pt = (a, r) => [cx + Math.cos(a) * r, cy - Math.sin(a) * r];
  const arc = (a0, a1, r, w, cls, op) => {
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
    const large = 0, sweep = a0 > a1 ? 1 : 0;
    return el("path", {d: `M ${x0} ${y0} A ${r} ${r} 0 ${large} ${sweep} ${x1} ${y1}`,
      fill: "none", "stroke-width": w, class: cls, opacity: op == null ? 1 : op,
      "stroke-linecap": "round"});
  };
  s.appendChild(arc(ang(lo), ang(hi), R, TH, "gg-track"));
  s.appendChild(arc(ang(lo), ang(spec.value), R, TH, "gg-fill"));

  // the threshold that gives the number meaning
  if (spec.threshold != null) {
    const a = ang(spec.threshold), [tx, ty] = pt(a, R + TH / 2 + 6), [bx, by] = pt(a, R - TH / 2 - 6);
    s.appendChild(el("line", {x1: bx, y1: by, x2: tx, y2: ty,
      stroke: "var(--ink)", "stroke-width": 4}));
    const [lx, ly] = pt(a, R + TH / 2 + 54);
    s.appendChild(el("text", {x: lx, y: ly, "text-anchor": "middle", class: "axb",
      style: "font-size:19px;font-weight:700"}, spec.thresholdLab));
  }
  // A second needle for the comparison case — company against industry, or this
  // period against the last. Only drawn when a sourced value is supplied.
  if (spec.compare != null) {
    const a = ang(spec.compare), [nx, ny] = pt(a, R + TH / 2 + 4), [bx2, by2] = pt(a, R - TH / 2 - 4);
    s.appendChild(el("line", {x1: bx2, y1: by2, x2: nx, y2: ny,
      stroke: "var(--s2)", "stroke-width": 5, "stroke-linecap": "round"}));
    const [lx2, ly2] = pt(a, R + TH / 2 + 50);
    s.appendChild(el("text", {x: lx2, y: ly2, "text-anchor": "middle", class: "axb",
      style: "font-size:19px;font-weight:700;fill:var(--s2)"}, spec.compareLab));
  }
  s.appendChild(el("text", {x: cx, y: cy - 46, "text-anchor": "middle", class: "vlab fade",
    style: "font-size:110px;font-weight:820;letter-spacing:-.03em;fill:var(--s1)"}, spec.valueLab));
  s.appendChild(el("text", {x: cx, y: cy - 4, "text-anchor": "middle", class: "axb",
    style: "font-size:21px"}, spec.label));
  [[lo, ang(lo)], [hi, ang(hi)]].forEach(([v, a]) => {
    const [x, y] = pt(a, R - TH / 2 - 30);
    s.appendChild(el("text", {x, y, "text-anchor": "middle", class: "ax"}, spec.fmt2(v)));
  });
  (spec.marks || []).forEach(m => {
    const a = ang(m.v), [x, y] = pt(a, R + TH / 2 + 22);
    s.appendChild(el("circle", {cx: pt(a, R)[0], cy: pt(a, R)[1], r: 7,
      fill: "var(--bg)", stroke: "var(--muted)", "stroke-width": 3}));
    s.appendChild(el("text", {x, y, "text-anchor": "middle", class: "ax"}, m.lab));
  });
  return s;
}

/* DUMBBELL — then vs now for a handful of series, change as the connector. */
function chartDumbbell(spec){
  const W = 1660, H = spec.height || 430;
  const s = svgRoot(W, H);
  const LBL = 300, PR = spec.labelRoom || 330;
  const all = spec.rows.flatMap(r => [r.from, r.to]);
  // A hardcoded zero floor pushed any negative endpoint left of the label column
  // and straight through the row name. The scale has to hold what it is given.
  const hi = Math.max(...all), lo = Math.min(0, ...all);
  const pad = (hi - lo) * 0.06 || 1;
  const max = hi + pad, min = lo < 0 ? lo - pad : 0;
  const X = v => LBL + ((v - min) / (max - min)) * (W - LBL - PR);
  const rowH = (H - 40) / spec.rows.length;

  spec.rows.forEach((r, i) => {
    const cy = 24 + rowH * i + rowH / 2;
    s.appendChild(el("text", {x: LBL - 26, y: cy + 2, "text-anchor": "end", class: "axb",
      style: "font-size:23px"}, r.name));
    if (r.sub) s.appendChild(el("text", {x: LBL - 26, y: cy + 27, "text-anchor": "end", class: "ax"}, r.sub));
    const g = el("g", {class: "fade", style: `animation-delay:${i * 110}ms`});
    g.appendChild(el("line", {x1: X(r.from), y1: cy, x2: X(r.to), y2: cy,
      stroke: r.cls === "mut" ? "var(--muted)" : "var(--s1)", "stroke-width": 9,
      "stroke-linecap": "round", opacity: .5}));
    g.appendChild(el("circle", {cx: X(r.from), cy, r: 13, fill: "var(--bg)",
      stroke: "var(--muted)", "stroke-width": 4}));
    g.appendChild(el("circle", {cx: X(r.to), cy, r: 15,
      fill: r.cls === "mut" ? "var(--muted)" : "var(--s1)",
      stroke: "var(--bg)", "stroke-width": 3}));
    s.appendChild(g);
    s.appendChild(el("text", {x: X(r.from), y: cy - 28, "text-anchor": "middle", class: "ax fade",
      style: `animation-delay:${200 + i * 110}ms`}, r.fromLab));
    s.appendChild(el("text", {x: X(r.to) + 26, y: cy + 9, class: "vlab fade",
      style: `animation-delay:${240 + i * 110}ms;font-size:26px`}, r.toLab));
    if (r.delta) s.appendChild(el("text", {x: W - 20, y: cy + 9, "text-anchor": "end",
      class: "vlab fade", style: `animation-delay:${280 + i * 110}ms;font-size:30px;` +
      // Colour carries meaning: good is green, not the accent. `--s1` is a
      // series colour and `--accent` is chrome, so neither may stand for "good".
      `fill:${r.deltaGood === false ? "var(--muted)"
              : r.deltaGood ? "var(--good)" : "var(--s1)"}`}, r.delta));
  });
  return s;
}

/* SLOPE — the same measure re-forecast over time; the angle IS the message. */
function chartSlope(spec){
  const W = 1660, H = spec.height || 460, PT = 70, PB = 92, PL = 240, PR = 300;
  const s = svgRoot(W, H);
  const vals = spec.points.map(p => p.v);
  const min = Math.min(...vals) * 0.94, max = Math.max(...vals) * 1.04;
  const X = i => PL + (i / (spec.points.length - 1)) * (W - PL - PR);
  const Y = v => PT + (H - PT - PB) - ((v - min) / (max - min)) * (H - PT - PB);

  const d = spec.points.map((p, i) => (i ? "L" : "M") + X(i) + " " + Y(p.v)).join(" ");
  const path = el("path", {d, fill: "none", stroke: "var(--s1)", "stroke-width": 5,
    "stroke-linejoin": "round", "stroke-linecap": "round", class: "draw"});
  s.appendChild(path);
  requestAnimationFrame(() => { try { const L = path.getTotalLength();
    path.style.setProperty("--len", L); path.style.strokeDasharray = L; } catch(e){} });

  spec.points.forEach((p, i) => {
    const g = el("g", {class: "fade", style: `animation-delay:${400 + i * 150}ms`});
    g.appendChild(el("circle", {cx: X(i), cy: Y(p.v), r: 11, fill: "var(--s1)",
      stroke: "var(--bg)", "stroke-width": 4}));
    g.appendChild(el("text", {x: X(i), y: Y(p.v) - 30, "text-anchor": "middle", class: "vlab",
      style: "font-size:31px"}, p.lab));
    s.appendChild(g);
    s.appendChild(el("text", {x: X(i), y: H - PB + 40, "text-anchor": "middle", class: "axb",
      style: "font-size:21px"}, p.x));
    if (p.x2) s.appendChild(el("text", {x: X(i), y: H - PB + 66, "text-anchor": "middle", class: "ax"}, p.x2));
  });
  if (spec.endNote) {
    const last = spec.points.length - 1;
    s.appendChild(el("text", {x: X(last) + 34, y: Y(spec.points[last].v) + 10, class: "vlab fade",
      style: "font-size:26px;fill:var(--s1)"}, spec.endNote));
  }
  return s;
}

/*
   DISTRIBUTION — buckets of a population with a "you are here" marker. The
   honest way to say "expensive": show where everyone else trades and point.
*/
function chartDistribution(spec){
  const W = 1660, H = spec.height || 460, PB = 96, PT = 76, PL = 40, PR = 40;
  const s = svgRoot(W, H);
  const max = Math.max(...spec.buckets.map(b => b.n)) * 1.18;
  const plotH = H - PB - PT, plotW = W - PL - PR;
  const slot = plotW / spec.buckets.length, bw = slot * 0.72;
  const Y = v => PT + plotH - (v / max) * plotH;

  spec.buckets.forEach((b, i) => {
    const cx = PL + slot * i + slot / 2;
    const g = el("g", {class: "grow", style: `transform-origin:${cx}px ${PT + plotH}px;animation-delay:${i * 45}ms`});
    g.appendChild(el("rect", {x: cx - bw / 2, y: Y(b.n), width: bw,
      height: Math.max(2, PT + plotH - Y(b.n)), rx: 4,
      class: "bar " + (b.here ? "" : "mut")}));
    s.appendChild(g);
    s.appendChild(el("text", {x: cx, y: H - PB + 32, "text-anchor": "middle",
      class: b.here ? "axb" : "ax"}, b.x));
  });
  // the marker
  const hi = spec.buckets.findIndex(b => b.here);
  if (hi >= 0) {
    const cx = PL + slot * hi + slot / 2;
    s.appendChild(el("line", {x1: cx, y1: PT - 40, x2: cx, y2: PT + plotH,
      stroke: "var(--s1)", "stroke-width": 3.5, "stroke-dasharray": "6 5", class: "fade",
      style: "animation-delay:700ms"}));
    s.appendChild(el("text", {x: cx, y: PT - 52, "text-anchor": "middle", class: "vlab fade",
      style: "animation-delay:760ms;font-size:30px;fill:var(--s1)"}, spec.hereLab));
  }
  return s;
}

/*
   DONUT — a market-cap ring with the business drawn to scale inside it. The most
   visceral way to show a multiple: you do not tell someone a stock is expensive,
   you show them how little revenue fits inside the price.
*/
function chartDonut(spec){
  const W = 1660, H = spec.height || 470;
  const s = svgRoot(W, H);
  const cx = W * 0.235, cy = H / 2 + 6, R = Math.min(H * 0.40, 178), TH = 44;

  // Every ring is a real circle sweeping from twelve o'clock, so a 1.4% slice is
  // drawn as 1.4% of a turn. The whole point of the slide is how little of the
  // price is revenue, so the arc is never padded to make it visible.
  // All three arcs share ONE ring, so the slivers are read against the whole
  // circle rather than against each other. Drawn largest first, so the smaller
  // ones nest inside — a 1.4% slice is 5 degrees of arc and that is the point.
  const ring = (r, w, cls, frac, delay) => {
    const c = 2 * Math.PI * r;
    return el("circle", {cx, cy, r, fill:"none", "stroke-width":w, class:cls + " sweep",
      "stroke-dasharray": `${c * frac} ${c}`,
      style: `--len:${c * frac}px;animation-delay:${delay}ms`,
      transform: `rotate(-90 ${cx} ${cy})`});
  };
  s.appendChild(ring(R, TH, "dn-total", 1, 0));
  const ordered = spec.parts.map((p, i) => ({...p, i, frac: p.v / spec.total}))
                            .sort((a2, b2) => b2.frac - a2.frac);
  ordered.forEach((p, k) => s.appendChild(
    ring(R, TH, p.i ? "dn-b" : "dn-a", p.frac, 300 + k * 260)));

  // One pointer at twelve o'clock saying how thin that whole stack is. Without
  // it the eye reads the ring as empty and misses the argument entirely.
  const topFrac = ordered[0].frac;
  const g = el("g", {class:"fade", style:"animation-delay:840ms"});
  g.appendChild(el("line", {x1: cx, y1: cy - R - TH / 2 - 4, x2: cx, y2: cy - R - TH / 2 - 46,
    stroke:"var(--muted)", "stroke-width":2}));
  g.appendChild(el("text", {x: cx, y: cy - R - TH / 2 - 58, "text-anchor":"middle", class:"axb",
    style:"font-size:19px"}, `a whole year of sales is this ${(topFrac * 100).toFixed(1)}% of the ring`));
  s.appendChild(g);

  s.appendChild(el("text", {x:cx, y:cy - 8, "text-anchor":"middle", class:"axb",
    style:"font-size:17px;letter-spacing:.08em;text-transform:uppercase"}, spec.totalLabel));
  s.appendChild(el("text", {x:cx, y:cy + 34, "text-anchor":"middle", class:"vlab pop",
    style:"font-size:44px;animation-delay:180ms"}, spec.totalValue));

  // The legend carries the share of the price, which is the whole argument.
  const LX = cx + R + 130;
  spec.parts.forEach((p, i) => {
    const y = cy - 74 + i * 104;
    const g = el("g", {class:"fade", style:`animation-delay:${700 + i * 220}ms`});
    g.appendChild(el("rect", {x: LX, y: y - 26, width: 15, height: 15, rx: 3,
      class: i ? "dn-b-fill" : "dn-a-fill"}));
    g.appendChild(el("text", {x: LX + 28, y: y - 13, class:"axb", style:"font-size:20px"}, p.name));
    g.appendChild(el("text", {x: LX + 28, y: y + 24, class:"vlab", style:"font-size:36px"}, p.lab));
    g.appendChild(el("text", {x: LX + 28, y: y + 50, class:"ax", style:"font-size:18px"},
      `${(p.v / spec.total * 100).toFixed(1)}% of the market cap`));
    s.appendChild(g);
  });

  // The two multiples, in their own panel so they read as a conclusion.
  const stats = spec.stats || [];
  if (stats.length) {
    const PX = W - 452;
    s.appendChild(el("line", {x1: PX - 40, y1: cy - 118, x2: PX - 40, y2: cy + 118,
      stroke:"var(--border)", "stroke-width":2}));
    stats.forEach((st, i) => {
      const x = PX + 104 + i * 224;
      const g = el("g", {class:"pop", style:`animation-delay:${900 + i * 160}ms`});
      g.appendChild(el("text", {x, y: cy - 14, "text-anchor":"middle", class:"vlab",
        style:"font-size:62px;fill:var(--s1)"}, st.v));
      g.appendChild(el("text", {x, y: cy + 26, "text-anchor":"middle", class:"axb",
        style:"font-size:19px"}, st.l));
      s.appendChild(g);
    });
  }
  return s;
}

/*
   TREEMAP — the balance sheet at a glance, blocks sized by value. Two panels
   (assets vs liabilities+equity), everything green except debt in red, so the
   one thing to worry about is the only thing that is not.
*/
function chartTreemap(spec){
  const W = 1660, H = spec.height || 500, GAP = 46, PT = 40;
  const s = svgRoot(W, H);
  const panelW = (W - GAP) / 2, panelH = H - PT;

  // squarified-ish slice-and-dice: alternate split direction by aspect
  function layout(items, x, y, w, h, out) {
    if (!items.length) return;
    if (items.length === 1) { out.push({...items[0], x, y, w, h}); return; }
    const tot = items.reduce((a, b) => a + b.v, 0);
    let half = 0, i = 0;
    while (i < items.length - 1 && half + items[i].v < tot / 2) { half += items[i].v; i++; }
    // A first block already past the halfway mark leaves the left slice empty and
    // recurses on the same list forever. Both slices must shrink.
    if (i === 0) i = 1;
    const a = items.slice(0, i), b = items.slice(i);
    const fa = a.reduce((x2, y2) => x2 + y2.v, 0) / tot;
    if (w >= h) { layout(a, x, y, w * fa, h, out); layout(b, x + w * fa, y, w * (1 - fa), h, out); }
    else        { layout(a, x, y, w, h * fa, out); layout(b, x, y + h * fa, w, h * (1 - fa), out); }
  }

  spec.panels.forEach((pan, pi) => {
    const px = pi * (panelW + GAP);
    s.appendChild(el("text", {x: px, y: 24, class:"axb",
      style:"font-size:20px;letter-spacing:.09em;text-transform:uppercase"}, pan.label));
    const items = [...pan.items].filter(i => i.v > 0).sort((a, b) => b.v - a.v);
    const out = [];
    layout(items, px, PT, panelW, panelH, out);
    out.forEach((r, k) => {
      const g = el("g", {class:"fade", style:`animation-delay:${pi * 120 + k * 45}ms`});
      g.appendChild(el("rect", {x: r.x + 2, y: r.y + 2, width: Math.max(1, r.w - 4),
        height: Math.max(1, r.h - 4), rx: 5, class: "tm " + (r.cls || "ok")}));
      // A block too small for both lines still gets its value — a blank block is
      // worse than a small label — and every label is clipped to its own block so
      // a narrow one cannot spill over the panel edge.
      const inner = r.w - 36;
      // A narrow block is usually tall, so the name wraps rather than truncating —
      // "Other assets" clipped to "Other…" loses the only thing the block says.
      const wrap = (t, px) => {
        const budget = Math.max(3, Math.floor(inner / (px * 0.53)));
        const lines = [];
        t.split(" ").forEach(word => {
          const last = lines[lines.length - 1];
          if (last && (last + " " + word).length <= budget) lines[lines.length - 1] += " " + word;
          else lines.push(word.length <= budget ? word : word.slice(0, budget - 1) + "…");
        });
        return lines;
      };
      if (r.h > 54 && inner > 46) {
        const nf = r.w > 240 ? 19 : 15, vf = r.w > 240 ? 26 : 19;
        const lines = wrap(r.name, nf);
        lines.forEach((ln, li) => g.appendChild(el("text",
          {x: r.x + 18, y: r.y + 30 + li * (nf + 5), class:"tm-t", style:`font-size:${nf}px`}, ln)));
        g.appendChild(el("text", {x: r.x + 18, y: r.y + 34 + lines.length * (nf + 5),
          class:"tm-v", style:`font-size:${vf}px`}, r.lab));
      } else if (r.h > 26 && inner > 34) {
        g.appendChild(el("text", {x: r.x + 18, y: r.y + r.h / 2 + 6, class:"tm-v",
          style:"font-size:17px"}, r.lab));
      }
      s.appendChild(g);
    });
  });
  return s;
}

/* FAIR-VALUE BAND — where the price sits on an under/fair/over ruler. */
function chartFvBand(spec){
  const W = 1660, H = spec.height || 430;
  const s = svgRoot(W, H);
  // Five stacked lanes, each with its own room: verdict, bear/bull bracket,
  // current price, the band itself, then the base case underneath.
  const PL = 60, PR = 60, y = 186, bh = 96;
  const fv = spec.fairValue;
  const lo = fv * (1 - spec.band), hi = fv * (1 + spec.band);
  // The scale has to hold the bear/bull bracket too, or it runs off the rail.
  const scLo = Math.min(lo * 0.72, spec.price * 0.9, (spec.rangeLo ?? Infinity) * 0.9);
  const scHi = Math.max(hi * 1.28, spec.price * 1.1, (spec.rangeHi ?? 0) * 1.06);
  const X = v => PL + ((v - scLo) / (scHi - scLo)) * (W - PL - PR);
  const zone = (a, b, cls) => el("rect", {x: X(a), y, width: Math.max(2, X(b) - X(a)),
    height: bh, class: cls});
  const neutral = spec.zoneTone === "neutral";
  s.appendChild(zone(scLo, lo, neutral ? "fv-n-out" : "fv-under"));
  s.appendChild(zone(lo, hi, neutral ? "fv-n-mid" : "fv-fair"));
  s.appendChild(zone(hi, scHi, neutral ? "fv-n-out" : "fv-over"));
  // A single point estimate reads as false precision. The bracket is the range
  // the same model produces across the bear and bull assumption sets.
  if (spec.rangeLo != null && spec.rangeHi != null) {
    const by = y - 112;
    const g = el("g", {class:"fade", style:"animation-delay:520ms"});
    g.appendChild(el("line", {x1:X(spec.rangeLo), y1:by, x2:X(spec.rangeHi), y2:by,
      stroke:"var(--ink)", "stroke-width":2.5}));
    [[spec.rangeLo, spec.rangeLoLab, "end"], [spec.rangeHi, spec.rangeHiLab, "start"]]
      .forEach(([v, lab, anch]) => {
        g.appendChild(el("line", {x1:X(v), y1:by - 11, x2:X(v), y2:by + 11,
          stroke:"var(--ink)", "stroke-width":2.5}));
        // Flip the label inboard when the tick sits at the very end of the rail,
        // or it is drawn off the canvas: bear $3.06 landed at x = -37.
        const room = 14 + lab.length * 9.5;
        const flip = (anch === "end" && X(v) - room < 4) ||
                     (anch === "start" && X(v) + room > W - 4);
        const a = flip ? (anch === "end" ? "start" : "end") : anch;
        // A flipped label sits over the bracket rail itself, which struck
        // "bear $3.06" clean through. Drop it below the rail instead.
        g.appendChild(el("text", {x:X(v) + (a === "end" ? -14 : 14),
          y: by + (flip ? 28 : 6), "text-anchor":a, class:"ax",
          style:"font-size:18px"}, lab));
      });
    s.appendChild(g);
  }

  // Zone labels sit centred in their own zone — but when the price is far outside
  // the band, the "below" and "fair" zones squeeze into a sliver at the left and
  // their two labels print on top of each other (RKLB: price 648% over base).
  // Detect that and fall back to an evenly spaced swatch legend, which cannot
  // collide and keeps all three meanings on screen.
  const pct = (spec.band * 100).toFixed(0);
  const zLab = spec.zoneLabs || [`more than ${pct}% below`,
                                 `within ${pct}% — about right`,
                                 `more than ${pct}% above`];
  const zc = spec.zoneTone === "neutral"
    ? [["fv-tn-out", "fv-n-out"], ["fv-tn-mid", "fv-n-mid"], ["fv-tn-out", "fv-n-out"]]
    : [["fv-t-under", "fv-under"], ["fv-t-fair", "fv-fair"], ["fv-t-over", "fv-over"]];
  const zl = [[(scLo + lo) / 2, zLab[0], zc[0][0], zc[0][1]],
              [fv, zLab[1], zc[1][0], zc[1][1]],
              [(hi + scHi) / 2, zLab[2], zc[2][0], zc[2][1]]];
  const halfW = lab => lab.length * 4.6;
  const fits = zl.every(([v, lab], k) =>
    k === 0 || X(v) - halfW(lab) > X(zl[k-1][0]) + halfW(zl[k-1][1]) + 10);
  if (fits) {
    zl.forEach(([v, lab, cls]) =>
      s.appendChild(el("text", {x: X(v), y: y + bh + 34, "text-anchor":"middle",
        class: "ax " + cls, style:"font-size:17px;font-weight:700"}, lab)));
  } else {
    const ly = y + bh + 30, gap = (W - PL - PR) / 3;
    zl.forEach(([, lab, cls, fill], k) => {
      const lx = PL + gap * k + 26;
      s.appendChild(el("rect", {x: lx - 26, y: ly - 13, width: 17, height: 17, rx: 3,
        class: fill}));
      s.appendChild(el("text", {x: lx, y: ly, "text-anchor":"start",
        class: "ax " + cls, style:"font-size:17px;font-weight:700"}, lab));
    });
  }

  [[spec.price, spec.priceLab, "Current price", -1], [fv, spec.fairLab, spec.fairName, 1]]
    .forEach(([v, lab, name, dir], k) => {
      const x = X(v);
      s.appendChild(el("line", {x1:x, y1:y - 14, x2:x, y2:y + bh + 14,
        stroke:"var(--ink)", "stroke-width":4, class:"fade", style:`animation-delay:${200 + k*150}ms`}));
      const ty = dir < 0 ? y - 30 : y + bh + 76;
      const g = el("g", {class:"fade", style:`animation-delay:${260 + k*150}ms`});
      g.appendChild(el("text", {x, y: ty, "text-anchor":"middle", class:"vlab",
        style:"font-size:34px"}, lab));
      // A 34px value needs more than 26px of clearance or its box eats the name.
      g.appendChild(el("text", {x, y: ty + (dir < 0 ? -34 : 32), "text-anchor":"middle",
        class:"axb", style:"font-size:17px"}, name));
      s.appendChild(g);
    });
  if (spec.verdict) s.appendChild(el("text", {x: W / 2, y: 44, "text-anchor":"middle",
    class:"vlab", style:"font-size:30px;fill:var(--s1)"}, spec.verdict));
  return s;
}

/* INSIDER — shares sold against shares bought, by recency bucket. */
function chartInsider(spec){
  const W = 1660, H = spec.height || 470, MID = W * 0.52, PT = 54;
  const s = svgRoot(W, H);
  const max = Math.max(...spec.rows.map(r => Math.max(r.sold, r.bought))) * 1.05;
  const rowH = (H - PT - 20) / spec.rows.length;
  // Fixed columns: row label, then a right-aligned figure column, then the bars.
  // Hanging the figure off the bar's end put the longest row's label on top of
  // its own category name.
  const VALX = 500, halfW = MID - VALX - 24;
  s.appendChild(el("text", {x: MID - 20, y: 30, "text-anchor":"end", class:"axb",
    style:"font-size:19px;letter-spacing:.1em;text-transform:uppercase;fill:var(--crit)"}, "Shares sold"));
  s.appendChild(el("text", {x: MID + 20, y: 30, class:"axb",
    style:"font-size:19px;letter-spacing:.1em;text-transform:uppercase;fill:var(--good)"}, "Shares bought"));
  s.appendChild(el("line", {x1:MID, y1:PT - 14, x2:MID, y2:H - 16,
    stroke:"var(--border)", "stroke-width":2}));

  spec.rows.forEach((r, i) => {
    const cy = PT + rowH * i + rowH / 2;
    s.appendChild(el("text", {x: 20, y: cy + 4, class:"axb", style:"font-size:23px"}, r.label));
    const wS = (r.sold / max) * halfW;
    const g = el("g", {class:"growX", style:`transform-origin:${MID}px ${cy}px;animation-delay:${i*90}ms`});
    g.appendChild(el("rect", {x: MID - wS, y: cy - 26, width: Math.max(2, wS), height: 52,
      rx: 4, class:"bar bad"}));
    s.appendChild(g);
    s.appendChild(el("text", {x: VALX, y: cy + 2, "text-anchor":"end", class:"vlab fade",
      style:`animation-delay:${260+i*90}ms;font-size:21px`}, r.soldLab));
    s.appendChild(el("text", {x: VALX, y: cy + 26, "text-anchor":"end", class:"ax fade",
      style:`animation-delay:${260+i*90}ms`}, r.sub));
    // the empty side is the finding
    s.appendChild(el("text", {x: MID + 26, y: cy + 6, class:"vlab",
      style:"font-size:23px;fill:var(--muted)"}, r.boughtLab));
  });
  return s;
}

/* PEERS — ranked multiples with an average line and a growth column beside. */
function chartPeers(spec){
  const W = 1660, H = spec.height || 500, LBL = 250, PR = 300, PT = 62;
  const s = svgRoot(W, H);
  const max = Math.max(...spec.rows.map(r => r.v)) * 1.12;
  const plotW = W - LBL - PR;
  const rowH = (H - PT - 24) / spec.rows.length;
  const X = v => LBL + (v / max) * plotW;

  if (spec.avg != null) {
    s.appendChild(el("rect", {x: X(spec.avg), y: PT - 8, width: W - PR - X(spec.avg),
      height: H - PT - 16, fill:"var(--crit)", opacity:".07"}));
    s.appendChild(el("line", {x1:X(spec.avg), y1:PT - 20, x2:X(spec.avg), y2:H - 24,
      stroke:"var(--warn)", "stroke-width":3}));
    s.appendChild(el("text", {x:X(spec.avg), y:PT - 30, "text-anchor":"middle", class:"vlab",
      style:"font-size:20px;fill:var(--warn)"}, spec.avgLab));
  }
  s.appendChild(el("text", {x: W - PR + 40, y: PT - 30, class:"axb",
    style:"font-size:17px;letter-spacing:.08em;text-transform:uppercase"}, spec.rightHead));

  spec.rows.forEach((r, i) => {
    const cy = PT + rowH * i + rowH / 2;
    const g = el("g", {class:"growX", style:`transform-origin:${LBL}px ${cy}px;animation-delay:${i*80}ms`});
    g.appendChild(el("rect", {x: LBL, y: cy - 26, width: Math.max(3, X(r.v) - LBL), height: 52,
      rx: 4, class: "bar " + (r.here ? "" : "mut")}));
    s.appendChild(g);
    s.appendChild(el("text", {x: LBL - 22, y: cy + 3, "text-anchor":"end",
      class: r.here ? "vlab" : "axb", style:`font-size:${r.here ? 22 : 20}px`}, r.name));
    s.appendChild(el("text", {x: X(r.v) + 18, y: cy + 6, class:"vlab fade",
      style:`animation-delay:${260+i*80}ms;font-size:25px${r.here ? ";fill:var(--s1)" : ""}`}, r.lab));
    s.appendChild(el("text", {x: W - PR + 40, y: cy + 6, class: r.here ? "vlab" : "axb",
      style:"font-size:22px"}, r.right));
  });
  return s;
}

/* Radar over N scored dimensions — the whole company as one shape. */
function chartRadar(spec){
  const S = 460, C = S / 2, R = S * 0.36, max = spec.max || 5;
  const s = svgRoot(S, S);
  const n = spec.axes.length;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
    return [C + Math.cos(a) * r, C + Math.sin(a) * r];
  };
  for (let ring = 1; ring <= max; ring++) {
    const d = spec.axes.map((_, i) => pt(i, R * ring / max)).map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + " Z";
