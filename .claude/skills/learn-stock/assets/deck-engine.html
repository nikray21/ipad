<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SWING-9TO5 — Swing Trading With a 9–5</title>
<style>
/* ============================================================
   SWING-9TO5 — flip-through deck build of the alpha-video episode.
   Same 19 slides, same words, same choreography — each slide's
   animation is a pure function of time-since-flip.
   Shortcuts match the episode-deck template:
   →/Space next · ← back · T theme · N notes · H HUD · G grid ·
   F fullscreen · R restart timer · C camera frame · ⇧C OBS numbers ·
   [ ] resize camera bubble · Esc close grid
   ============================================================ */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#1b1a19; --surface:#262624; --surface-2:#30302e;
  --border:rgba(240,238,230,0.10); --ink:#f0eee6; --ink-2:#c2c0b6; --muted:#8f8d84;
  --grid:#34322f; --accent:#d97757; --s1:#d67350; --s2:#4d90da;
  --good:#2f9e44; --warn:#e8a33d; --crit:#e05252;
  --accent-wash:rgba(217,119,87,0.12);
}
:root[data-theme="cream"] {
  color-scheme: light;
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f2f0e9;
  --border:rgba(25,25,25,0.11); --ink:#1f1e1d; --ink-2:#40403c; --muted:#6f6e66;
  --grid:#e6e3da; --accent:#c2603f; --s1:#c2603f; --s2:#2a78d6;
  --good:#257a33; --warn:#a9741a; --crit:#b8352f;
  --accent-wash:rgba(194,96,63,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  font-feature-settings:"kern","liga"; text-rendering:optimizeLegibility;
  display:flex; align-items:center; justify-content:center;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important; animation-iteration-count:1!important;
    transition-duration:.01ms!important; scroll-behavior:auto!important;
  }
}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;flex:none;overflow:hidden;background:var(--bg)}

/* ---------- Camera alignment guide (never on during a take) ---------- */
#camguide{position:absolute;inset:0;pointer-events:none;z-index:60}
#camguide .cg-col{position:absolute;top:0;bottom:0;background:var(--accent-wash);
  border-right:2px dashed var(--accent);opacity:.85}
#camguide .cg-box{position:absolute;border-radius:28px;background:var(--surface-2);
  border:2px solid var(--border);opacity:.55}
#camguide .cg-lab{position:absolute;text-align:center;font-size:19px;font-weight:700;
  color:var(--accent);letter-spacing:.02em}
#camguide .cg-lab span{display:block;font-size:16px;font-weight:600;color:var(--muted);
  margin-top:4px;letter-spacing:.04em}

/* ---------- Presenter notes drawer ---------- */
#notes{
  position:fixed; left:0; right:0; bottom:0; max-height:42vh; overflow:auto;
  background:var(--surface); border-top:2px solid var(--accent);
  padding:20px 30px 24px; display:none; z-index:80;
  box-shadow:0 -14px 40px rgba(0,0,0,.22);
}
#notes.on{display:block}
#notes .nh{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:9px}
#notes p{font-size:17.5px;line-height:1.5;color:var(--ink);max-width:1500px}

/* ---------- Grid overview ---------- */
#grid{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;overflow:auto;padding:34px}
#grid.on{display:block}
#grid .gg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
#grid .gc{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 14px;cursor:pointer}
#grid .gc:hover{border-color:var(--accent)}
#grid .gc.cur{border-color:var(--accent);background:var(--accent-wash)}
#grid .gc .gn{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.1em}
#grid .gc .gt{font-size:14px;margin-top:4px;line-height:1.28;color:var(--ink)}
#grid .tot{font-size:13px;color:var(--muted);margin-bottom:15px;letter-spacing:.04em}
#grid h3{font-size:13px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-bottom:15px;font-weight:800}

/* ---------- Presenter HUD ---------- */
#hud{
  position:fixed; top:12px; right:14px; z-index:85;
  display:none; gap:9px; align-items:center;
  font-size:12.5px; color:var(--muted); letter-spacing:.06em;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:6px 11px; font-variant-numeric:tabular-nums;
}
#hud.on{display:flex}
#hud b{color:var(--ink);font-weight:700}
#hud .over{color:var(--crit)}

/* ---------- Episode-deck signature chrome ---------- */
.kick{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:700;
  letter-spacing:.17em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
.kick .no{color:var(--accent)}
/* The punch line — lifted verbatim from deck_template.html. One line, 40px,
   bold words in accent; the explanation lives in the presenter notes. */
.punch{margin-top:auto;display:flex;gap:20px;align-items:center;
  border-left:5px solid var(--accent);padding:6px 0 6px 26px}
.punch p{font-size:40px;line-height:1.22;font-weight:680;letter-spacing:-.012em;
  color:var(--ink);max-width:1180px;text-wrap:balance;margin:0}
.punch p b{font-weight:800;color:var(--accent)}

/* ---------- Progress rail ticks ---------- */
#rail-ticks{display:flex;justify-content:space-between;margin-top:8px}
#rail-ticks span{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);opacity:.7;cursor:pointer;font-variant-numeric:tabular-nums;
  transition:color .2s cubic-bezier(.25,1,.5,1),opacity .2s cubic-bezier(.25,1,.5,1)}
#rail-ticks span:hover{color:var(--ink);opacity:1}
#rail-ticks span.cur{color:var(--accent);opacity:1}
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud"><span id="hud-slide"></span><span>·</span><span id="hud-target"></span><span>·</span><b id="hud-clock">0:00</b></div>
<div id="notes"><div class="nh" id="notes-head">Presenter notes</div><p id="notes-body"></p></div>
<div id="grid"><h3>All slides — click to jump · Esc to close</h3>
<div class="tot" id="grid-total"></div><div class="gg" id="grid-cells"></div></div>

<script>
(() => {
"use strict";

/* ============================================================
   Tokens — two palettes, JS-side (all slide paint is inline).
   Kept literally in sync with the CSS vars above.
   ============================================================ */
const TOK = {
  dark: {
    bg:'#1b1a19', surface:'#262624', surface2:'#30302e', ink:'#f0eee6', ink2:'#c2c0b6',
    muted:'#8f8d84', grid:'#34322f', accent:'#d97757', s1:'#d67350', s2:'#4d90da',
    good:'#2f9e44', warn:'#e8a33d', crit:'#e05252',
    bgRGB:'27,26,25', accentRGB:'217,119,87',
    accentWash:'rgba(217,119,87,.12)', goodWash:'rgba(47,158,68,.12)',
    critWash:'rgba(224,82,82,.14)', warnWash:'rgba(232,163,61,.14)',
    s2Wash:'rgba(77,144,218,.16)',
    // dark elevation = a hairline light edge on top, never a drop shadow
    cardShadow:'inset 0 1px 0 rgba(240,238,230,.055)',
    vignette:'radial-gradient(ellipse at 55% 45%, transparent 55%, rgba(0,0,0,.16) 100%)',
    grainOp:'.05', glow2RGB:'232,163,61'
  },
  cream: {
    bg:'#faf9f5', surface:'#ffffff', surface2:'#f2f0e9', ink:'#1f1e1d', ink2:'#40403c',
    muted:'#6f6e66', grid:'#e6e3da', accent:'#c2603f', s1:'#c2603f', s2:'#2a78d6',
    good:'#257a33', warn:'#a9741a', crit:'#b8352f',
    bgRGB:'250,249,245', accentRGB:'194,96,63',
    accentWash:'rgba(194,96,63,.10)', goodWash:'rgba(37,122,51,.10)',
    critWash:'rgba(184,53,47,.10)', warnWash:'rgba(169,116,26,.11)',
    s2Wash:'rgba(42,120,214,.13)',
    cardShadow:'0 1px 2px rgba(25,25,25,.06)',
    vignette:'radial-gradient(ellipse at 55% 45%, transparent 60%, rgba(31,30,29,.055) 100%)',
    grainOp:'.033', glow2RGB:'169,116,26'
  }
};
let C = TOK.dark;

const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
/* The content column's left edge is DYNAMIC — colLeft(), defined with the camera
   state below. Camera mode on (default): 96 + reserved column = 792, the exact
   video-build geometry. Camera mode off (press c): 96, full-bleed like the
   episode deck. */
const COL_RIGHT = 96;
const SLIDE_TARGET = 15;
const TOTAL_TARGET = () => DEFS.length * SLIDE_TARGET;   // fn: DEFS defined later

/* ============================================================
   Motion system — verbatim from the video deck
   ============================================================ */
const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOutCubic  = x => 1 - Math.pow(1 - x, 3);
const easeInCubic   = x => x * x * x;
const easeInOutCubic= x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;
const easeOutBack   = x => { const c1=1.70158,c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const easeOutExpo   = x => x >= 1 ? 1 : 1 - Math.pow(2, -10*x);   // dramatic settle
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const draw = (t,s,d=1) => easeInOutCubic(clamp01((t-s)/d));
const prog = (t,s,d) => clamp01((t-s)/d);
const breathe = (T,sp=.5,amt=.02,ph=0) => 1 + amt*Math.sin(T*sp+ph);
const floatY  = (T,sp=.6,amt=4,ph=0) => amt*Math.sin(T*sp+ph);

/* Style appliers — each sets an element to its state at time t */
function stEnter(el,t,start,dy=26,dur=.7){
  const e = easeOutCubic(clamp01((t-start)/dur));
  el.style.opacity = e; el.style.transform = `translateY(${(1-e)*dy}px)`;
}
const stRise = stEnter;
function stPop(el,t,start,dur=.55){
  const p = clamp01((t-start)/dur), e = easeOutBack(p);
  el.style.opacity = clamp01(p*2); el.style.transform = `scale(${.6+.4*e})`;
}
function stFocus(el,t,start,dur=.85,dy=30){
  const p = easeOutCubic(clamp01((t-start)/dur));
  el.style.opacity = p; el.style.transform = `translateY(${(1-p)*dy}px)`;
  el.style.filter = `blur(${(1-p)*7}px)`;
}
/* SVG group pop about a point */
function svPop(g,t,start,cx,cy,dur=.55){
  const p = clamp01((t-start)/dur), e = easeOutBack(p), s = .6+.4*e;
  g.setAttribute('opacity', clamp01(p*2));
  g.setAttribute('transform', `translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})`);
}

/* ============================================================
   DOM helpers
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
function H(tag, style, html){
  const e = document.createElement(tag);
  if (style) Object.assign(e.style, style);
  if (html != null) e.innerHTML = html;
  return e;
}
function S(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  return e;
}
/* a stroke that draws in via dash: pathLength=1 */
function drawablePath(d, stroke, width, extra){
  const p = S('path', Object.assign({d, fill:'none', stroke, 'stroke-width':width,
    'stroke-linecap':'round', pathLength:'1', 'stroke-dasharray':'1', 'stroke-dashoffset':'1'}, extra||{}));
  return p;
}
function setDraw(p, v){ p.setAttribute('stroke-dashoffset', String(1 - v)); }

/* ============================================================
   Stage + persistent furniture
   ============================================================ */
const stage = document.getElementById('stage');

const fadeLayer = H('div', {position:'absolute', inset:'0', zIndex:'0', pointerEvents:'none'});
const glowLayer = H('div', {position:'absolute', top:'-200px', right:'-100px', width:'1100px',
  height:'900px', borderRadius:'50%', zIndex:'0', pointerEvents:'none'});
/* Second ambient glow — adjacent warm hue, very low alpha, slow counter-phase
   drift. Two close hues at low chroma = calm depth, not a rave. */
const glow2Layer = H('div', {position:'absolute', bottom:'-260px', left:'620px', width:'900px',
  height:'700px', borderRadius:'50%', zIndex:'0', pointerEvents:'none'});
const dotLayer  = H('div', {position:'absolute', left:'720px', right:'0', top:'0', bottom:'0',
  opacity:'.5', zIndex:'0', pointerEvents:'none',
  webkitMaskImage:'linear-gradient(90deg, transparent 0%, #000 14%)',
  maskImage:'linear-gradient(90deg, transparent 0%, #000 14%)'});
stage.append(fadeLayer, glowLayer, glow2Layer, dotLayer);

/* Vignette (implied light) + film grain (kills banding on the glows, adds
   warmth). Both static, painted per theme, over the slide but under chrome. */
const vignetteLayer = H('div', {position:'absolute', inset:'0', zIndex:'5', pointerEvents:'none'});
const grainLayer = H('div', {position:'absolute', inset:'0', zIndex:'5', pointerEvents:'none',
  mixBlendMode:'overlay',
  backgroundImage:'url("data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%222%22 stitchTiles=%22stitch%22/></filter><rect width=%22240%22 height=%22240%22 filter=%22url(%23n)%22 opacity=%220.5%22/></svg>")',
  backgroundSize:'240px 240px'});
stage.append(vignetteLayer, grainLayer);

function paintFurnitureStatic(){
  // Camera mode keeps the baked left-gutter fade; full-bleed paints solid.
  fadeLayer.style.background = (typeof CAM !== 'undefined' && !CAM) ? C.bg :
    `linear-gradient(90deg, rgba(${C.bgRGB},0) 0%, rgba(${C.bgRGB},0) 25%, ` +
    `rgba(${C.bgRGB},.55) 33%, rgba(${C.bgRGB},.94) 40%, ${C.bg} 48%)`;
  dotLayer.style.backgroundImage = `radial-gradient(${C.grid} 1.4px, transparent 1.4px)`;
  dotLayer.style.backgroundSize = '46px 46px';
  vignetteLayer.style.background = C.vignette;
  grainLayer.style.opacity = C.grainOp;
}
function furnitureUpdate(G){
  const A = 0.05 + 0.045*(0.5 + 0.5*Math.sin(G*0.5));
  glowLayer.style.background =
    `radial-gradient(circle, rgba(${C.accentRGB},${A.toFixed(4)}) 0%, transparent 62%)`;
  const A2 = 0.028 + 0.018*(0.5 + 0.5*Math.sin(G*0.35 + 2.2));
  glow2Layer.style.background =
    `radial-gradient(circle, rgba(${C.glow2RGB},${A2.toFixed(4)}) 0%, transparent 60%)`;
  const D = (G*6) % 40;
  dotLayer.style.backgroundPosition = `${D}px ${D}px`;
}

/* slide mount point */
const slideHost = H('div', {position:'absolute', inset:'0', zIndex:'1'});
stage.appendChild(slideHost);

/* Footer */
const footer = H('div', {position:'absolute', left:'792px', bottom:'44px', zIndex:'2',
  fontSize:'15px', letterSpacing:'.08em'});
footer.innerHTML = `<b style="font-weight:700;letter-spacing:.08em">NIKRAYANI</b>` +
  `<span>&nbsp;&nbsp;·&nbsp;&nbsp;Educational — not financial advice</span>`;
stage.appendChild(footer);
function paintFooter(){
  footer.style.color = C.muted;
  footer.querySelector('b').style.color = C.ink2;
}

/* Progress rail */
const rail = H('div', {position:'absolute', left:'792px', right:COL_RIGHT+'px',
  bottom:'82px', zIndex:'3'});
const railTrack = H('div', {height:'3px', borderRadius:'2px'});
const railFill  = H('div', {height:'3px', borderRadius:'2px', width:'0%'});
railTrack.appendChild(railFill);
const railTicks = H('div'); railTicks.id = 'rail-ticks';
rail.append(railTrack, railTicks);
stage.appendChild(rail);
/* Ticks derive from DEFS.length — built at boot so any slide count works. */
function buildRailTicks(){
  railTicks.innerHTML = '';
  for (let i = 0; i < DEFS.length; i++){
    const s = document.createElement('span');
    s.textContent = String(i+1).padStart(2,'0');
    s.onclick = () => show(i);
    railTicks.appendChild(s);
  }
}
function paintRail(){
  railTrack.style.background = C.grid;
  railFill.style.background = C.accent;
  railFill.style.boxShadow = `0 0 10px rgba(${C.accentRGB},.5)`;
}
function railUpdate(t){
  const p = (cur + clamp01(t/SLIDE_TARGET)) / DEFS.length;
  railFill.style.width = (p*100).toFixed(3) + '%';
}
function railMark(){
  [...railTicks.children].forEach((s,i) => s.classList.toggle('cur', i === cur));
}

/* Boundary sweep — plays for 0.5s on every flip */
const sweep = H('div', {position:'absolute', left:'744px', right:'0', top:'0',
  bottom:'0', zIndex:'4', pointerEvents:'none', overflow:'hidden'});
const sweepBand = H('div', {position:'absolute', top:'0', bottom:'0', width:'200px',
  filter:'blur(3px)', opacity:'0'});
sweep.appendChild(sweepBand);
stage.appendChild(sweep);
function sweepUpdate(t){
  if (cur === 0 && !flipped) { sweepBand.style.opacity = '0'; return; }
  if (t >= 0.5){ sweepBand.style.opacity = '0'; return; }
  const x = t/0.5, p = easeInOutCubic(x), glow = 0.55*(1 - Math.abs(x-0.5)*2);
  sweepBand.style.opacity = '1';
  sweepBand.style.left = `calc(${(p*100).toFixed(2)}% - 100px)`;
  sweepBand.style.background =
    `linear-gradient(90deg, transparent, rgba(${C.accentRGB},${glow.toFixed(3)}), transparent)`;
}

/* ============================================================
   Camera guide — the transparent gutter IS the camera zone in
   this deck's design (baked in), so C toggles the slot frame,
   ⇧C the OBS pixel numbers, [ ] the bubble width.
   ============================================================ */
function _stored(k,d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } }
const _q = new URLSearchParams(location.search);
let CAM = (_q.get('cam') || _stored('nr_swing_cam', 'left')) !== 'off';
/* 36.25% = 696px reserved → column starts at 96+696 = 792, the video build's
   exact geometry. Stored with decimals so the default round-trips. */
let CAMW = Math.min(45, Math.max(15, parseFloat(_q.get('camw') || _stored('nr_swing_camw','36.25')))) / 100;
let camGuideOn = false;
function camPx(){ return Math.round(1920 * CAMW); }
function colLeft(){ return CAM ? COL_RIGHT + camPx() : COL_RIGHT; }
/* Reflow everything that hangs off the column's left edge, then rebuild the
   current slide at the new width — same behavior as the episode deck's setCam. */
function relayout(){
  footer.style.left = colLeft() + 'px';
  rail.style.left = colLeft() + 'px';
  sweep.style.left = (colLeft() - 48) + 'px';
  paintFurnitureStatic();
  drawCamGuide();
}
function setCam(on, w){
  CAM = on;
  if (w != null) CAMW = Math.min(0.45, Math.max(0.15, w));
  try {
    localStorage.setItem('nr_swing_cam', on ? 'left' : 'off');
    localStorage.setItem('nr_swing_camw', (CAMW*100).toFixed(2));
  } catch(e){}
  if (!on) camGuideOn = false;
  relayout();
  mountSlide(cur);      // rebuild at the new column width, clock untouched
}
function camBubbleBox(){
  if (!CAM) return null;
  const px = camPx(), M = 44;
  const w = px - M*2;
  const h = Math.min(1080 - M*2, Math.round(w*4/3));
  return {x: M, y: Math.round((1080-h)/2), w, h, colX: 0, colW: px};
}
function drawCamGuide(){
  let g = document.getElementById('camguide');
  const box = camBubbleBox();
  if (!box){ if (g) g.remove(); return; }
  if (!g){ g = H('div'); g.id = 'camguide'; stage.appendChild(g); }
  g.innerHTML =
    `<div class="cg-box" style="left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${box.h}px"></div>` +
    (camGuideOn
      ? `<div class="cg-col" style="left:${box.colX}px;width:${box.colW}px"></div>` +
        `<div class="cg-lab" style="left:${box.x}px;top:${box.y+box.h+16}px;width:${box.w}px">` +
          `<b>put the camera here</b> ${box.w} &times; ${box.h} at ${box.x}, ${box.y}` +
          `<span>reserved column ${box.colW}px &middot; ${(CAMW*100).toFixed(0)}% &middot; ` +
          `⇧C hides these numbers</span></div>`
      : '');
}

/* ============================================================
   Slide chrome — SlideFrame
   ============================================================ */
function buildFrame(def){
  const root = H('div', {position:'absolute', inset:'0', transformOrigin:'62% 45%'});
  const ups = [];

  // Ghost numeral
  const ghost = H('div', {position:'absolute', top:'300px', right:(COL_RIGHT-24)+'px',
    zIndex:'0', fontSize:'360px', fontWeight:'800', letterSpacing:'-.05em',
    lineHeight:'1', textAlign:'right', fontFamily:FONT,
    background:`linear-gradient(180deg, ${C.ink}, transparent)`,
    webkitBackgroundClip:'text', backgroundClip:'text', color:'transparent',
    fontVariantNumeric:'tabular-nums'});
  ghost.textContent = String(def.num).padStart(2,'0');
  root.appendChild(ghost);
  ups.push(t => {
    const p = easeOutCubic(prog(t, .1, 1.4));
    ghost.style.opacity = (0.09*p).toFixed(4);
    ghost.style.transform = `translateY(${(1-p)*24}px) scale(${breathe(t,.35,.014)})`;
  });

  // Content column
  // bottom 132 (was 104): the editorial why-band needs clear air above the
  // progress rail now that its box is gone — the fill read as an underline.
  const col = H('div', {position:'absolute', left:colLeft()+'px', right:COL_RIGHT+'px',
    top:'116px', bottom:'132px', display:'flex', flexDirection:'column', zIndex:'1'});
  root.appendChild(col);

  if (def.kicker){
    // Episode-deck kicker: slide number in accent, label in muted small caps.
    const kRow = H('div');
    kRow.className = 'kick';
    const no = H('span', {fontVariantNumeric:'tabular-nums'});
    no.className = 'no';
    no.textContent = String(def.num).padStart(2,'0');
    const k = H('span');
    k.textContent = def.kicker;
    kRow.append(no, k);
    col.appendChild(kRow);
    ups.push(t => stEnter(kRow, t, .15));
  }

  // Headline: masked word-by-word rise — each word in an overflow-hidden
  // wrapper, staggered 70ms, easeOutExpo settle. Padding/negative-margin on the
  // mask keeps descenders from clipping at this tight line-height.
  const head = H('div', {fontSize:(def.headSize||64)+'px', fontWeight:'760',
    letterSpacing:'-.022em', lineHeight:'1.06', color:C.ink});
  const headWords = def.head.split(' ').map(w => {
    const wrap = H('span', {display:'inline-block', overflow:'hidden',
      verticalAlign:'top', padding:'0.06em 0 0.14em', margin:'-0.06em 0 -0.14em'});
    const inner = H('span', {display:'inline-block', transform:'translateY(112%)'});
    inner.textContent = w;
    wrap.appendChild(inner);
    head.appendChild(wrap);
    head.appendChild(document.createTextNode(' '));
    return inner;
  });
  col.appendChild(head);
  ups.push(t => {
    headWords.forEach((w, i) => {
      const p = easeOutExpo(clamp01((t - (0.32 + i*0.07)) / 0.9));
      w.style.transform = `translateY(${((1-p)*112).toFixed(2)}%)`;
    });
  });

  // No sub line — executive style: the speaker carries the words. The long
  // form lives in def.notes and lands in the presenter-notes drawer (N).

  // Visual block, with the gentle 5px bob
  const visWrap = H('div', {flex:'1', display:'flex', alignItems:'center',
    justifyContent:'center', minHeight:'0', marginTop:'18px'});
  const vis = H('div', {width:'100%'});
  visWrap.appendChild(vis);
  col.appendChild(visWrap);
  ups.push(t => { vis.style.transform = `translateY(${floatY(t,.5,5).toFixed(2)}px)`; });

  if (def.punch){
    const band = H('div');
    band.className = 'punch';
    band.innerHTML = `<p>${def.punch}</p>`;
    col.appendChild(band);
    ups.push(t => stEnter(band, t, 1.2, 16));
  }

  // entrance envelope on the whole slide
  ups.push(t => {
    const inP = easeOutCubic(clamp01(t/0.8));
    root.style.opacity = inP;
    root.style.transform = `translateY(${(1-inP)*46}px) scale(${0.985 + 0.015*inP})`;
  });

  return {root, vis, ups};
}

/* ---- 14 · Guardrails ---- */
function vGuardrails(vis){
  const ups = [];
  const row = H('div', {display:'flex', gap:'16px'});
  [['2','positions max', C.s2, .9],
   ['≤4%','total risk', C.warn, 1.15],
   ['≥2:1','reward : risk', C.good, 1.4]
  ].forEach(([big, lab, color, at]) => {
    const c = card({flex:'1', padding:'26px 24px', borderRadius:'16px', opacity:'0'});
    c.innerHTML = `<div style="font-size:66px;font-weight:770;color:${color};letter-spacing:-.02em;font-variant-numeric:tabular-nums"></div>` +
      `<div style="font-size:18px;color:${C.ink2};margin-top:6px"></div>`;
    c.children[0].textContent = big; c.children[1].textContent = lab;
    row.appendChild(c);
    ups.push(t => stRise(c, t, at, 20));
  });
  vis.appendChild(row);

  // Survival staircase: 100% through five straight 2% losses. Values are
  // computed (0.98^n) — the end label can never disagree with the math.
  const vals = Array.from({length:6}, (_, n) => 100*Math.pow(0.98, n));
  const X = i => 50 + i*105, Y = v => 20 + (101 - v)*(160/12);
  let d = `M${X(0)},${Y(vals[0]).toFixed(1)}`;
  for (let i = 1; i < 6; i++) d += ` H${X(i)} V${Y(vals[i]).toFixed(1)}`;
  const bottomRow = H('div', {display:'flex', gap:'28px', alignItems:'center',
    marginTop:'22px'});
  const chartWrap = H('div', {flex:'1', minWidth:'0'});
  const svg = S('svg', {viewBox:'0 0 640 230',
    style:'width:100%;max-width:640px;display:block;overflow:visible'});
  const area = S('path', {d:`${d} V190 H${X(0)} Z`, fill:C.warnWash, opacity:0});
  const line = drawablePath(d, C.warn, 3);
  svg.append(area, line);
  const dots = vals.map((v, i) => {
    const dot = S('circle', {cx:X(i), cy:Y(v), r:5, fill:C.warn, opacity:0});
    svg.appendChild(dot); return dot;
  });
  const lab0 = S('text', {x:X(0), y:Y(vals[0])-14, fill:C.muted, 'font-size':15,
    'font-weight':600, 'text-anchor':'middle', 'font-family':FONT,
    'font-variant-numeric':'tabular-nums', opacity:0});
  lab0.textContent = '100%';
  const lab5 = S('text', {x:X(5)+16, y:Y(vals[5])+6, fill:C.warn, 'font-size':19,
    'font-weight':800, 'text-anchor':'start', 'font-family':FONT,
    'font-variant-numeric':'tabular-nums', opacity:0});
  lab5.textContent = `~${vals[5].toFixed(0)}%`;
  const cap = S('text', {x:(X(0)+X(5))/2, y:222, fill:C.muted, 'font-size':14,
    'text-anchor':'middle', 'font-family':FONT, opacity:0});
  cap.textContent = 'five straight 2% losses';
  svg.append(lab0, lab5, cap);
  chartWrap.appendChild(svg);

  const never = H('div', {flex:'none', display:'flex', alignItems:'center', gap:'18px',
    padding:'18px 24px', borderRadius:'12px', background:C.critWash,
    border:`1px solid ${C.crit}`, opacity:'0'});
  never.innerHTML =
    `<span style="font-size:24px;font-weight:900;color:${C.crit};letter-spacing:.04em">NEVER</span>` +
    `<span style="font-size:21px;font-weight:600;color:${C.ink}">move a stop down</span>`;
  bottomRow.append(chartWrap, never);
  vis.appendChild(bottomRow);

  ups.push(t => {
    const p = draw(t, 1.6, 1.0);
    setDraw(line, p);
    area.setAttribute('opacity', p*.9);
    dots.forEach((dot, i) => dot.setAttribute('opacity', p >= i/5 && t > 1.6 ? 1 : 0));
    lab0.setAttribute('opacity', t > 1.7 ? 1 : 0);
    lab5.setAttribute('opacity', p >= 1 ? 1 : 0);
    cap.setAttribute('opacity', t > 2.4 ? 1 : 0);
    stPop(never, t, 2.6);
    if (t > 2.6 && t < 3.0){
      const sh = Math.sin((t-2.6)*70)*4;
      never.style.transform += ` translateX(${sh.toFixed(2)}px)`;
    }
  });
  return ups;
}

    stEnter(tbl, t, .7, 16);
    rows.forEach((r, i) => stRise(r, t, 1.1 + i*0.2, 12));
  });
  return ups;
}

/* ---- 18 · Expectancy ---- */
function vExpectancy(vis){
  // Probability tree (visual-library pattern 3) — the branches make the
  // expectancy math visible instead of asserted. EV chip is computed from
  // the same numbers the branches show.
  const ups = [];
  const svg = S('svg', {viewBox:'0 0 960 330',
    style:'width:100%;max-width:960px;display:block;margin:0 auto;overflow:visible'});
  const node = (x, y, w, lab, col) => {
    const g = S('g', {opacity:0});
    g.appendChild(S('rect', {x:x-w/2, y:y-24, width:w, height:48, rx:10,
      fill:C.surface, stroke:col, 'stroke-width':1.5}));
    const tx = S('text', {x, y:y+7, fill:col, 'font-size':20, 'font-weight':760,
      'text-anchor':'middle', 'font-family':FONT, 'font-variant-numeric':'tabular-nums'});
    tx.textContent = lab;
    g.appendChild(tx); svg.appendChild(g);
    return {g, x, y};
  };
  const root = node(110, 165, 150, '1 trade', C.ink);
  const win  = node(480, 75, 130, 'WIN', C.good);
  const lose = node(480, 255, 130, 'LOSE', C.crit);
  const win2 = node(820, 75, 150, '+2R', C.good);
  const lose2= node(820, 255, 150, '−1R', C.crit);
  const e1 = drawablePath('M185,153 C300,115 360,90 415,79', C.good, 2.5);
  const e2 = drawablePath('M185,177 C300,215 360,240 415,251', C.crit, 2.5);
  const e3 = drawablePath('M545,75 L745,75', C.good, 2.5);
  const e4 = drawablePath('M545,255 L745,255', C.crit, 2.5);
  svg.append(e1, e2, e3, e4);
  const p1 = S('text', {x:300, y:96, fill:C.good, 'font-size':18, 'font-weight':800,
    'font-family':FONT, 'font-variant-numeric':'tabular-nums', opacity:0});
  p1.textContent = '40%';
  const p2 = S('text', {x:300, y:246, fill:C.crit, 'font-size':18, 'font-weight':800,
    'font-family':FONT, 'font-variant-numeric':'tabular-nums', opacity:0});
  p2.textContent = '60%';
  svg.append(p1, p2);
  const EV = 0.4*2 - 0.6*1;                            // computed, not typed
  const evChip = H('div', {display:'inline-flex', gap:'10px', alignItems:'center',
    marginTop:'16px', padding:'12px 22px', borderRadius:'999px',
    background:C.accentWash, border:`1px solid ${C.accent}`, fontSize:'22px',
    fontWeight:'760', color:C.ink, opacity:'0', fontVariantNumeric:'tabular-nums'});
  evChip.innerHTML = `40% × 2R − 60% × 1R = ` +
    `<span style="color:${C.accent};font-weight:800">+${EV.toFixed(1)}R per trade</span>`;
  const wrap = H('div', {textAlign:'center'});
  wrap.append(svg, evChip);
  vis.appendChild(wrap);
  ups.push(t => {
    svPop(root.g, t, .7, root.x, root.y);
    setDraw(e1, draw(t, 1.2, .7)); setDraw(e2, draw(t, 1.35, .7));
    p1.setAttribute('opacity', draw(t, 1.7, .4));
    p2.setAttribute('opacity', draw(t, 1.85, .4));
    svPop(win.g, t, 1.9, win.x, win.y); svPop(lose.g, t, 2.05, lose.x, lose.y);
    setDraw(e3, draw(t, 2.5, .6)); setDraw(e4, draw(t, 2.65, .6));
    svPop(win2.g, t, 3.0, win2.x, win2.y); svPop(lose2.g, t, 3.15, lose2.x, lose2.y);
    stEnter(evChip, t, 3.8, 14);
  });
  return ups;
}

/* ---- 19 · Recap ---- */
function vRecap(vis){
  const ups = [];
  const wrap = H('div', {position:'relative'});
  const chipsRow = H('div', {display:'flex', flexWrap:'wrap', gap:'12px'});
  const chips = ['Trend','Location','Trap','Trigger','Stop','Exit'].map((lab, i) => {
    const ch = H('div', {padding:'13px 20px', borderRadius:'999px', fontSize:'20px',
      fontWeight:'600', background:C.surface, border:`1px solid ${C.grid}`,
      color:C.ink, opacity:'0', fontVariantNumeric:'tabular-nums'},
      `${i+1} · ${lab}`);
    chipsRow.appendChild(ch); return ch;
  });
  wrap.appendChild(chipsRow);
  const line = H('div', {marginTop:'30px', fontSize:'46px', fontWeight:'780',
    letterSpacing:'-.02em', color:C.ink, display:'flex', gap:'14px', flexWrap:'wrap'});
  const words = 'All six, or no trade.'.split(' ').map((w, i) => {
    const s = H('span', {opacity:'0', display:'inline-block'}, w);
    line.appendChild(s); return s;
  });
  wrap.appendChild(line);

  const sub = H('div', {marginTop:'38px', position:'relative', height:'110px'});
  const btn = H('div', {position:'absolute', left:'0', top:'0', display:'inline-flex',
    alignItems:'center', gap:'14px', padding:'18px 34px', borderRadius:'999px',
    background:C.crit, color:'#fff', fontSize:'24px', fontWeight:'800', opacity:'0'});
  btn.innerHTML = `<span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:22px;background:#fff;border-radius:4px;color:${C.crit};font-size:13px">▶</span><span>Subscribe</span>`;
  const cursor = H('div', {position:'absolute', fontSize:'34px', color:C.ink,
    transform:'rotate(-12deg)', opacity:'0', zIndex:'2'}, '➤');
  const ripple = H('div', {position:'absolute', border:`2px solid ${C.warn}`,
    borderRadius:'50%', opacity:'0', pointerEvents:'none'});
  sub.append(btn, cursor, ripple);
  wrap.appendChild(sub);
  vis.appendChild(wrap);

  ups.push(t => {
    chips.forEach((ch, i) => {
      stRise(ch, t, 0.5 + i*0.12, 16, .5);
      const lit = t >= 3.2 + i*0.18 && t < 3.2 + i*0.18 + 0.5;
      ch.style.background = lit ? C.accent : C.surface;
      ch.style.color = lit ? '#fff' : C.ink;
      ch.style.borderColor = lit ? C.accent : C.grid;
    });
    words.forEach((w, i) => stRise(w, t, 1.9 + i*0.16, 20, .5));
    stEnter(btn, t, 4.6, 16);
    const clicked = t > 7.0;
    btn.style.background = clicked ? '#b45c40' : C.crit;
    if (clicked) btn.style.transform += ' scale(.97)';
    if (t > 5.5){
      const p = easeInOutCubic(clamp01((t-5.6)/1.4));
      cursor.style.opacity = 1;
      cursor.style.left = (-40 + 200*p).toFixed(1)+'px';
      cursor.style.top = (-60 + 70*p).toFixed(1)+'px';
    } else cursor.style.opacity = 0;
    if (t >= 7.0 && t <= 7.5){
      const rp = (t-7.0)/0.5, r = 10 + 65*rp;
      ripple.style.opacity = (1-rp).toFixed(3);
      ripple.style.width = ripple.style.height = (r*2).toFixed(1)+'px';
      ripple.style.left = (190 - r).toFixed(1)+'px';
      ripple.style.top = (33 - r).toFixed(1)+'px';
    } else ripple.style.opacity = 0;
  });
  return ups;
}

/* ============================================================
   Show / navigation / clock
   ============================================================ */
let cur = 0, curUps = null, slideStart = performance.now(), G0 = performance.now();
let flipped = false;
let notesOn = false, hudOn = false, t0 = null, tick = null;

function mountSlide(i){
  slideHost.innerHTML = '';
  const def = DEFS[i];
  const frame = buildFrame({
    num: i+1, kicker: def.kicker, head: def.head, punch: def.punch,
    headSize: def.headSize
  });
  const visUps = def.mount(frame.vis);
  slideHost.appendChild(frame.root);
  curUps = frame.ups.concat(visUps);
}

function show(i, keepTime){
  const prev = cur;
  cur = Math.max(0, Math.min(DEFS.length-1, i));
  if (!keepTime){ slideStart = performance.now(); if (prev !== cur || flipped) flipped = true; }
  mountSlide(cur);
  railMark();
  const d = DEFS[cur];
  document.getElementById('notes-body').textContent = d.notes || '—';
  document.getElementById('notes-head').textContent =
    `Slide ${cur+1} of ${DEFS.length} — ${d.head}`;
  document.getElementById('hud-slide').textContent = `${cur+1}/${DEFS.length}`;
  document.getElementById('hud-target').textContent = `target ${SLIDE_TARGET}s`;
  location.hash = 's' + (cur+1);
  buildGrid();
}

function startClock(){
  t0 = Date.now();
  clearInterval(tick);
  tick = setInterval(() => {
    const s = Math.floor((Date.now()-t0)/1000);
    const cEl = document.getElementById('hud-clock');
    cEl.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
    cEl.classList.toggle('over', s > TOTAL_TARGET());
  }, 500);
}

function buildGrid(){
  const g = document.getElementById('grid-cells');
  g.innerHTML = DEFS.map((s, i) =>
    `<div class="gc${i===cur?' cur':''}" data-i="${i}">
     <div class="gn">${String(i+1).padStart(2,'0')} · ${SLIDE_TARGET}s</div>
     <div class="gt"></div></div>`).join('');
  [...g.children].forEach((cEl, i) => {
    cEl.querySelector('.gt').textContent = DEFS[i].head;
    cEl.onclick = () => { show(i); document.getElementById('grid').classList.remove('on'); };
  });
  const m = TOTAL_TARGET();
  document.getElementById('grid-total').textContent =
    `${DEFS.length} slides · ${SLIDE_TARGET}s each · full run ${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
}

/* ============================================================
   Theme
   ============================================================ */
function setTheme(name){
  document.documentElement.setAttribute('data-theme', name);
  C = TOK[name] || TOK.dark;
  try { localStorage.setItem('nr_swing_theme', name); } catch(e){}
  paintFurnitureStatic(); paintFooter(); paintRail(); drawCamGuide();
  mountSlide(cur);           // repaint with the new tokens, clock untouched
}

/* ============================================================
   Fit + rAF loop
   ============================================================ */
function fit(){
  const W = window.innerWidth, Hh = window.innerHeight;
  stage.style.transform = `scale(${Math.min(W/1920, Hh/1080)})`;
}
window.addEventListener('resize', fit);

function loop(now){
  // Reduced motion: everything is a pure function of t, so t=99 IS the settled
  // final frame of every animation; G=0 freezes the ambient drift.
  const G = REDUCED ? 0 : (now - G0)/1000;
  const t = REDUCED ? 99 : (now - slideStart)/1000;
  furnitureUpdate(G);
  railUpdate(t);
  sweepUpdate(t);
  if (curUps) curUps.forEach(u => u(t));
  requestAnimationFrame(loop);
}

/* ============================================================
   Keys — identical map to the episode deck template
   ============================================================ */
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape'){ document.getElementById('grid').classList.remove('on'); return; }
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); show(cur+1); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); show(cur-1); }
  else if (k === 'Home') show(0);
  else if (k === 'End') show(DEFS.length-1);
  else if (k === 't' || k === 'T')
    setTheme(document.documentElement.getAttribute('data-theme') === 'cream' ? 'dark' : 'cream');
  else if (k === 'n' || k === 'N'){
    notesOn = !notesOn; document.getElementById('notes').classList.toggle('on', notesOn);
  }
  else if (k === 'h' || k === 'H'){
    hudOn = !hudOn; document.getElementById('hud').classList.toggle('on', hudOn);
    if (hudOn && !t0) startClock();
  }
  else if (k === 'r' || k === 'R') startClock();
  else if (k === 'C' && e.shiftKey){
    if (!CAM) return;
    camGuideOn = !camGuideOn; drawCamGuide();
  }
  else if (k === 'c') setCam(!CAM);
  else if ((k === '[' || k === ']') && CAM)
    setCam(CAM, CAMW + (k === ']' ? 0.02 : -0.02));
  else if (k === 'g' || k === 'G'){
    document.getElementById('grid').classList.toggle('on'); buildGrid();
  }
  else if (k === 'f' || k === 'F'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
});

/* ============================================================
   Boot — stored theme, deep link, go
   ============================================================ */
setTheme(_q.get('theme') === 'cream' ? 'cream'
       : _q.get('theme') === 'dark' ? 'dark'
       : _stored('nr_swing_theme', 'dark'));
relayout(); paintFooter(); paintRail(); buildRailTicks();
fit();
show(location.hash.startsWith('#s') ? (+location.hash.slice(2)-1) || 0 : 0, false);
flipped = false;
requestAnimationFrame(loop);
console.log('[swing-deck] 19 slides · →/Space ← T N H G F R C ⇧C [ ] · same choreography as the video build');
})();
