<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example — Effects & micro-interaction gallery</title>
<!--
  DEMONSTRATES a grab-bag of signature techniques, each in its own cell:
  1) SVG self-drawing stroke        4) animated gradient border (@property)
  2) icon state morph (menu↔close)  5) magnetic / spring button
  3) split-text scramble reveal     6) marquee + duotone hover on image
  Read the source per cell; steal the technique.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --body:'Space Grotesk',system-ui,sans-serif;
    --bg:oklch(0.15 0.02 265);--surface:oklch(0.20 0.025 265);--text:oklch(0.96 0.01 265);
    --muted:oklch(0.66 0.02 265);--border:oklch(0.32 0.03 265);--accent:oklch(0.72 0.15 190);
    --ease:cubic-bezier(0.16,1,0.3,1);--back:cubic-bezier(0.34,1.5,0.64,1);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);padding:32px;-webkit-font-smoothing:antialiased}
  h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
  .lede{color:var(--muted);margin-bottom:28px}
  .gal{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .cell{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;
    min-height:190px;display:flex;flex-direction:column;gap:14px}
  .cell .t{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .stage{flex:1;display:grid;place-items:center}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

  /* 1 draw */
  .draw path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

  /* 2 icon morph */
  .burger{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--border)}
  .burger svg line{stroke:var(--text);stroke-width:2;stroke-linecap:round;transition:transform .4s var(--ease),opacity .3s var(--ease);transform-origin:center;transform-box:fill-box}
  .burger[aria-expanded="true"] .l1{transform:translateY(6px) rotate(45deg)}
  .burger[aria-expanded="true"] .l2{opacity:0}
  .burger[aria-expanded="true"] .l3{transform:translateY(-6px) rotate(-45deg)}

  /* 3 scramble */
  .scramble{font-size:1.5rem;font-weight:700;letter-spacing:.02em}

  /* 4 gradient border */
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  .gbtn{position:relative;padding:14px 26px;border-radius:999px;font-weight:600;color:var(--text);
    background:var(--surface);isolation:isolate}
  .gbtn::before{content:'';position:absolute;inset:-2px;border-radius:inherit;z-index:-1;
    background:conic-gradient(from var(--ang),var(--accent),oklch(0.7 0.16 300),var(--accent));
    animation:spin 4s linear infinite}
  @keyframes spin{to{--ang:360deg}}

  /* 5 spring button */
  .spring{padding:16px 30px;border-radius:12px;background:var(--accent);color:var(--bg);font-weight:700}

  /* 6 marquee + duotone */
  .marq{overflow:hidden;white-space:nowrap;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .marq span{display:inline-block;padding-right:1ch;animation:scroll 12s linear infinite;font-weight:700;font-size:1.3rem;color:var(--muted)}
  @keyframes scroll{to{transform:translateX(-50%)}}
  .thumb{width:100%;aspect-ratio:16/10;border-radius:10px;background:
    linear-gradient(135deg,oklch(0.5 0.1 265),oklch(0.4 0.06 320));
    filter:grayscale(1) contrast(1.1);transition:filter .5s var(--ease),transform .5s var(--ease)}
  .thumb:hover{filter:none;transform:scale(1.02)}

  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <h1>Effects & micro-interactions</h1>
  <p class="lede">Six signature techniques, one per cell. Hover, click, and read the source.</p>

  <div class="gal">
    <div class="cell"><span class="t">01 · SVG self-draw</span>
      <div class="stage"><svg class="draw" viewBox="0 0 120 80" width="150" height="100">
        <path d="M10,60 C30,10 50,10 60,40 C70,70 90,70 110,20"/></svg></div>
    </div>

    <div class="cell"><span class="t">02 · Icon morph</span>
      <div class="stage"><button class="burger" aria-expanded="false" aria-label="Menu" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded')!=='true')">
        <svg width="24" height="24" viewBox="0 0 24 24"><line class="l1" x1="4" y1="7" x2="20" y2="7"/><line class="l2" x1="4" y1="12" x2="20" y2="12"/><line class="l3" x1="4" y1="17" x2="20" y2="17"/></svg>
      </button></div>
    </div>

    <div class="cell"><span class="t">03 · Text scramble</span>
      <div class="stage"><span class="scramble" data-final="RESOLVE">RESOLVE</span></div>
    </div>

    <div class="cell"><span class="t">04 · Animated border</span>
      <div class="stage"><button class="gbtn">Get started</button></div>
    </div>

    <div class="cell"><span class="t">05 · Spring press</span>
      <div class="stage"><button class="spring" id="spring">Press me</button></div>
    </div>

    <div class="cell"><span class="t">06 · Marquee + duotone</span>
      <div class="thumb"></div>
      <div class="marq"><span>Craft · Motion · Type · Color · &nbsp;Craft · Motion · Type · Color · </span></div>
    </div>
  </div>

  <script>
    // 1 draw: set dash length, animate on loop
    document.querySelectorAll('.draw path').forEach(p=>{
      const len=p.getTotalLength();
      p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
      const run=()=>p.animate([{strokeDashoffset:len},{strokeDashoffset:0}],
        {duration:1600,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'});
      run(); setInterval(run,3200);
    });

    // 3 scramble reveal
    const CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*';
    function scramble(el){
      const final=el.dataset.final; let frame=0;
      const id=setInterval(()=>{
        el.textContent=final.split('').map((c,i)=> i < frame/3 ? c : CH[Math.floor(Math.random()*CH.length)]).join('');
        if(frame/3>=final.length){clearInterval(id);el.textContent=final;} frame++;
      },30);
    }
    const sc=document.querySelector('.scramble');
    scramble(sc); sc.parentElement.parentElement.addEventListener('mouseenter',()=>scramble(sc));

    // 5 spring press
    document.getElementById('spring').addEventListener('click',e=>{
      e.currentTarget.animate([{transform:'scale(1)'},{transform:'scale(0.92)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],
        {duration:420,easing:'cubic-bezier(0.34,1.5,0.64,1)'});
    });
  </script>
</body>
</html>
