  g.appendChild(el("text", {x: cx, y: cy - R - TH / 2 - 58, "text-anchor":"middle", class:"axb",
    style:"font-size:19px"}, `a whole year of sales is this ${(topFrac * 100).toFixed(1)}% of the ring`));
  s.appendChild(g);

  s.appendChild(el("text", {x:cx, y:cy - 8, "text-anchor":"middle", class:"axb",
    style:"font-size:17px;letter-spacing:.08em;text-transform:uppercase"}, spec.totalLabel));
  s.appendChild(el("text", {x:cx, y:cy + 34, "text-anchor":"middle", class:"vlab pop",
    style:"font-size:44px;animation-delay:180ms"}, spec.totalValue));

  // Three columns share the width: ring, legend, stats. At 1660 they all fitted
  // with room to spare; at the narrower camera width the legend text ran into
  // the stats panel. Lay the columns out from measured widths instead of fixed
  // offsets, and stack the stats vertically when a row of them will not fit.
  const est = (s2, fs) => String(s2).length * fs * 0.55;
  const legendW = Math.max(...spec.parts.map(p =>
    28 + Math.max(est(p.name, 20), est(p.lab, 36),
                  est(`${(p.v / spec.total * 100).toFixed(1)}% of the market cap`, 18))));
  const LX = Math.max(cx + R + TH / 2 + 30, cx + R + 130 - Math.max(0, 1660 - W) * 0.5);
  const statsN = (spec.stats || []).length;
  const statsRoom = W - (LX + legendW + 40);
  const statsRow = statsN === 0 || statsRoom >= statsN * 210;

  spec.parts.forEach((p, i) => {
    const y = cy - 74 + i * 104;
    const g = el("g", {class:"fade", style:`animation-delay:${AD(700 + i * 220)}ms`});
    g.appendChild(el("rect", {x: LX, y: y - 26, width: 15, height: 15, rx: 3,
      class: i ? "dn-b-fill" : "dn-a-fill"}));
    g.appendChild(el("text", {x: LX + 28, y: y - 13, class:"axb", style:"font-size:20px"}, p.name));
    g.appendChild(el("text", {x: LX + 28, y: y + 24, class:"vlab", style:"font-size:36px"}, p.lab));
    g.appendChild(el("text", {x: LX + 28, y: y + 50, class:"ax", style:"font-size:18px"},
      `${(p.v / spec.total * 100).toFixed(1)}% of the market cap`));
    s.appendChild(g);
  });

  // The two multiples, in their own panel so they read as a conclusion.
  const stats = spec.stats || [];
  if (stats.length) {
    const divX = statsRow ? W - 452 - 40 : LX + legendW + 26;
    s.appendChild(el("line", {x1: divX, y1: cy - 118, x2: divX, y2: cy + 118,
      stroke:"var(--border)", "stroke-width":2}));
    stats.forEach((st, i) => {
      // A row when there is room; otherwise one above the other, which reads the
      // same and needs a third of the width.
      const x = statsRow ? W - 452 + 104 + i * 224
                         : divX + 30 + (W - divX - 30) / 2;
      const yv = statsRow ? cy - 14 : cy - 74 + i * 118;
      const fs = statsRow ? 62 : 52;
      const g = el("g", {class:"pop", style:`animation-delay:${AD(900 + i * 160)}ms`});
      g.appendChild(el("text", {x, y: yv, "text-anchor":"middle", class:"vlab",
        style:`font-size:${fs}px;fill:var(--s1)`}, st.v));
      g.appendChild(el("text", {x, y: yv + (statsRow ? 40 : 30), "text-anchor":"middle",
        class:"axb", style:"font-size:19px"}, st.l));
      s.appendChild(g);
    });
  }
  return s;
}

/*
   TREEMAP — the balance sheet at a glance, blocks sized by value. Two panels
   (assets vs liabilities+equity), everything green except debt in red, so the
   one thing to worry about is the only thing that is not.
*/
function chartTreemap(spec){
  const W = chartW(), H = spec.height || 500, GAP = 46, PT = 40;
  const s = svgRoot(W, H);
  // A single panel used to be drawn at half width, leaving the right half empty —
  // it was only ever called with two.
  const nPanels = Math.max(1, spec.panels.length);
  const panelW = (W - GAP * (nPanels - 1)) / nPanels, panelH = H - PT;

  // squarified-ish slice-and-dice: alternate split direction by aspect
  function layout(items, x, y, w, h, out) {
    if (!items.length) return;
    if (items.length === 1) { out.push({...items[0], x, y, w, h}); return; }
    const tot = items.reduce((a, b) => a + b.v, 0);
    let half = 0, i = 0;
    while (i < items.length - 1 && half + items[i].v < tot / 2) { half += items[i].v; i++; }
    // A first block already past the halfway mark leaves the left slice empty and
    // recurses on the same list forever. Both slices must shrink.
    if (i === 0) i = 1;
    const a = items.slice(0, i), b = items.slice(i);
    const fa = a.reduce((x2, y2) => x2 + y2.v, 0) / tot;
    if (w >= h) { layout(a, x, y, w * fa, h, out); layout(b, x + w * fa, y, w * (1 - fa), h, out); }
    else        { layout(a, x, y, w, h * fa, out); layout(b, x, y + h * fa, w, h * (1 - fa), out); }
  }

  spec.panels.forEach((pan, pi) => {
    const px = pi * (panelW + GAP);
    s.appendChild(el("text", {x: px, y: 24, class:"axb",
      style:"font-size:20px;letter-spacing:.09em;text-transform:uppercase"}, pan.label));
    const items = [...pan.items].filter(i => i.v > 0).sort((a, b) => b.v - a.v);
    const out = [];
    layout(items, px, PT, panelW, panelH, out);
    out.forEach((r, k) => {
      const g = el("g", {class:"fade", style:`animation-delay:${AD(pi * 120 + k * 45)}ms`});
      g.appendChild(el("rect", {x: r.x + 2, y: r.y + 2, width: Math.max(1, r.w - 4),
        height: Math.max(1, r.h - 4), rx: 5, class: "tm " + (r.cls || "ok")}));
      // A block too small for both lines still gets its value — a blank block is
      // worse than a small label — and every label is clipped to its own block so
      // a narrow one cannot spill over the panel edge.
      const inner = r.w - 36;
      // A narrow block is usually tall, so the name wraps rather than truncating —
      // "Other assets" clipped to "Other…" loses the only thing the block says.
      const wrap = (t, px) => {
        const budget = Math.max(3, Math.floor(inner / (px * 0.53)));
        const lines = [];
        t.split(" ").forEach(word => {
          const last = lines[lines.length - 1];
          if (last && (last + " " + word).length <= budget) lines[lines.length - 1] += " " + word;
          else lines.push(word.length <= budget ? word : word.slice(0, budget - 1) + "…");
        });
        return lines;
      };
      if (r.h > 54 && inner > 46) {
        const nf = r.w > 240 ? 19 : 15, vf = r.w > 240 ? 26 : 19;
        const lines = wrap(r.name, nf);
        lines.forEach((ln, li) => g.appendChild(el("text",
          {x: r.x + 18, y: r.y + 30 + li * (nf + 5), class:"tm-t", style:`font-size:${nf}px`}, ln)));
        g.appendChild(el("text", {x: r.x + 18, y: r.y + 34 + lines.length * (nf + 5),
          class:"tm-v", style:`font-size:${vf}px`}, r.lab));
      } else if (r.h > 26 && inner > 34) {
        g.appendChild(el("text", {x: r.x + 18, y: r.y + r.h / 2 + 6, class:"tm-v",
          style:"font-size:17px"}, r.lab));
      }
      s.appendChild(g);
    });
  });
  return s;
}

/* FAIR-VALUE BAND — where the price sits on an under/fair/over ruler. */
function chartFvBand(spec){
  const W = chartW(), H = spec.height || 430;
  const s = svgRoot(W, H);
  // Five stacked lanes, each with its own room: verdict, bear/bull bracket,
  // current price, the band itself, then the base case underneath.
  const PL = 60, PR = 60, y = 186, bh = 96;
  const fv = spec.fairValue;
  const lo = fv * (1 - spec.band), hi = fv * (1 + spec.band);
  // The scale has to hold the bear/bull bracket too, or it runs off the rail.
  const scLo = Math.min(lo * 0.72, spec.price * 0.9, (spec.rangeLo ?? Infinity) * 0.9);
  const scHi = Math.max(hi * 1.28, spec.price * 1.1, (spec.rangeHi ?? 0) * 1.06);
  const X = v => PL + ((v - scLo) / (scHi - scLo)) * (W - PL - PR);
  // The zones wash in left-to-right before the markers land on them.
  const zone = (a, b, cls, k) => el("rect", {x: X(a), y, width: Math.max(2, X(b) - X(a)),
    height: bh, class: cls + " fade", style: `animation-delay:${AD(k * 120)}ms`});
  const neutral = spec.zoneTone === "neutral";
  s.appendChild(zone(scLo, lo, neutral ? "fv-n-out" : "fv-under", 0));
  s.appendChild(zone(lo, hi, neutral ? "fv-n-mid" : "fv-fair", 1));
  s.appendChild(zone(hi, scHi, neutral ? "fv-n-out" : "fv-over", 2));
  // A single point estimate reads as false precision. The bracket is the range
  // the same model produces across the bear and bull assumption sets.
  if (spec.rangeLo != null && spec.rangeHi != null) {
    const by = y - 112;
    const g = el("g", {class:"fade", style:"animation-delay:520ms"});
    g.appendChild(el("line", {x1:X(spec.rangeLo), y1:by, x2:X(spec.rangeHi), y2:by,
      stroke:"var(--ink)", "stroke-width":2.5}));
    [[spec.rangeLo, spec.rangeLoLab, "end"], [spec.rangeHi, spec.rangeHiLab, "start"]]
      .forEach(([v, lab, anch]) => {
        g.appendChild(el("line", {x1:X(v), y1:by - 11, x2:X(v), y2:by + 11,
          stroke:"var(--ink)", "stroke-width":2.5}));
        // Flip the label inboard when the tick sits at the very end of the rail,
        // or it is drawn off the canvas: bear $3.06 landed at x = -37.
        const room = 14 + lab.length * 9.5;
        const flip = (anch === "end" && X(v) - room < 4) ||
                     (anch === "start" && X(v) + room > W - 4);
        const a = flip ? (anch === "end" ? "start" : "end") : anch;
        // A flipped label sits over the bracket rail itself, which struck
        // "bear $3.06" clean through. Drop it below the rail instead.
        g.appendChild(el("text", {x:X(v) + (a === "end" ? -14 : 14),
          y: by + (flip ? 28 : 6), "text-anchor":a, class:"ax",
          style:"font-size:18px"}, lab));
      });
    s.appendChild(g);
  }

  // Zone labels sit centred in their own zone — but when the price is far outside
  // the band, the "below" and "fair" zones squeeze into a sliver at the left and
  // their two labels print on top of each other (RKLB: price 648% over base).
  // Detect that and fall back to an evenly spaced swatch legend, which cannot
  // collide and keeps all three meanings on screen.
  const pct = (spec.band * 100).toFixed(0);
  const zLab = spec.zoneLabs || [`more than ${pct}% below`,
                                 `within ${pct}% — about right`,
                                 `more than ${pct}% above`];
  const zc = spec.zoneTone === "neutral"
    ? [["fv-tn-out", "fv-n-out"], ["fv-tn-mid", "fv-n-mid"], ["fv-tn-out", "fv-n-out"]]
    : [["fv-t-under", "fv-under"], ["fv-t-fair", "fv-fair"], ["fv-t-over", "fv-over"]];
  const zl = [[(scLo + lo) / 2, zLab[0], zc[0][0], zc[0][1]],
              [fv, zLab[1], zc[1][0], zc[1][1]],
              [(hi + scHi) / 2, zLab[2], zc[2][0], zc[2][1]]];
  const halfW = lab => lab.length * 4.6;
  const fits = zl.every(([v, lab], k) =>
    k === 0 || X(v) - halfW(lab) > X(zl[k-1][0]) + halfW(zl[k-1][1]) + 10);
  if (fits) {
    zl.forEach(([v, lab, cls]) =>
      s.appendChild(el("text", {x: X(v), y: y + bh + 34, "text-anchor":"middle",
        class: "ax " + cls, style:"font-size:17px;font-weight:700"}, lab)));
  } else {
    const ly = y + bh + 30, gap = (W - PL - PR) / 3;
    zl.forEach(([, lab, cls, fill], k) => {
      const lx = PL + gap * k + 26;
      s.appendChild(el("rect", {x: lx - 26, y: ly - 13, width: 17, height: 17, rx: 3,
        class: fill}));
      s.appendChild(el("text", {x: lx, y: ly, "text-anchor":"start",
        class: "ax " + cls, style:"font-size:17px;font-weight:700"}, lab));
    });
  }

  [[spec.price, spec.priceLab, "Current price", -1], [fv, spec.fairLab, spec.fairName, 1]]
    .forEach(([v, lab, name, dir], k) => {
      const x = X(v);
      s.appendChild(el("line", {x1:x, y1:y - 14, x2:x, y2:y + bh + 14,
        stroke:"var(--ink)", "stroke-width":4, class:"fade", style:`animation-delay:${AD(200 + k*150)}ms`}));
      const ty = dir < 0 ? y - 30 : y + bh + 76;
      const g = el("g", {class:"fade", style:`animation-delay:${AD(260 + k*150)}ms`});
      g.appendChild(el("text", {x, y: ty, "text-anchor":"middle", class:"vlab",
        style:"font-size:34px"}, lab));
      // A 34px value needs more than 26px of clearance or its box eats the name.
      g.appendChild(el("text", {x, y: ty + (dir < 0 ? -34 : 32), "text-anchor":"middle",
        class:"axb", style:"font-size:17px"}, name));
      s.appendChild(g);
    });
  if (spec.verdict) s.appendChild(el("text", {x: W / 2, y: 44, "text-anchor":"middle",
    class:"vlab", style:"font-size:30px;fill:var(--s1)"}, spec.verdict));
  return s;
}

/* INSIDER — shares sold against shares bought, by recency bucket. */
function chartInsider(spec){
  const W = chartW(), H = spec.height || 470, MID = W * 0.52, PT = 54;
  const s = svgRoot(W, H);
  const max = Math.max(...spec.rows.map(r => Math.max(r.sold, r.bought))) * 1.05;
  const rowH = (H - PT - 20) / spec.rows.length;
  // Fixed columns: row label, then a right-aligned figure column, then the bars.
  // Hanging the figure off the bar's end put the longest row's label on top of
  // its own category name.
  const VALX = 500, halfW = MID - VALX - 24;
  s.appendChild(el("text", {x: MID - 20, y: 30, "text-anchor":"end", class:"axb",
    style:"font-size:19px;letter-spacing:.1em;text-transform:uppercase;fill:var(--crit)"}, "Shares sold"));
  s.appendChild(el("text", {x: MID + 20, y: 30, class:"axb",
    style:"font-size:19px;letter-spacing:.1em;text-transform:uppercase;fill:var(--good)"}, "Shares bought"));
  s.appendChild(el("line", {x1:MID, y1:PT - 14, x2:MID, y2:H - 16,
    stroke:"var(--border)", "stroke-width":2}));

  spec.rows.forEach((r, i) => {
    const cy = PT + rowH * i + rowH / 2;
    s.appendChild(el("text", {x: 20, y: cy + 4, class:"axb", style:"font-size:23px"}, r.label));
    const wS = (r.sold / max) * halfW;
    const g = el("g", {class:"growX", style:`transform-origin:${MID}px ${cy}px;animation-delay:${AD(i*90)}ms`});
    g.appendChild(el("rect", {x: MID - wS, y: cy - 26, width: Math.max(2, wS), height: 52,
      rx: 4, class:"bar bad"}));
    s.appendChild(g);
    s.appendChild(el("text", {x: VALX, y: cy + 2, "text-anchor":"end", class:"vlab fade",
      style:`animation-delay:${AD(260+i*90)}ms;font-size:21px`}, r.soldLab));
    s.appendChild(el("text", {x: VALX, y: cy + 26, "text-anchor":"end", class:"ax fade",
      style:`animation-delay:${AD(260+i*90)}ms`}, r.sub));
    // the empty side is the finding
    s.appendChild(el("text", {x: MID + 26, y: cy + 6, class:"vlab",
      style:"font-size:23px;fill:var(--muted)"}, r.boughtLab));
  });
  return s;
}

/* PEERS — ranked multiples with an average line and a growth column beside. */
function chartPeers(spec){
  const W = chartW(), H = spec.height || 500, LBL = 250, PR = 300, PT = 62;
  const s = svgRoot(W, H);
  const max = Math.max(...spec.rows.map(r => r.v)) * 1.12;
  const plotW = W - LBL - PR;
  const rowH = (H - PT - 24) / spec.rows.length;
  const X = v => LBL + (v / max) * plotW;

  if (spec.avg != null) {
    s.appendChild(el("rect", {x: X(spec.avg), y: PT - 8, width: W - PR - X(spec.avg),
      height: H - PT - 16, fill:"var(--crit)", opacity:".07"}));
    s.appendChild(el("line", {x1:X(spec.avg), y1:PT - 20, x2:X(spec.avg), y2:H - 24,
      stroke:"var(--warn)", "stroke-width":3}));
    s.appendChild(el("text", {x:X(spec.avg), y:PT - 30, "text-anchor":"middle", class:"vlab",
      style:"font-size:20px;fill:var(--warn)"}, spec.avgLab));
  }
  s.appendChild(el("text", {x: W - PR + 40, y: PT - 30, class:"axb",
    style:"font-size:17px;letter-spacing:.08em;text-transform:uppercase"}, spec.rightHead));

  spec.rows.forEach((r, i) => {
    const cy = PT + rowH * i + rowH / 2;
    const g = el("g", {class:"growX", style:`transform-origin:${LBL}px ${cy}px;animation-delay:${AD(i*80)}ms`});
    g.appendChild(el("rect", {x: LBL, y: cy - 26, width: Math.max(3, X(r.v) - LBL), height: 52,
      rx: 4, class: "bar " + (r.here ? "" : "mut")}));
    s.appendChild(g);
    s.appendChild(el("text", {x: LBL - 22, y: cy + 3, "text-anchor":"end",
      class: r.here ? "vlab" : "axb", style:`font-size:${r.here ? 22 : 20}px`}, r.name));
    s.appendChild(el("text", {x: X(r.v) + 18, y: cy + 6, class:"vlab fade",
      style:`animation-delay:${AD(260+i*80)}ms;font-size:25px${r.here ? ";fill:var(--s1)" : ""}`}, r.lab));
    s.appendChild(el("text", {x: W - PR + 40, y: cy + 6, class: r.here ? "vlab" : "axb",
      style:"font-size:22px"}, r.right));
  });
  return s;
}

/* Radar over N scored dimensions — the whole company as one shape. */
function chartRadar(spec){
  /*
     The plot is square, but the axis LABELS sit outside the ring and read
     outward, so a square viewBox leaves them nowhere to go: at R + 40 the left
     label began 24px from the edge and "The launch business" ran to x = -133,
     painting outside the box entirely (svg{overflow:visible} hides that) and,
     in camera mode, straight across the reserved column. The box is wider than
     the plot so labels have real room, and they wrap rather than run.
  */
  // CX and CY are separate: one shared C shifted the plot DOWN by LP as well as
  // across, which put the bottom label 156px below the box.
  const S = 460, LP = 170, CX = S / 2 + LP, CY = S / 2, R = S * 0.40, max = spec.max || 5;
  const s = svgRoot(S + LP * 2, S);
  const n = spec.axes.length;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
    return [CX + Math.cos(a) * r, CY + Math.sin(a) * r];
  };
  for (let ring = 1; ring <= max; ring++) {
    const d = spec.axes.map((_, i) => pt(i, R * ring / max)).map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + " Z";
    s.appendChild(el("path", {d, fill:"none", stroke:"var(--grid)", "stroke-width":"1"}));
  }
  spec.axes.forEach((_, i) => {
    const p = pt(i, R);
    s.appendChild(el("line", {x1:CX, y1:CY, x2:p[0], y2:p[1], stroke:"var(--grid)", "stroke-width":"1"}));
  });
  const P = spec.axes.map((a, i) => pt(i, R * a.v / max));
  // closed smooth curve through the points — midpoint bezier, wraps around
  let dd = "";
  for (let i = 0; i < P.length; i++) {
    const p0 = P[(i - 1 + P.length) % P.length], p1 = P[i], p2 = P[(i + 1) % P.length];
    const m0 = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
    const m1 = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
    dd += (i ? "" : `M ${m0[0].toFixed(1)} ${m0[1].toFixed(1)} `)
        + `Q ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}, ${m1[0].toFixed(1)} ${m1[1].toFixed(1)} `;
  }
  dd += "Z";
  const blob = el("g", {class:"bloom", style:`transform-origin:${CX}px ${CY}px;animation-delay:120ms`});
  blob.appendChild(el("path", {d:dd, fill:"var(--s1)", "fill-opacity":".22",
    stroke:"var(--s1)", "stroke-width":"2.6"}));
  s.appendChild(blob);
  spec.axes.forEach((a, i) => {
    const p = pt(i, R * a.v / max);
    s.appendChild(el("circle", {cx:p[0], cy:p[1], r:5, fill:"var(--s1)",
      stroke:"var(--bg)", "stroke-width":"2", class:"fade", style:`animation-delay:${AD(240+i*70)}ms`}));
    const l = pt(i, R + 40);
    const anchor = Math.abs(l[0] - CX) < 12 ? "middle" : (l[0] > CX ? "start" : "end");
    // room between this label's anchor and the edge of the box it must stay in
    const room = anchor === "middle" ? S : (anchor === "start" ? S + LP * 2 - l[0] : l[0]);
    const lines = wrapLabel(a.name, 19, Math.max(60, room - 8), 2);
    lines.forEach((ln, li) =>
      s.appendChild(el("text", {x:l[0], y:l[1] + 6 + (li - (lines.length - 1) / 2) * 23,
        "text-anchor":anchor, class:"axb",
        style:"font-size:19px;font-weight:700;fill:var(--ink)"}, ln)));
  });
  return s;
}

/* Where price sits on the analyst target rail. */
function chartTrack(spec){
  const W = chartW(), H = spec.height || 260;
  const s = svgRoot(W, H);
  const PL = 130, PR = 130, y = 150;
  const lo = spec.lo, hi = spec.hi;
  // The scale spanned the analyst range ALONE, so a price below the lowest
  // target drew off the canvas: DVA's rail bled 730px past the left edge and
  // the "now" marker — the single most important mark — vanished entirely.
  // Span everything actually drawn, and let the rail show the range.
  const all = [lo, hi, spec.now, spec.mean].filter(v => v != null && !isNaN(v));
  const rawLo = Math.min(...all), rawHi = Math.max(...all);
  const pad = (rawHi - rawLo) * 0.06 || 1;
  const scLo = rawLo - pad, scHi = rawHi + pad;
  const X = v => PL + ((v - scLo) / (scHi - scLo)) * (W - PL - PR);
  s.appendChild(el("rect", {x:X(lo), y:y-4, width:Math.max(2, X(hi)-X(lo)), height:8, rx:4,
    fill:"var(--grid)"}));
  s.appendChild(el("rect", {x:X(spec.now), y:y-4, width:Math.max(2, X(spec.mean)-X(spec.now)),
    height:8, rx:4, fill:"var(--s1)", opacity:".5", class:"fade"}));
  [{v:lo, lab:spec.loLab, cls:"ax", side:1},
   {v:hi, lab:spec.hiLab, cls:"ax", side:1}].forEach(m => {
    s.appendChild(el("line", {x1:X(m.v), x2:X(m.v), y1:y-13, y2:y+13, stroke:"var(--muted)", "stroke-width":"2"}));
    s.appendChild(el("text", {x:X(m.v), y:y+46, "text-anchor":"middle", class:"ax"}, m.lab));
  });
  // When the price and the mean target are close together their 30px value
  // labels touch — and a narrower chart in camera mode brings them together at
  // gaps that were fine at 1660. Stack the second one above the first instead.
  const marks = [{v:spec.now, lab:spec.nowLab, sub:"now", c:"var(--s1)"},
                 {v:spec.mean, lab:spec.meanLab, sub:"mean target", c:"var(--ink)"}];
  const need = (String(spec.nowLab).length + String(spec.meanLab).length) * 8.5;
  const tight = Math.abs(X(spec.now) - X(spec.mean)) < need;
  marks.forEach((m, k) => {
    const lift = tight && k === 1 ? 62 : 0;
    s.appendChild(el("line", {x1:X(m.v), x2:X(m.v), y1:y-30, y2:y+30, stroke:m.c, "stroke-width":"3.4",
      class:"fade", style:`animation-delay:${AD(200+k*130)}ms`}));
    s.appendChild(el("circle", {cx:X(m.v), cy:y, r:9, fill:m.c, stroke:"var(--bg)", "stroke-width":"2.5",
      class:"fade", style:`animation-delay:${AD(200+k*130)}ms`}));
    s.appendChild(el("text", {x:X(m.v), y:y-46-lift, "text-anchor":"middle", class:"vlab fade",
      style:`animation-delay:${AD(260+k*130)}ms;fill:${m.c};font-size:30px`}, m.lab));
    s.appendChild(el("text", {x:X(m.v), y:y-74-lift, "text-anchor":"middle", class:"ax fade",
      style:`animation-delay:${AD(260+k*130)}ms`}, m.sub));
  });

  // How much the analysts actually agree. A mean with a 3x spread around it is
  // not a consensus, and the spread is arithmetic on the three numbers already
  // drawn — nothing new is asserted.
  if (spec.agreement !== false && spec.mean) {
    const dev = Math.max(Math.abs(hi - spec.mean), Math.abs(spec.mean - lo)) / spec.mean;
    const band = dev > 0.15 ? ["Low agreement", "var(--crit)"]
               : dev > 0.07 ? ["Moderate agreement", "var(--warn)"]
                            : ["High agreement", "var(--good)"];
    s.appendChild(el("text", {x: W / 2, y: y + 92, "text-anchor": "middle", class: "vlab",
      style: `font-size:21px;fill:${band[1]}`}, band[0]));
    s.appendChild(el("text", {x: W / 2, y: y + 118, "text-anchor": "middle", class: "ax"},
      `targets run ${(dev * 100).toFixed(0)}% from the average at the widest`));
  }
  return s;
}

/*
   LOLLIPOP — ranked change, one value per category. The correct form when the job
   is comparing a handful of changes: the position of the dot carries the value and
   the thin stem only leads the eye to it, so four rows of it read in a glance
   where four fat bars read as a wall. Thin marks, one dot per row, direct labels.
*/
function chartLollipop(spec){
  const W = chartW(), H = spec.height || 440, PT = 40, PB = 96, PL = 30, PR = 30;
  const s = svgRoot(W, H);
  const vals = spec.rows.map(r => r.v);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = (hi - lo) * 0.16 || 1;
  const min = lo - (lo < 0 ? pad : 0), max = hi + pad;
  const plotH = H - PT - PB, plotW = W - PL - PR;
  const y = v => PT + plotH - ((v - min) / (max - min)) * plotH;
  const n = spec.rows.length, slot = plotW / n;
  const y0 = y(0);

  s.appendChild(el("line", {x1:PL, x2:W-PR, y1:y0, y2:y0,
    stroke:"var(--ink)", "stroke-width":1.5, opacity:".5"}));

  spec.rows.forEach((r, i) => {
    const cx = PL + slot * i + slot / 2, yv = y(r.v);
    const cls = r.cls ? " " + r.cls : "";
    const g = el("g", {class:"grow",
      style:`transform-origin:${cx}px ${y0}px;animation-delay:${AD(i * 70)}ms`});
    // 3px stem, 11px head — the spec's thin mark with a marker above 8px
    g.appendChild(el("line", {x1:cx, x2:cx, y1:y0, y2:yv,
      class:"stem" + cls, "stroke-width":3}));
    g.appendChild(el("circle", {cx, cy:yv, r:11, class:"dot" + cls,
      stroke:"var(--bg)", "stroke-width":3}));
    s.appendChild(g);
    s.appendChild(el("text", {x:cx, y: r.v < 0 ? yv + 40 : yv - 26, "text-anchor":"middle",
      class:"vlab fade", style:`animation-delay:${AD(300 + i * 70)}ms;font-size:30px`}, r.lab));
    wrapLabel(r.name, 18, slot - 16, 2).forEach((ln, li) =>
      s.appendChild(el("text", {x:cx, y:H - PB + 42 + li * 23, "text-anchor":"middle",
        class:"axb", style:"font-size:18px"}, ln)));
    if (r.sub) s.appendChild(el("text", {x:cx, y:H - PB + (wrapLabel(r.name, 18, slot - 16, 2).length > 1 ? 88 : 66),
      "text-anchor":"middle", class:"ax"}, r.sub));
  });
  return s;
}

/*
   STEP AREA — a running total over dated steps. Change-over-time is a line's job,
   not a bar's: the staircase shows the shape of the accumulation and the filled
   area under it carries the "how much so far". Labels are SELECTIVE — first, last
   and any step flagged `mark` — because a number on every point is noise.
*/
function chartStepArea(spec){
  const W = chartW(), H = spec.height || 440, PT = 56, PB = 92, PL = 70, PR = 70;
  const s = svgRoot(W, H);
  const pts = spec.points;
  const max = Math.max(...pts.map(p => p.v)) * 1.18;
  const plotH = H - PT - PB, plotW = W - PL - PR;
  const X = i => PL + (i / (pts.length - 1)) * plotW;
  const Y = v => PT + plotH - (v / max) * plotH;

  for (let g = 0; g <= 4; g++) {
    const gv = max * g / 4;
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:Y(gv), y2:Y(gv), class:"gridline"}));
  }

  // the staircase itself, and the area beneath it
  let d = `M${X(0)} ${Y(0)}`;
  pts.forEach((p, i) => { d += ` L${X(i)} ${Y(p.v)}`;
    if (i < pts.length - 1) d += ` L${X(i+1)} ${Y(p.v)}`; });
  const area = d + ` L${X(pts.length-1)} ${Y(0)} Z`;
  s.appendChild(el("path", {d: area, fill: areaFill(s, "var(--s1)", .26),
    class:"fade", style:`animation-delay:${AD(200)}ms`}));
  const line = el("path", {d, fill:"none", stroke:"var(--s1)", "stroke-width":3.5,
    "stroke-linejoin":"round", class:"draw"});
  s.appendChild(line);
  requestAnimationFrame(() => { try { const L = line.getTotalLength();
    line.style.setProperty("--len", L); line.style.strokeDasharray = L; } catch(e){} });

  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    const show = i === 0 || last || p.mark;
    if (last) halo(s, X(i), Y(p.v), 12, "var(--crit)", 340 + i * 90);
    s.appendChild(el("circle", {cx:X(i), cy:Y(p.v), r: last ? 12 : 8,
      fill: last ? "var(--crit)" : "var(--s1)", stroke:"var(--bg)", "stroke-width":3,
      class:"fade", style:`animation-delay:${AD(340 + i * 90)}ms`}));
    if (show)
      s.appendChild(el("text", {x:X(i), y:Y(p.v) - 26, "text-anchor":"middle",
        class:"vlab fade", style:`animation-delay:${AD(420 + i * 90)}ms;font-size:${last ? 40 : 27}px`
        + (last ? ";fill:var(--crit)" : "")}, p.lab));
    s.appendChild(el("text", {x:X(i), y:H - PB + 40, "text-anchor":"middle", class:"axb",
      style:"font-size:18px"}, p.x));
    if (p.x2) s.appendChild(el("text", {x:X(i), y:H - PB + 64, "text-anchor":"middle",
      class:"ax", style:"font-size:15px"}, p.x2));
  });
  return s;
}

/*
   CONNECTED SCATTER — two measures moving against each other over time, plotted
   as a trajectory rather than as two panels of bars. "Twice the customers, each
   worth a fifth less" is ONE shape here: the path walks right and falls. Two bar
   panels make the viewer hold one chart in their head while reading the other,
   and a dual-axis line would be the single worst option available.
*/
function chartScatter(spec){
  const W = chartW(), H = spec.height || 500, PT = 58, PB = 96, PL = 124, PR = 210;
  const s = svgRoot(W, H);
  const xs = spec.points.map(p => p.x), ys = spec.points.map(p => p.y);
  const xlo = Math.min(...xs), xhi = Math.max(...xs);
  const ylo = Math.min(...ys), yhi = Math.max(...ys);
  const xp = (xhi - xlo) * 0.22 || 1, yp = (yhi - ylo) * 0.34 || 1;
  // The y scale spans [min, max]. It used to clamp at zero, which drew any
  // negative point below the plot — a margin trajectory that starts in losses
  // was invisible. A chart's scale spans every mark it draws.
  const x0 = xlo - xp, x1 = xhi + xp;
  const y0 = ylo >= 0 ? Math.max(0, ylo - yp) : ylo - yp, y1 = yhi + yp;
  const plotW = W - PL - PR, plotH = H - PT - PB;
  const X = v => PL + ((v - x0) / (x1 - x0)) * plotW;
  const Y = v => PT + plotH - ((v - y0) / (y1 - y0)) * plotH;

  for (let g = 0; g <= 3; g++) {
    const gv = y0 + (y1 - y0) * g / 3;
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:Y(gv), y2:Y(gv), class:"gridline"}));
    s.appendChild(el("text", {x:PL-18, y:Y(gv)+7, "text-anchor":"end", class:"ax"},
      spec.fmt2 ? spec.fmt2(gv) : String(Math.round(gv))));
  }
  if (y0 < 0 && y1 > 0)
    s.appendChild(el("line", {x1:PL, x2:W-PR, y1:Y(0), y2:Y(0),
      stroke:"var(--ink)", "stroke-width":1.5, opacity:".5"}));
  // axis titles — the whole chart is unreadable without them
  s.appendChild(el("text", {x:PL, y:H-PB+62, class:"axb", style:"font-size:19px"}, spec.xTitle));
  s.appendChild(el("text", {x:PL, y:PT-26, class:"axb", style:"font-size:19px"},
    "↑ " + spec.yTitle));

  const d = spec.points.map((p, i) => (i ? "L" : "M") + X(p.x) + " " + Y(p.y)).join(" ");
  const path = el("path", {d, fill:"none", stroke:"var(--s1)", "stroke-width":3.5,
    "stroke-linecap":"round", class:"draw"});
  s.appendChild(path);
  requestAnimationFrame(() => { try { const L = path.getTotalLength();
    path.style.setProperty("--len", L); path.style.strokeDasharray = L; } catch(e){} });

  // an arrowhead on the last leg, so the direction of travel is unmistakable
  const n = spec.points.length;
  if (n > 1) {
    const a = spec.points[n-2], b = spec.points[n-1];
    const ang = Math.atan2(Y(b.y) - Y(a.y), X(b.x) - X(a.x));
    const L = 22, sp = 0.42;
    const tipX = X(b.x) - Math.cos(ang) * 16, tipY = Y(b.y) - Math.sin(ang) * 16;
    s.appendChild(el("path", {
      d: `M${tipX} ${tipY} L${tipX - Math.cos(ang - sp) * L} ${tipY - Math.sin(ang - sp) * L} `
       + `L${tipX - Math.cos(ang + sp) * L} ${tipY - Math.sin(ang + sp) * L} Z`,
      fill:"var(--s1)", class:"fade", style:`animation-delay:${AD(700)}ms`}));
  }

  spec.points.forEach((p, i) => {
    const last = i === n - 1;
    // A fixed 130ms stagger overran the 3s envelope at 8 points (NBIS's eight
    // quarters ended at 4.15s); 60ms keeps a long trajectory inside it.
    if (last) halo(s, X(p.x), Y(p.y), 14, "var(--s1)", 280 + i * 60);
    s.appendChild(el("circle", {cx:X(p.x), cy:Y(p.y), r: last ? 14 : 10,
      fill: last ? "var(--s1)" : "var(--bg)", stroke:"var(--s1)", "stroke-width":3.5,
      class:"fade", style:`animation-delay:${AD(280 + i * 60)}ms`}));
    const g = el("g", {class:"fade", style:`animation-delay:${AD(340 + i * 60)}ms`});
    // labels go right of the point, except the last which would run off the plot
    const rightOf = !last || X(p.x) < W - PR - 40;
    g.appendChild(el("text", {x:X(p.x) + (rightOf ? 26 : -26), y:Y(p.y) - 6,
      "text-anchor": rightOf ? "start" : "end", class:"axb", style:"font-size:20px"}, p.lab));
    if (p.sub) g.appendChild(el("text", {x:X(p.x) + (rightOf ? 26 : -26), y:Y(p.y) + 22,
      "text-anchor": rightOf ? "start" : "end", class:"vlab",
      style:`font-size:${last ? 32 : 25}px`}, p.sub));
    s.appendChild(g);
  });
  return s;
}

const CHARTS = {bars:chartBars, grouped:chartGrouped, line:chartLine,
                bridge:chartBridge, hbars:chartHBars, range:chartRange,
                stackedh:chartStackedH, indexed:chartIndexed,
                funded:chartFunded, radar:chartRadar, track:chartTrack,
                smallmult:chartSmallMult, sankey:chartSankey, gauge:chartGauge,
                dumbbell:chartDumbbell, slope:chartSlope, distribution:chartDistribution,
                forecast:chartForecast, donut:chartDonut, treemap:chartTreemap,
                fvband:chartFvBand, insider:chartInsider, peers:chartPeers,
                lollipop:chartLollipop, steparea:chartStepArea, scatter:chartScatter};

/* ============================================================
   Fair-value model — runs live so the assumptions are his, on camera
   ============================================================ */
const FV = DECK.fairValue;
let liveCases = JSON.parse(JSON.stringify(FV.cases));
let selAsm = 0;
const ASM_KEYS = [
  {k:"revGrowth",   n:"Revenue growth", suf:"%",  step:0.5},
  {k:"opMargin",    n:"Operating margin", suf:"%", step:0.5},
  {k:"exitPE",      n:"Exit P/E",      suf:"x",  step:0.5},
  {k:"shareChange", n:"Shares / yr",   suf:"%",  step:0.5}
];

function runCase(c){
  const K = FV.constants, H = FV.horizonYears;
  const growth = Math.pow(1 + c.revGrowth/100, H);
  const rev    = K.startRevenueTTM * growth;
  const ebit   = rev * c.opMargin/100;
  const interest = K.netDebt * K.interestRate/100;
  const pretax = ebit - interest;
  const net    = pretax * (1 - K.taxRate/100);
  const nci    = K.nciAnnualRunRate * growth;      // minority interests scale with the business
  const attrib = net - nci;
  const shares = DECK.sharesOutstanding * Math.pow(1 + c.shareChange/100, H);
  const eps    = attrib / shares;
  const price5 = eps * c.exitPE;
  const fv     = price5 / Math.pow(1 + FV.requiredReturn/100, H);
  const cagr   = (Math.pow(price5 / DECK.price, 1/H) - 1) * 100;
  return {rev, ebit, eps, price5, fv, cagr, shares};
}

function renderCalc(host){
  const c = liveCases.base;
  const asm = host.querySelector(".asm");
  asm.innerHTML = ASM_KEYS.map((a, i) =>
    `<div class="a${i===selAsm?" sel":""}"><div class="an">${a.n}</div>
     <div class="av num">${a.k==="shareChange"?(c[a.k]>0?"+":""):""}${f1(c[a.k])}${a.suf}</div></div>`).join("");
  const cs = host.querySelector(".cases");
  cs.innerHTML = ["bear","base","bull"].map(k => {
    const r = runCase(liveCases[k]);
    return `<div class="cs${k==="base"?" base":""}"><div class="cn">${k}</div>
      <div class="cfv num">${usd0(r.fv)}</div>
      <div class="cr num">${usd0(r.price5)} in ${FV.horizonYears}y · <b style="color:${r.cagr>=0?"var(--good)":"var(--crit)"}">${pct(r.cagr)}/yr</b></div></div>`;
  }).join("");
}

/* ============================================================
   Slide renderers
   ============================================================ */
function slideChrome(sl, idx){
  const parts = [];
  if (sl.type !== "title") {
    // The ticker + company ride the top of EVERY slide, so a viewer landing
    // mid-video always knows which stock is on screen. The footer stamp alone
    // was not enough — it is the least-read corner of the frame.
    parts.push(`<div class="kicker"><span class="no">${String(idx).padStart(2,"0")}</span>
      <span>${esc(sl.kicker || "")}</span>
      ${sl.src ? `<span class="src">${esc(sl.src)}</span>` : ""}
      <span class="ident"${sl.src ? "" : ' style="margin-left:auto"'}><b>${esc(DECK.symbol)}</b> · ${esc(DECK.company)}</span></div>`);
    if (sl.head) parts.push(`<h1 class="head${sl.head.length > 46 ? " sm" : ""}">${sl.head}</h1>`);
    if (sl.sub)  parts.push(`<div class="sub">${sl.sub}</div>`);
  }
  return parts.join("");
}

function render(sl, idx, total){
  const d = document.createElement("div");
  d.className = "slide" + (sl.type === "title" ? " title" : "");
  let inner = slideChrome(sl, idx);

  if (sl.type === "title") {
    inner = `<div class="tk">${esc(sl.kicker)}</div>
      <h1>${esc(sl.company)}</h1>
      <div class="ident"><span>${esc(sl.ticker)}</span><span>·</span><span>${esc(sl.exchange)}</span><span>·</span><span>${esc(sl.sector)}</span></div>
      <div class="pxrow"><span class="px num">${money(sl.price)}</span>
        <span class="chg num ${sl.changePct < 0 ? "dn" : "up"}">${pct(sl.changePct, 2)} today</span></div>
      <div class="hook">${sl.hook}</div>
      ${sl.chips ? `<div class="chips"><span class="cl">Read the source</span>` +
        sl.chips.map(c => `<span class="ch"><b>${esc(c.form)}</b><span>${esc(c.when)}</span></span>`).join("") +
        `</div>` : ""}`;
  }
  else if (sl.type === "mega") {
    inner += `<div class="body"><div class="mega">
      <div class="v ${sl.tone || ""} num">${sl.value}</div>
      <div class="cap">${sl.caption}</div></div>${sl.extra ? sl.extra : ""}</div>`;
  }
  else if (sl.type === "tiles") {
    const cols = sl.cols || Math.min(4, sl.tiles.length);
    inner += `<div class="body"><div class="tiles" style="grid-template-columns:repeat(${cols},1fr)">` +
      sl.tiles.map(t => `<div class="tile ${t.tone||""}${t.hero?" hero":""}">
        <div class="tv${t.small?" sm":""} num">${t.v}</div>
        <div class="tl">${t.l}</div>${t.n?`<div class="tn">${t.n}</div>`:""}</div>`).join("") +
      `</div></div>`;
  }
  else if (sl.type === "quote") {
    inner += `<div class="body"><div class="quote"><p>“${sl.quote}”</p>
      <div class="attr">${esc(sl.attr)}</div></div>${sl.extra||""}</div>`;
  }
  else if (sl.type === "chart") {
    // `extra` lets a chart slide carry a compact tile row under the visual —
    // the NBIS close puts its four-chip recap beneath the fair-value ruler.
    // Centered body (not .top): top-aligned charts left a dead band between
    // the visual and the punch line on every short chart.
    inner += `<div class="body"><div class="chartwrap" data-chart="${idx}"></div>
      ${sl.legend ? `<div class="legend">${sl.legend.map(g=>`<span><i style="background:${g.c}"></i>${esc(g.t)}</span>`).join("")}</div>` : ""}
      ${sl.extra ? sl.extra : ""}</div>`;
  }
  else if (sl.type === "snapshot") {
    inner += `<div class="body"><div class="snap">
      <div class="snap-radar" data-radar="${idx}"></div>
      <div class="rows">` + sl.rows.map((r, ri) => `<div class="row"
        style="animation-delay:${AD(260 + ri * 90)}ms">
        <div class="rn">${esc(r.name)}</div>
        <div class="pips">${[1,2,3,4,5].map(i =>
          `<span class="pip${i <= r.score ? " on" + (r.tone ? " " + r.tone : "") : ""}"
           style="animation-delay:${AD(380 + ri * 90 + i * 70)}ms"></span>`).join("")}</div>
        <div class="rf">${r.fact}</div></div>`).join("") + `</div></div></div>`;
  }
  else if (sl.type === "findings") {
    inner += `<div class="body"><div class="finds">` + sl.items.map((f, i) =>
      f.stat
        ? `<div class="find hasstat"><div><div class="fno num">Finding ${String(i + 1).padStart(2, "0")}</div>
           <div class="fstat num">${esc(f.stat)}</div></div>
           <div><div class="fc">${f.claim}</div>
           <div class="fw"><b>Buried in</b>${esc(f.where)}</div></div></div>`
        : `<div class="find"><div class="fn num">${String(i + 1).padStart(2, "0")}</div>
           <div><div class="fc">${f.claim}</div>
           <div class="fw"><b>Buried in</b>${esc(f.where)}</div></div></div>`).join("") +
      `</div></div>`;
  }
  else if (sl.type === "twocol") {
    inner += `<div class="body"><div class="ww">
      <div class="wcol good"><h4>${esc(sl.leftHead)}</h4><ul>` +
      sl.left.map(x => `<li><span class="ic">✓</span><span>${x}</span></li>`).join("") +
      `</ul></div>
      <div class="wcol bad"><h4>${esc(sl.rightHead)}</h4><ul>` +
      sl.right.map(x => `<li><span class="ic">✕</span><span>${x}</span></li>`).join("") +
      `</ul></div></div></div>`;
  }
  else if (sl.type === "verdict") {
    inner += `<div class="body top" style="gap:16px">
      ${sl.reasons ? `<div class="whylist">` + sl.reasons.map(r => `<p>${r}</p>`).join("") + `</div>` : ""}
      <div class="callrow">
        <div class="callbox"><div class="cl">My call</div><div class="cv">${esc(sl.call)}</div>
          <div class="cd">${esc(sl.callLine)}</div></div>
        <div class="calc"><h4>Fair value — my assumptions, live</h4>
          <div class="asm"></div><div class="cases"></div>
          <div class="hintline">↑↓ change · ⇥ next assumption · these are assumptions, not facts</div>
        </div>
      </div></div>`;
  }
  else if (sl.type === "reasons") {
    inner += `<div class="body"><div class="whylist">` +
      sl.reasons.map(r => `<p>${r}</p>`).join("") + `</div></div>`;
  }

  if (sl.punch) inner += `<div class="punch"><p>${sl.punch}</p></div>`;
  inner += `<div class="footer"><span class="mark">NIKRAYANI <span>TERMINAL</span></span>
    <span class="stamp">${esc(DECK.stamp)}</span>
    <span class="pg num">${idx} / ${total}</span></div>`;

  d.innerHTML = inner;

  mountCharts(d, sl, idx);
  if (sl.type === "verdict") renderCalc(d);
  return d;
}

/*
   Chart mounting, split out of render() so it can be redone. Charts are sized at
   BUILD time from chartW(), so toggling camera mode at runtime has to rebuild
   them — otherwise the column is reserved but every chart is still 1660 wide and
   overflows into it.
*/
function mountCharts(d, sl, idx){
  if (sl.type === "chart" && sl.chart) {
    const host = d.querySelector(".chartwrap");
    host.innerHTML = "";
    try {
      const fn = CHARTS[sl.chart.kind];
      if (!fn) throw new Error("unknown chart kind: " + sl.chart.kind);
      // Charts that print their own values get a named formatter, never a
      // function passed across the payload boundary.
      sl.chart.fmt2 = FMT[sl.chart.fmtKind] || FMT.usdM;
      host.appendChild(fn(sl.chart));
    } catch (err) {
      // Renders loudly rather than silently blanking the deck. A chart that
      // throws used to kill every later slide in the same map().
      host.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
        height:100%;border:2px dashed var(--crit);border-radius:12px;color:var(--crit);
        font-size:22px;padding:30px;text-align:center">
        CHART FAILED TO RENDER — ${esc(sl.chart.kind)}<br>
        <span style="font-size:16px;color:var(--muted)">${esc(err.message)}</span></div>`;
      console.error("[deck] chart failed on slide", idx, err);
    }
  }
  if (sl.type === "snapshot") {
    const rad = d.querySelector("[data-radar]");
    rad.innerHTML = "";
    rad.appendChild(chartRadar({axes: sl.rows.map(r => ({name: r.name, v: r.score}))}));
  }
}

/* ============================================================
   Deck controller
   ============================================================ */
const stage = document.getElementById("stage");
const slides = DECK.slides.map((sl, i) => render(sl, i + 1, DECK.slides.length));
slides.forEach(s => stage.appendChild(s));

/*
   On-screen prev / next / theme controls. Built once, appended to #stage
   (not the page body) so they live in the same 1920x1080 coordinate space as
   the footer and never need separate alignment logic — see #navbtns in <style>
   for why viewport-fixed positioning was rejected. Persists across show().
*/
const navBtns = document.createElement("div");
navBtns.id = "navbtns";
navBtns.innerHTML =
  `<button id="navPrev" title="Previous slide (←)" aria-label="Previous slide">↑</button>` +
  `<button id="navTheme" title="Toggle theme (T)" aria-label="Toggle theme">☾</button>` +
  `<button id="navNext" title="Next slide (→)" aria-label="Next slide">↓</button>`;
stage.appendChild(navBtns);
document.getElementById("navPrev").addEventListener("click", () => show(cur - 1));
document.getElementById("navNext").addEventListener("click", () => show(cur + 1));
document.getElementById("navTheme").addEventListener("click", () =>
  setTheme(document.documentElement.getAttribute("data-theme") === "cream" ? "dark" : "cream"));

/*
   THE LAYOUT AUDIT LIVES IN THE DECK, NOT IN A CONSOLE PASTE.

   Every layout bug this deck has shipped was found by hand-pasting a geometry
   sweep into devtools — which means it ships the moment anyone forgets. So the
   sweep is here, it runs on every load, and it prints one line.

   Cheap checks run always. The full geometry pass needs each slide activated in
   turn (the `.slide.on` gate means an inactive slide reports no animation and an
   unlaid-out chart), so it runs on `?audit=1` or on demand via deckAudit().
*/
const KNOWN_ANIM = new Set(["grow","growX","draw","fade","sweep","pop","bloom","pipin","rowin",
                            "maskrise"]);

function deckAudit(){
  const issues = [];
  const wasOn = slides.findIndex(s => s.classList.contains("on"));
  slides.forEach((sl, i) => {
    slides.forEach(s => s.classList.remove("on"));
    sl.classList.add("on");
    const d = DECK.slides[i];
    const nm = `${i + 1} ${d.chart ? d.chart.kind : d.type}`;
    const host = sl.querySelector("[data-chart]");
    if (host && !host.querySelector("svg")) issues.push(`${nm}: DEAD CHART`);

    // A key the renderer does not read prints the literal word "undefined" on
    // camera. Cheap to check, and it caught it on the very first slide.
    {
      const junk = /\b(undefined|NaN|\[object Object\])\b/;
      for (const n of sl.querySelectorAll("*")) {
        if (n.children.length) continue;
        const s = (n.textContent || "").trim();
        if (s && junk.test(s))
          issues.push(`${nm}: renders the literal text "${s.slice(0, 30)}"`);
      }
    }

    // Nothing may enter the reserved camera column. This is the whole promise of
    // ?cam= — and it was already being broken: the footer is absolutely
    // positioned at left:96px, so the slug printed straight across the column
    // while the audit reported CLEAN.
    if (camPx()) {
      const colL = CAM === "left" ? 0 : 1920 - camPx();
      const colR = CAM === "left" ? camPx() : 1920;
      const sr = document.getElementById("stage").getBoundingClientRect();
      const sc = sr.width / 1920 || 1;
      const toStage = r => ({l: (r.left - sr.left) / sc, r: (r.right - sr.left) / sc});
      for (const el of sl.querySelectorAll("*")) {
        if (el.children.length && el.tagName !== "svg") continue;
        const hasInk = el.tagName === "svg" || (el.textContent || "").trim();
        if (!hasInk) continue;
        const b = toStage(el.getBoundingClientRect());
        if (b.r < colL + 1 || b.l > colR - 1) continue;          // clear of it
        const over = Math.min(b.r, colR) - Math.max(b.l, colL);
        if (over > 1.5)
          issues.push(`${nm}: "${(el.textContent || el.tagName).trim().slice(0, 24)}" `
                      + `runs ${over.toFixed(0)}px into the reserved camera column`);
      }
    }

    // EVERY svg on the slide, not just the one in a [data-chart] host. The
    // snapshot slide renders its radar into .snap-radar, so it escaped the
    // geometry checks completely — and it was drawing 133px outside its own box.
    for (const svg of sl.querySelectorAll("svg")) {
      const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
      let bb = null;
      try { bb = svg.getBBox(); } catch (e) { /* detached or empty */ }
      if (bb && vb.length === 4) {
        // Measure the CONTENT against the viewBox. Measuring the <svg> element
        // box is useless — it is in bounds by definition, which is how a bridge
        // drawing to 2587 inside a 500-high box passed unnoticed.
        // All FOUR edges. This checked only bottom and right, so a bracket label
        // that ran to x = -37 — clipped clean off the left of the rail — passed.
        if (bb.y + bb.height > vb[3] + 40)
          issues.push(`${nm}: chart draws ${(bb.y + bb.height - vb[3]).toFixed(0)}px below its box`);
        if (bb.x + bb.width > vb[2] + 60)
          issues.push(`${nm}: chart draws ${(bb.x + bb.width - vb[2]).toFixed(0)}px past its right edge`);
        if (bb.y < vb[1] - 40)
          issues.push(`${nm}: chart draws ${(vb[1] - bb.y).toFixed(0)}px above its box`);
        if (bb.x < vb[0] - 8)
          issues.push(`${nm}: chart draws ${(vb[0] - bb.x).toFixed(0)}px past its left edge`);
        const punch = sl.querySelector(".punch");
        if (punch) {
          const hb = svg.getBoundingClientRect(), wb = punch.getBoundingClientRect();
          const sc = hb.width / vb[2], contentBottom = hb.top + (bb.y + bb.height) * sc;
          if (contentBottom > wb.top + 2)
            issues.push(`${nm}: chart overlaps the punch line by ${(contentBottom - wb.top).toFixed(0)}px`);
        }
      }
      // Text drawn ACROSS a stroked line. Text-vs-text could not see this: a
      // bracket label flipped inboard printed on top of its own rail, so the
      // value read as struck through. Only near-horizontal lines matter — a
      // vertical tick passing beside a centred label is by design.
      {
        const inkOf = n => {
          const fs = parseFloat(getComputedStyle(n).fontSize) || 16;
          const yb = parseFloat(n.getAttribute("y"));
          return isNaN(yb) ? null : {top: yb - fs * 0.75, bot: yb + fs * 0.22, fs};
        };
        const lines = [...svg.querySelectorAll("line")].map(n => {
          const g = k => parseFloat(n.getAttribute(k));
          return {y1:g("y1"), y2:g("y2"), x1:Math.min(g("x1"),g("x2")),
                  x2:Math.max(g("x1"),g("x2")), cls: n.getAttribute("class"),
                  w: parseFloat(n.getAttribute("stroke-width")) ||
                     parseFloat(getComputedStyle(n).strokeWidth) || 1};
        }).filter(L => !isNaN(L.y1) && Math.abs(L.y1 - L.y2) <= 2 && L.x2 - L.x1 > 30
                       // A recessive 1px gridline is DESIGNED to pass behind a
                       // label — it grazed a "$" descender and read as a fault.
                       // Only a prominent rule can strike text through.
                       && L.w >= 2 && !/grid|zero/.test(L.cls || ""));
        for (const n of svg.querySelectorAll("text")) {
          const ink = inkOf(n); if (!ink) continue;
          const bb = n.getBBox(); if (!bb.width) continue;
          for (const L of lines) {
            const half = Math.max(1.5, L.w / 2);
            if (L.y1 + half > ink.top && L.y1 - half < ink.bot &&
                bb.x < L.x2 - 4 && bb.x + bb.width > L.x1 + 4) {
              issues.push(`${nm}: "${n.textContent.slice(0,22)}" is struck through by a line`);
              break;
            }
          }
        }
      }
      // Text running into text. Glyph boxes are the wrong yardstick: a 44px value
      // stacked cleanly above its 17px caption has a box tall enough to swallow
      // the caption whole, while the ink never touches. Compare BASELINES — two
      // lines collide only if their baselines are closer than the taller line's
      // height and they also overlap horizontally.
      const vbY = vb.length === 4 ? vb[1] : 0;
      const hostRect = svg.getBoundingClientRect();
      const scale = vb.length === 4 ? hostRect.width / vb[2] : 1;
      const T = [...svg.querySelectorAll("text")]
        .map(n => {
          const r = n.getBoundingClientRect();
          const yAttr = parseFloat(n.getAttribute("y"));
          const fs = parseFloat(getComputedStyle(n).fontSize) || 16;
          return {
            n, r, fs,
            base: Number.isFinite(yAttr) ? hostRect.top + (yAttr - vbY) * scale
                                         : r.bottom - r.height * 0.21,
          };
        })
        .filter(o => o.r.width > 0 && o.n.textContent.trim());
      // Ink, not boxes: a line of text occupies roughly [baseline - 0.75em,
      // baseline + 0.22em]. A 110px numeral's box reaches far above its ink and
      // swallows the caption beneath it; its ink does not.
      const ink = o => ({ top: o.base - 0.75 * o.fs * scale,
                          bot: o.base + 0.22 * o.fs * scale });
      for (let a = 0; a < T.length; a++) for (let b = a + 1; b < T.length; b++) {
        const A = T[a], B = T[b];
        const ox = Math.min(A.r.right, B.r.right) - Math.max(A.r.left, B.r.left);
        if (ox <= 8) continue;
        const ia = ink(A), ib = ink(B);
        const oy = Math.min(ia.bot, ib.bot) - Math.max(ia.top, ib.top);
        if (oy > 2)
          issues.push(`${nm}: "${A.n.textContent.trim().slice(0, 18)}" collides with `
                    + `"${B.n.textContent.trim().slice(0, 18)}"`);
      }
    }

    sl.querySelectorAll("*").forEach(el => {
      const cs = getComputedStyle(el);
      const an = cs.animationName;
      if (an !== "none") {
        an.split(",").map(x => x.trim()).forEach(x => {
          if (!KNOWN_ANIM.has(x)) issues.push(`${nm}: unknown animation "${x}"`);
        });
        if (cs.animationFillMode !== "both") issues.push(`${nm}: animation fill is ${cs.animationFillMode}, not both`);
        if ((parseFloat(cs.animationDuration) || 0) === 0) issues.push(`${nm}: zero-duration animation`);
      }
      const fs = parseFloat(cs.fontSize) || 99;
      if (fs < 15 && el.textContent.trim() && !el.children.length
          && !el.closest("#notes,#hud,#grid,.footer"))
        issues.push(`${nm}: ${fs}px text on camera`);
    });
  });
  slides.forEach(s => s.classList.remove("on"));
  slides[wasOn < 0 ? 0 : wasOn].classList.add("on");

  const st = getComputedStyle(stage);
  if (!CAM && /matrix\((?:[\d.]+, 0, 0, [\d.]+), ([-\d.]+), ([-\d.]+)\)/.test(st.transform)) {
    const m = st.transform.match(/matrix\([\d.]+, 0, 0, [\d.]+, ([-\d.]+), ([-\d.]+)\)/);
    if (m && (Math.abs(+m[1]) > 0.5 || Math.abs(+m[2]) > 0.5))
      issues.push(`stage: translated by ${m[1]},${m[2]} with no ?cam= — the deck is off-centre`);
  }
  return [...new Set(issues)];
}
window.deckAudit = deckAudit;
// The script is an IIFE, so camera state is otherwise unreachable from devtools
// or a test harness — and it needs checking in both layouts.
window.deckCam = () => ({mode: CAM, camw: Math.round(CAMW * 100), reservedPx: camPx(),
                         numbersShown: camGuideOn});

(function bootCheck(){
  const dead = [];
  slides.forEach((d, i) => {
    const host = d.querySelector("[data-chart]");
    if (host && !host.querySelector("svg")) dead.push(`${i + 1} (${DECK.slides[i].chart.kind})`);
  });
  if (dead.length) {
    console.log(`[deck] SELF-CHECK FAILED — no chart on slide(s): ${dead.join(", ")}`);
    return;
  }
  if (new URLSearchParams(location.search).has("audit")) {
    // Wait a frame so layout and fonts have settled before measuring.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const issues = deckAudit();
      console.log(issues.length
        ? `[deck] AUDIT — ${issues.length} issue(s):\n  ` + issues.join("\n  ")
        : `[deck] AUDIT CLEAN — ${slides.length} slides, no layout, animation or text faults`);
    }));
  } else {
    console.log(`[deck] self-check ok — ${slides.length} slides, every chart rendered `
              + `· add ?audit=1 for the full layout audit`);
  }
})();

let cur = 0, notesOn = false, hudOn = false, t0 = null, tick = null;


function fit(){
  const W = window.innerWidth, H = window.innerHeight;

  // No ?cam= — behave exactly as before: the body flex-centres the stage and all
  // this does is scale it. Adding a translate on top of that centring shifted the
  // whole deck sideways and cropped it.
  if (!CAM) {
    stage.style.transformOrigin = "center center";
    stage.style.transform = `scale(${Math.min(W / 1920, H / 1080)})`;
    document.body.classList.remove("camzone");
    // Redraw (i.e. remove) the frame too: returning before this left the camera
    // slot painted on the slide after camera mode had been switched off.
    drawCamGuide();
    return;
  }

  // Camera mode: the stage still fills the frame and still scales from its
  // centre — the column is reserved INSIDE the canvas with padding. That keeps
  // the deck 1:1 in a 1080p recording and leaves no translate to double-apply.
  document.body.classList.add("camzone");
  const px = camPx();
  stage.style.setProperty("--cam-l", (CAM === "left"  ? 96 + px : 96) + "px");
  stage.style.setProperty("--cam-r", (CAM === "right" ? 96 + px : 96) + "px");
  stage.style.setProperty("--cam-b",
    (CAM === "bottom" ? 92 + Math.round(1080 * CAMW) : 92) + "px");
  stage.style.transformOrigin = "center center";
  stage.style.transform = `scale(${Math.min(W / 1920, H / 1080)})`;
  drawCamGuide();
}
window.addEventListener("resize", fit); fit();

/*
   The alignment guide. Press C in camera mode: it draws the reserved column and
   a 3:4 portrait bubble centred in it, and prints both boxes in RECORDING
   pixels — so the camera source can be positioned by typing numbers into OBS
   rather than dragging it and hoping. Off by default; it must never be up while
   recording, so it is also forced off when the deck goes fullscreen-clean.
*/
function camBubbleBox(){
  const px = camPx();
  if (!px) return null;
  const M = 44;                                   // breathing room inside the column
  const w = px - M * 2;
  const h = Math.min(1080 - M * 2, Math.round(w * 4 / 3));   // 3:4 portrait
  return {x: (CAM === "right" ? 1920 - px : 0) + M, y: Math.round((1080 - h) / 2),
          w, h, colX: CAM === "right" ? 1920 - px : 0, colW: px};
}

function drawCamGuide(){
  let g = document.getElementById("camguide");
  const box = camBubbleBox();
  if (!box) { if (g) g.remove(); return; }
  if (!g) {
    g = document.createElement("div");
    g.id = "camguide";
    document.getElementById("stage").appendChild(g);
  }
  // The FRAME is part of the slide and stays up: the camera sits inside it, so
  // it has to look designed, carry no text, and be there in the recording.
  // The MEASUREMENTS are a setup aid and must never be on camera — C toggles
  // those alone.
  g.innerHTML =
    `<div class="cg-box" style="left:${box.x}px;top:${box.y}px;` +
    `width:${box.w}px;height:${box.h}px"></div>` +
    (camGuideOn
      ? `<div class="cg-col" style="left:${box.colX}px;width:${box.colW}px"></div>` +
        `<div class="cg-lab" style="left:${box.x}px;top:${box.y + box.h + 16}px;` +
        `width:${box.w}px">` +
          `<b>put the camera here</b> ${box.w} &times; ${box.h} at ${box.x}, ${box.y}` +
          `<span>reserved column ${box.colW}px &middot; ` +
          `${(CAMW * 100).toFixed(0)}% &middot; C hides these numbers</span>` +
        `</div>`
      : "");
}

/*
   Count-up numerals: big money/percent tiles tally from zero on slide entry,
   easing out over ~850ms. The LAST frame always writes the exact original
   string, so the resting deck is byte-identical to the build — the animation
   can never leave a drifted or misformatted figure on screen. Skipped under
   prefers-reduced-motion; only runs from show(), so the in-deck audit (which
   toggles .on directly) always measures the final text.
*/
const CU_RE = /^([+\-−]?[^0-9]*)([\d,]+)(\.\d+)?([^0-9]*)$/;
function countUps(slideEl){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  slideEl.querySelectorAll(".mega .v, .tile .tv, .find .fstat").forEach(el => {
    const fin = el.dataset.cuFinal || (el.dataset.cuFinal = el.textContent);
    const m = fin.match(CU_RE);
    if (!m) return;                               // "none", "+ interest" — leave alone
    const num = parseFloat((m[2] + (m[3] || "")).replace(/,/g, ""));
    if (!isFinite(num)) return;
    const dec = m[3] ? m[3].length - 1 : 0;
    const grouped = m[2].includes(",");
    if (el._cu) cancelAnimationFrame(el._cu);
    const t0 = performance.now(), D = 850;
    const tick = now => {
      const p = Math.min(1, (now - t0) / D);
      if (p >= 1) { el.textContent = fin; el._cu = 0; return; }
      const e = 1 - Math.pow(1 - p, 4);           // ease-out-quart
      let v = (num * e).toFixed(dec);
      if (grouped) v = (+v).toLocaleString("en-US",
        {minimumFractionDigits: dec, maximumFractionDigits: dec});
      el.textContent = m[1] + v + m[4];
      el._cu = requestAnimationFrame(tick);
    };
    el._cu = requestAnimationFrame(tick);
  });
}

function show(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => s.classList.toggle("on", k === cur));
  // re-trigger entry animations by reflowing the newly shown slide
  void slides[cur].offsetWidth;
  countUps(slides[cur]);
  const n = DECK.slides[cur];
  document.getElementById("notes-body").textContent = n.notes || "—";
  document.getElementById("notes-head").textContent =
    `Slide ${cur+1} of ${slides.length} — ${(n.head || n.company || "").replace(/<[^>]+>/g,"")}`;
  document.getElementById("hud-slide").textContent = `${cur+1}/${slides.length}`;
  document.getElementById("hud-target").textContent = n.target ? `target ${n.target}s` : "";
  location.hash = "s" + (cur + 1);
  if (n.type === "verdict") renderCalc(slides[cur]);
  buildGrid();
  document.getElementById("navPrev").disabled = cur === 0;
  document.getElementById("navNext").disabled = cur === slides.length - 1;
}

function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("nr_deck_theme", t); } catch(e){}
  const b = document.getElementById("navTheme");
  if (b) b.textContent = t === "dark" ? "☀" : "☾";
}
function startClock(){
  t0 = Date.now();
  clearInterval(tick);
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    const c = document.getElementById("hud-clock");
    c.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
    c.classList.toggle("over", s > DECK.totalTarget);
  }, 500);
}
function buildGrid(){
  const g = document.getElementById("grid-cells");
  g.innerHTML = DECK.slides.map((s, i) =>
    `<div class="gc${i===cur?" cur":""}${s.optional?" opt":""}" data-i="${i}">
     <div class="gn">${String(i+1).padStart(2,"0")} · ${s.target||"?"}s</div>
     <div class="gt">${esc((s.head || s.company || "").replace(/<[^>]+>/g,""))}</div>
     ${s.optional?'<span class="go">cut for time</span>':""}</div>`).join("");
  document.getElementById("grid-total").textContent =
    `Full cut ${fmtT(DECK.totalTarget)} · core cut ${fmtT(DECK.coreTarget)} if you drop the ${DECK.optionalCount} marked slides`;
  g.querySelectorAll(".gc").forEach(c => c.onclick = () => {
    show(+c.dataset.i); document.getElementById("grid").classList.remove("on");
  });
}

addEventListener("keydown", e => {
  const gridOn = document.getElementById("grid").classList.contains("on");
  const k = e.key;
  if (k === "Escape") { document.getElementById("grid").classList.remove("on"); return; }
  if (k === "ArrowRight" || k === " " || k === "PageDown") { e.preventDefault(); show(cur + 1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); show(cur - 1); }
  else if (k === "Home") show(0);
  else if (k === "End") show(slides.length - 1);
  else if (k === "t" || k === "T")
    setTheme(document.documentElement.getAttribute("data-theme") === "cream" ? "dark" : "cream");
  else if (k === "n" || k === "N") {
    notesOn = !notesOn; document.getElementById("notes").classList.toggle("on", notesOn);
  }
  else if (k === "h" || k === "H") {
    hudOn = !hudOn; document.getElementById("hud").classList.toggle("on", hudOn);
    if (hudOn && !t0) startClock();
  }
  else if (k === "r" || k === "R") startClock();
  else if (k === "C" && e.shiftKey) {
    if (!camPx()) return;              // nothing reserved, nothing to align to
    camGuideOn = !camGuideOn; drawCamGuide();
  }
  else if (k === "c") setCam(CAM ? null : "left");
  else if ((k === "[" || k === "]") && camPx())
    setCam(CAM, CAMW + (k === "]" ? 0.02 : -0.02));
  else if (k === "g" || k === "G") { document.getElementById("grid").classList.toggle("on"); buildGrid(); }
  else if (k === "f" || k === "F") {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
  // fair-value calculator, only while the verdict slide is up
  else if (DECK.slides[cur].type === "verdict") {
    if (k === "Tab") { e.preventDefault(); selAsm = (selAsm + (e.shiftKey ? 3 : 1)) % 4; renderCalc(slides[cur]); }
    else if (k === "ArrowUp" || k === "ArrowDown") {
      e.preventDefault();
      const a = ASM_KEYS[selAsm], dir = k === "ArrowUp" ? 1 : -1;
      ["bear","base","bull"].forEach(c => liveCases[c][a.k] = +(liveCases[c][a.k] + dir * a.step).toFixed(2));
      renderCalc(slides[cur]);
    }
  }
});

// deep-link + stored theme
const q = new URLSearchParams(location.search);
setTheme(q.get("theme") === "dark" ? "dark"
       : q.get("theme") === "cream" ? "cream"
       : (() => { try { return localStorage.getItem("nr_deck_theme") || "cream"; } catch(e){ return "cream"; } })());
show(location.hash.startsWith("#s") ? (+location.hash.slice(2) - 1) || 0 : 0);
})();
</script>
</body>
</html>
